[workspace]
members = [
    "crates/archflow-core",
    "crates/archflow-diagram",
    "crates/archflow-engine",
    "crates/archflow-logic",       # Logic Bricks system (Epic 1-5)
    "crates/archflow-persistence", # Document persistence layer (EPIC-WEB-012)
    "crates/archflow-sdk",         # NEW: Public SDK API (EPIC-SDK-API)
    "crates/archflow-render",
    "crates/archflow-interaction",
    "crates/archflow-plugins",
    "crates/archflow-export",
    "crates/archflow-text",
    "crates/archflow-wasm-bridge",
    "crates/archflow-web-server",  # Axum web server (Epic 6)
    "crates/archflow-tests",
]
resolver = "2"

# Note: archflow-web-ui is a Vite + React project managed separately via npm
# See: crates/archflow-web-ui/

# ═══════════════════════════════════════════════════════════════════════════════
# ArchFlow Engine v0.30 - Workspace Configuration
# Based on ARQUITECTURA_FINAL_V3.md
# Target: WASM32 (WebGPU/WebGL2 fallback) - 100k objects @ 60FPS
# ═══════════════════════════════════════════════════════════════════════════════

[workspace.package]
version = "0.64.0"
edition = "2024"
rust-version = "1.92"
authors = ["ArchFlow Team"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/hodei-archFlow/archflow"
homepage = "https://archflow.dev"



# ═══════════════════════════════════════════════════════════════════════════════
# DEPENDENCIES - Centralized versions from Architecture V3
# ═══════════════════════════════════════════════════════════════════════════════
[workspace.dependencies]

# ═══════════════════════════════════════════════════════════════════════════════
# Core (no_std compatible)
# ═══════════════════════════════════════════════════════════════════════════════
glam = { version = "0.29", features = ["libm", "scalar-math", "serde"] }
heapless = "0.9.2"
micromath = "2.1"
bitflags = "2.10.0"

# ═══════════════════════════════════════════════════════════════════════════════
# Data Layer (memory management and cache)
# ═══════════════════════════════════════════════════════════════════════════════
fixedbitset = "0.5"
bumpalo = "3.16"

# ═══════════════════════════════════════════════════════════════════════════════
# Rendering (WebGPU + rasterization)
# ═══════════════════════════════════════════════════════════════════════════════
wgpu = { version = "28.0.0", default-features = false, features = [
    "webgl",
    "webgpu",
    "wgsl",
] }
bytemuck = { version = "1.20", features = ["derive"] }
resvg = { version = "0.44", default-features = false, features = ["text"] }
tiny-skia = "0.11"

# ═══════════════════════════════════════════════════════════════════════════════
# Text (shaping and layout - no runtime allocations)
# ═══════════════════════════════════════════════════════════════════════════════
cosmic-text = { version = "0.17.1", features = ["swash"] }

# ═══════════════════════════════════════════════════════════════════════════════
# Plugins (external integrations)
# ═══════════════════════════════════════════════════════════════════════════════
quick-xml = "0.39.0"
flate2 = "1.1.9"
base64 = "0.22"
percent-encoding = "2.3"

# ═══════════════════════════════════════════════════════════════════════════════
# WASM Bridge (communication with JavaScript)
# ═══════════════════════════════════════════════════════════════════════════════
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "CanvasRenderingContext2d",
    "HtmlCanvasElement",
    "HtmlImageElement",
    "HtmlVideoElement",
    "PointerEvent",
    "WheelEvent",
    "KeyboardEvent",
    "OffscreenCanvas",
    "Window",
    "Document",
    "Element",
    "Event",
    "InputEvent",
    "MouseEvent",
    "TouchEvent",
    "console",
    "Performance",
    "Navigator",
    "DomRect",
    "AudioContext",
    "AudioBuffer",
    "AudioBufferSourceNode",
    "OscillatorNode",
    "GainNode",
    "AudioDestinationNode",
    "AudioParam",
] }
js-sys = "0.3"
console_error_panic_hook = "0.1"

# ═══════════════════════════════════════════════════════════════════════════════
# Serialization (zero-copy read/write)
# ═══════════════════════════════════════════════════════════════════════════════
flatbuffers = "24.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3.3"

# ═══════════════════════════════════════════════════════════════════════════════
# Collaboration (CRDT - optional future)
# ═══════════════════════════════════════════════════════════════════════════════
# loro = "0.1"  # Uncomment when CRDT collaboration is implemented

# ═══════════════════════════════════════════════════════════════════════════════
# Error handling
# ═══════════════════════════════════════════════════════════════════════════════
thiserror = "2.0"
anyhow = "1.0"

# ═══════════════════════════════════════════════════════════════════════════════
# Collections optimized for WASM
# ═══════════════════════════════════════════════════════════════════════════════
hashbrown = "0.15"
indexmap = { version = "2.7", features = ["serde"] }

# ═══════════════════════════════════════════════════════════════════════════════
# Utilities
# ═══════════════════════════════════════════════════════════════════════════════
getrandom = { version = "0.4.1", features = ["js"] }
sha2 = "0.10"
constant_time_eq = "0.4.2"

# ═══════════════════════════════════════════════════════════════════════════════
# Benchmarking
# ═══════════════════════════════════════════════════════════════════════════════
criterion = { version = "0.5", features = ["html_reports"] }
array-init = "2.1"
static_assertions = "1.1"

# ═══════════════════════════════════════════════════════════════════════════════
# Diagnostics & Tracing
# ═══════════════════════════════════════════════════════════════════════════════
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
