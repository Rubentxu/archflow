[workspace]
members = [
    "crates/archflow-core",
    "crates/archflow-ecs-hybrid",
    "crates/archflow-geometry",
    "crates/archflow-primitives",
    "crates/archflow-renderer",
    "crates/archflow-renderer-canvas",
    "crates/archflow-renderer-rough",
    "crates/archflow-spatial",
    "crates/archflow-workspace",
    "crates/archflow-wasm",
    "crates/archflow-records",
    "crates/archflow-collab",
]
resolver = "2"

# Configuración del workspace
[workspace.package]
version = "0.6.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
# Versiones centralizadas
bevy_ecs = "0.18"
glam = "0.31"
euclid = "0.22.13"
kurbo = "0.13"
rstar = "0.12"
serde = { version = "1.0", features = ["derive"] }
bincode = { version = "2.0", features = ["serde"] }
zstd = "0.13"
uuid = { version = "1.11", features = ["v4", "serde", "js"], default-features = false }
thiserror = "2.0"
anyhow = "1.0"
wasm-bindgen = "0.2.108"
web-sys = { version = "0.3", features = [
    "CanvasRenderingContext2d",
    "HtmlCanvasElement",
    "HtmlImageElement",
    "HtmlVideoElement",
    "Window",
] }

# WebSys features para rendering
