[package]
name = "archflow-demo-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Internal (optional - demo uses minimal subset)
archflow-records = { path = "../archflow-records" }
archflow-primitives = { path = "../archflow-primitives" }
archflow-renderers = { path = "../archflow-renderers" }
archflow-spatial = { path = "../archflow-spatial" }
archflow-core = { path = "../archflow-core" }

# WASM bindings
wasm-bindgen = "0.2"
js-sys = "0.3"
console_error_panic_hook = "0.1"
getrandom = { version = "0.2", features = ["js"] }

[dependencies.web-sys]
version = "0.3"
features = [
    "console",
    "Window",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "HtmlElement",
    "MouseEvent",
    "KeyboardEvent",
    "WheelEvent",
    "CanvasRenderingContext2d",
    "CanvasGradient",
    "CanvasPattern",
    "ImageData",
    "Path2d",
    "TextMetrics",
    "CssStyleDeclaration",
    "EventTarget",
    "Performance",
    "DomRect",
    "KeyboardEventInit",
    "MouseEventInit",
]

[profile.release]
opt-level = "s"
lto = true
