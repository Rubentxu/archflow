[package]
name = "archflow-core"
version.workspace = true
edition.workspace = true

[dependencies]
# Math (no_std compatible)
glam = { workspace = true }

# Serialization (with std feature only)
serde = { workspace = true, optional = true }

# Error handling (no_std compatible)
thiserror = { workspace = true, optional = true }

# Utilities
static_assertions = { workspace = true }

[features]
default = ["std"]
std = ["thiserror", "serde"]

# ═══════════════════════════════════════════════════════════════════════════════
# ARCHITECTURE NOTES:
# ═══════════════════════════════════════════════════════════════════════════════
# This crate MUST be no_std compatible by default.
# It contains pure, immutable, Copy types that can be used in WASM without std.
#
# Modules:
# - id: EntityId with generational indices (packed u32)
# - math: Vec2, Rect, Color, Transform (re-exports from glam with custom extensions)
# - vo: Value Objects (Position, Size, Bounds, etc.)
# - ports: Trait definitions for Hexagonal Architecture
# ═══════════════════════════════════════════════════════════════════════════════
