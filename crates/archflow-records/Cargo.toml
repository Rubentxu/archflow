[package]
name = "archflow-records"
version = "0.1.0"
edition = "2021"
description = "Records Foundation - Type-safe IDs, fractional indexing, delta management for ArchFlow V2"
readme = "README.md"
repository = "https://github.com/rubentxu/hodei-archFlow"
keywords = ["records", "crdt", "fractional-indexing", "undo-redo"]
categories = ["data-structures", "development-tools"]

[dependencies]
# Core
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"
anyhow = "1.0"

# ID Generation
nanoid = { version = "0.4", optional = true }
uuid = { version = "1.11", features = ["v4", "serde", "js"], default-features = false }

# Performance - F.1: FixedBitSet para ChangeSet
fixedbitset = "0.5"

# Spatial Index (para integración futura)
rstar = { version = "0.12", optional = true }

# Thread safety
parking_lot = "0.12"
dashmap = { version = "6.0", optional = true }

# For derive macro support
derive_more = { version = "1.0", features = ["display", "error"] }

[dev-dependencies]
criterion = "0.5"
proptest = "1.3"

[features]
default = ["nanoid"]
nanoid = ["dep:nanoid"]
spatial = ["rstar"]
threadsafe = ["dashmap"]
