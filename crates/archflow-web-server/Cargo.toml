[package]
name = "archflow-web-server"
version.workspace = true
edition.workspace = true

[dependencies]
archflow-engine = { path = "../archflow-engine" }
archflow-logic = { path = "../archflow-logic" }

# Async runtime
tokio = { version = "1.40", features = ["full"] }

# Web framework
axum = { version = "0.7", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.5", features = ["fs", "cors", "trace"] }
tower-service = "0.3"

# Async utilities
futures = "0.3"

# Serialization
serde = { workspace = true }
serde_json = "1.0"

# MIME type detection
mime_guess = "2.0"

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
