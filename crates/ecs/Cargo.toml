[package]
name = "archflow-ecs"
version.workspace = true
edition.workspace = true
description = "ArchFlow ECS - Bevy ECS integration for ArchFlow"

[dependencies]
# Workspace dependencies
archflow-core = { path = "../core" }
glam = { workspace = true }
serde = { workspace = true }
indexmap = { workspace = true }

# Bevy ECS - standalone ECS from the Bevy game engine
bevy_ecs = "0.18"

# For scheduling and systems
bevy_tasks = "0.15"

[dev-dependencies]
criterion = { workspace = true }
proptest = { workspace = true }
rand = { workspace = true }
fastrand = "2.0"
