[package]
name = "archflow-logic"
version.workspace = true
edition.workspace = true

[dependencies]
# Core types (EntityId, Vec2, etc.) - no_std compatible
archflow-core = { path = "../archflow-core" }

# EntityStore and engine types (needed for sensors)
archflow-engine = { path = "../archflow-engine" }

# Collections optimized for WASM - will be needed for LogicMappingTable (Epic 4)
hashbrown = { workspace = true }
fixedbitset = { workspace = true }

# Serialization for declarative JSON API
serde = { workspace = true }
serde_json = { workspace = true }

# Diagnostics - tracing is not optional in workspace deps
tracing = { workspace = true }

[features]
default = []
tracing = []  # Enable tracing instrumentation (always available, non-optional dependency)
simd = []  # Enable WebAssembly SIMD optimizations
std = []  # Enable std support for JSON API (default enabled by serde_json)

[dev-dependencies]
# Tests only - will be needed for integration tests (Epic 2+)
# archflow-engine = { path = "../archflow-engine" }

# Benchmarking
criterion = { workspace = true, features = ["html_reports"] }

[[bench]]
name = "ecs_benchmark"
harness = false

[lib]
doctest = false
