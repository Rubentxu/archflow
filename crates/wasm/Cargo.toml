[package]
name = "archflow-wasm"
version.workspace = true
edition.workspace = true
description = "ArchFlow WASM - WebAssembly bindings and zero-copy memory sharing"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Workspace dependencies
archflow-core = { path = "../core" }
archflow-ecs = { path = "../ecs" }
archflow-renderer = { path = "../renderer" }
glam = { workspace = true }
serde = { workspace = true }

# WASM bindings
wasm-bindgen = "0.2"

# Web API bindings
web-sys = { version = "0.3", features = [
    "console",
    "Window",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "MouseEvent",
    "KeyboardEvent",
    "Performance",
    "TextMetrics",
    "CanvasRenderingContext2d",
    "CanvasGradient",
    "CanvasPattern",
    "ImageData",
    "Path2d",
] }

# JS types with SharedArrayBuffer support
js-sys = "0.3"

# For async/await in WASM
futures = "0.3"

# For console logging
console_error_panic_hook = "0.1"

# For memory management
wee_alloc = "0.4"

[dev-dependencies]
wasm-bindgen-test = "0.3"
