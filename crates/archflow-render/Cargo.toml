[package]
name = "archflow-render"
version.workspace = true
edition.workspace = true

[dependencies]
archflow-core = { path = "../archflow-core" }
archflow-engine = { path = "../archflow-engine", features = ["tracing"] }
wgpu = { workspace = true }
bytemuck = { workspace = true }
pollster = "0.3"

# Diagnostics - tracing is not optional in workspace deps
tracing = { workspace = true }

[features]
default = []
tracing = []  # Enable tracing instrumentation (always available, non-optional dependency)
