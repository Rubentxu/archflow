[package]
name = "archflow-engine"
version.workspace = true
edition.workspace = true

[dependencies]
archflow-core = { path = "../archflow-core", features = ["std", "serde"] }
fixedbitset = { workspace = true }
heapless = { workspace = true }
serde = { workspace = true, features = ["derive"] }
bincode = { workspace = true }
sha2 = "0.10"
getrandom = { version = "0.2", features = ["js"] }
constant_time_eq = "0.3"
hmac = "0.12"

# Diagnostics - tracing is not optional in workspace deps
tracing = { workspace = true }

[features]
default = []
std = []
tracing = []  # Enable tracing instrumentation (always available, non-optional dependency)

[dev-dependencies]
archflow-core = { path = "../archflow-core", features = ["std", "serde"] }
