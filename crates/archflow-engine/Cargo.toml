[package]
name = "archflow-engine"
version.workspace = true
edition.workspace = true

[dependencies]
archflow-core = { path = "../archflow-core", features = ["std", "serde"] }
fixedbitset = { workspace = true }
heapless = { workspace = true }
serde = { workspace = true, features = ["derive"] }
bincode = { workspace = true }
sha2 = "0.10"
getrandom = { version = "0.2", features = ["js"] }
constant_time_eq = "0.3"
hmac = "0.12"

# Diagnostics - make tracing optional for benchmarks
tracing = { workspace = true, optional = true }

[features]
default = []
std = []
tracing = ["dep:tracing"]  # Enable tracing instrumentation

[dev-dependencies]
archflow-core = { path = "../archflow-core", features = ["std", "serde"] }
archflow-logic = { path = "../archflow-logic" }
criterion = "0.5"
rand = "0.8"

[[bench]]
name = "engine_bench"
harness = false
