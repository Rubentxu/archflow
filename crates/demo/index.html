<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>ArchFlow Engine v2.0 - Interactive Demo</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family:
                    "Segoe UI",
                    system-ui,
                    -apple-system,
                    sans-serif;
                background: linear-gradient(
                    135deg,
                    #0f0f1a 0%,
                    #1a1a2e 50%,
                    #16213e 100%
                );
                min-height: 100vh;
                color: #e2e8f0;
                overflow-x: hidden;
            }

            .app-container {
                display: flex;
                flex-direction: column;
                min-height: 100vh;
            }

            /* Header */
            header {
                background: rgba(15, 15, 26, 0.9);
                backdrop-filter: blur(20px);
                border-bottom: 1px solid rgba(255, 255, 255, 0.1);
                padding: 1rem 2rem;
                position: sticky;
                top: 0;
                z-index: 100;
            }

            .header-content {
                max-width: 1600px;
                margin: 0 auto;
                display: flex;
                justify-content: space-between;
                align-items: center;
                flex-wrap: wrap;
                gap: 1rem;
            }

            .logo {
                display: flex;
                align-items: center;
                gap: 0.75rem;
            }

            .logo h1 {
                font-size: 1.5rem;
                font-weight: 700;
                background: linear-gradient(90deg, #00d4ff, #7c3aed);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                background-clip: text;
            }

            .version-badge {
                background: linear-gradient(135deg, #00d4ff20, #7c3aed20);
                padding: 0.25rem 0.75rem;
                border-radius: 1rem;
                font-size: 0.75rem;
                color: #00d4ff;
                border: 1px solid rgba(0, 212, 255, 0.3);
            }

            /* Stats Bar */
            .stats-bar {
                display: flex;
                gap: 1.5rem;
                flex-wrap: wrap;
            }

            .stat-item {
                display: flex;
                align-items: center;
                gap: 0.5rem;
                font-size: 0.875rem;
                color: #94a3b8;
            }

            .stat-value {
                color: #00d4ff;
                font-weight: 600;
                font-variant-numeric: tabular-nums;
            }

            /* Main Content */
            main {
                flex: 1;
                display: flex;
                gap: 1rem;
                padding: 1rem;
                max-width: 1600px;
                margin: 0 auto;
                width: 100%;
            }

            /* Sidebar */
            .sidebar {
                width: 280px;
                display: flex;
                flex-direction: column;
                gap: 1rem;
            }

            .panel {
                background: rgba(30, 30, 50, 0.8);
                border-radius: 12px;
                border: 1px solid rgba(255, 255, 255, 0.1);
                overflow: hidden;
            }

            .panel-header {
                background: rgba(0, 0, 0, 0.3);
                padding: 0.75rem 1rem;
                font-weight: 600;
                font-size: 0.875rem;
                color: #e2e8f0;
                border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            }

            .panel-content {
                padding: 1rem;
            }

            /* Canvas Container */
            .canvas-wrapper {
                flex: 1;
                min-width: 0;
                display: flex;
                flex-direction: column;
            }

            .canvas-container {
                flex: 1;
                background: #0a0a15;
                border-radius: 16px;
                border: 1px solid rgba(255, 255, 255, 0.1);
                overflow: hidden;
                position: relative;
                min-height: 500px;
            }

            #canvas {
                display: block;
                width: 100%;
                height: 100%;
                cursor: crosshair;
            }

            /* Controls */
            .controls-grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 0.5rem;
            }

            .btn {
                padding: 0.625rem 1rem;
                border-radius: 8px;
                border: none;
                font-size: 0.8125rem;
                font-weight: 500;
                cursor: pointer;
                transition: all 0.2s ease;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 0.5rem;
            }

            .btn-primary {
                background: linear-gradient(135deg, #00d4ff, #0099cc);
                color: white;
            }

            .btn-primary:hover {
                transform: translateY(-2px);
                box-shadow: 0 8px 20px rgba(0, 212, 255, 0.3);
            }

            .btn-secondary {
                background: linear-gradient(135deg, #7c3aed, #5b21b6);
                color: white;
            }

            .btn-secondary:hover {
                transform: translateY(-2px);
                box-shadow: 0 8px 20px rgba(124, 58, 237, 0.3);
            }

            .btn-success {
                background: linear-gradient(135deg, #10b981, #059669);
                color: white;
            }

            .btn-success:hover {
                transform: translateY(-2px);
                box-shadow: 0 8px 20px rgba(16, 185, 129, 0.3);
            }

            .btn-warning {
                background: linear-gradient(135deg, #f59e0b, #d97706);
                color: white;
            }

            .btn-warning:hover {
                transform: translateY(-2px);
                box-shadow: 0 8px 20px rgba(245, 158, 11, 0.3);
            }

            .btn-sm {
                padding: 0.375rem 0.75rem;
                font-size: 0.75rem;
            }

            .btn-block {
                width: 100%;
            }

            /* Zoom Controls */
            .zoom-controls {
                display: flex;
                gap: 0.5rem;
                align-items: center;
            }

            .zoom-display {
                flex: 1;
                text-align: center;
                font-size: 0.875rem;
                color: #94a3b8;
                font-variant-numeric: tabular-nums;
            }

            /* Shape List */
            .shape-list {
                max-height: 200px;
                overflow-y: auto;
            }

            .shape-item {
                display: flex;
                align-items: center;
                gap: 0.5rem;
                padding: 0.5rem;
                border-radius: 6px;
                cursor: pointer;
                transition: background 0.2s;
            }

            .shape-item:hover {
                background: rgba(255, 255, 255, 0.05);
            }

            .shape-color {
                width: 12px;
                height: 12px;
                border-radius: 3px;
            }

            .shape-name {
                flex: 1;
                font-size: 0.8125rem;
            }

            /* Easing Selector */
            .easing-options {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 0.375rem;
            }

            .easing-btn {
                padding: 0.375rem 0.5rem;
                border-radius: 6px;
                border: 1px solid rgba(255, 255, 255, 0.1);
                background: rgba(255, 255, 255, 0.05);
                color: #94a3b8;
                font-size: 0.75rem;
                cursor: pointer;
                transition: all 0.2s;
            }

            .easing-btn:hover {
                background: rgba(255, 255, 255, 0.1);
            }

            .easing-btn.active {
                background: linear-gradient(135deg, #00d4ff20, #7c3aed20);
                border-color: rgba(0, 212, 255, 0.5);
                color: #00d4ff;
            }

            /* Color Picker */
            .color-options {
                display: flex;
                gap: 0.5rem;
                flex-wrap: wrap;
            }

            .color-swatch {
                width: 28px;
                height: 28px;
                border-radius: 6px;
                cursor: pointer;
                border: 2px solid transparent;
                transition: all 0.2s;
            }

            .color-swatch:hover {
                transform: scale(1.1);
            }

            .color-swatch.active {
                border-color: white;
                box-shadow: 0 0 0 2px rgba(0, 212, 255, 0.5);
            }

            /* Loading State */
            .loading {
                position: absolute;
                inset: 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                background: rgba(15, 15, 26, 0.95);
                z-index: 10;
            }

            .spinner {
                width: 48px;
                height: 48px;
                border: 3px solid rgba(255, 255, 255, 0.1);
                border-top-color: #00d4ff;
                border-radius: 50%;
                animation: spin 1s linear infinite;
            }

            @keyframes spin {
                to {
                    transform: rotate(360deg);
                }
            }

            .loading-text {
                margin-top: 1rem;
                color: #94a3b8;
            }

            /* Feature Tags */
            .feature-tags {
                display: flex;
                flex-wrap: wrap;
                gap: 0.5rem;
                margin-top: 0.5rem;
            }

            .feature-tag {
                background: rgba(124, 58, 237, 0.2);
                color: #a78bfa;
                padding: 0.25rem 0.5rem;
                border-radius: 4px;
                font-size: 0.6875rem;
            }

            /* Responsive */
            @media (max-width: 768px) {
                main {
                    flex-direction: column;
                }
                .sidebar {
                    width: 100%;
                    flex-direction: row;
                    flex-wrap: wrap;
                }
                .sidebar .panel {
                    flex: 1;
                    min-width: 250px;
                }
            }
        </style>
    </head>

            <main>

                    <!-- Create Panel -->

                                    <div
                                        class="color-swatch"

                                    <div
                                        class="color-swatch"
                                        style="background: #e74c3c"

                                    ></div>
                                    <div
                                        class="color-swatch"
                                        style="background: #2ecc71"
                                        data-color="#2ecc71"
                                    ></div>
                                    <div
                                        class="color-swatch"
                                        style="background: #f39c12"
                                        data-color="#f39c12"
                                    ></div>
                                    <div
                                        class="color-swatch"
                                        style="background: #1abc9c"

                                    <div

                                    <div

                                    <button

                                    <button

                                    <button

                <div class="canvas-wrapper">
                    <div class="canvas-container" id="canvasContainer">

        <script type="module">
            // Import WASM module
            import init, { ArchFlowEngine } from "./pkg/archflow_wasm.js";

            let engine = null;
            let canvas, ctx;
            let selectedColor = "#3498db";
            let selectedEasing = "ease-in-out";
            let animationId = null;
            let lastTime = 0;

            // Colors for shapes
            const colors = [
                "#3498db",
                "#9b59b6",
                "#e74c3c",
                "#2ecc71",
                "#f39c12",
                "#1abc9c",
                "#e91e63",
                "#00bcd4",
            ];

            // Initialize
            async function main() {
                try {
                    await init();
                    console.log("ArchFlow WASM initialized");

                    canvas = document.getElementById("canvas");
                    ctx = canvas.getContext("2d");

                    // Get container size
                    const container =
                        document.getElementById("canvasContainer");
                    const rect = container.getBoundingClientRect();
                    const width = Math.floor(rect.width) || 800;
                    const height = Math.floor(rect.height) || 500;

                    // Set canvas size
                    canvas.width = width * window.devicePixelRatio;
                    canvas.height = height * window.devicePixelRatio;
                    canvas.style.width = width + "px";
                    canvas.style.height = height + "px";
                    ctx.scale(window.devicePixelRatio, window.devicePixelRatio);

                    // Initialize engine
                    engine = new ArchFlowEngine();
                    engine.configure_canvas(width, height, "#0a0a15");

                    // Hide loading
                    document.getElementById("loading").style.display = "none";

                    // Add click handler
                    canvas.addEventListener("click", handleCanvasClick);

                    // Initial render
                    render();

                    // Start animation loop
                    requestAnimationFrame(animate);

                    // Setup UI
                    setupColorPicker();
                    setupEasingSelector();

                    console.log("ArchFlow Engine v2.0 ready!");
                } catch (error) {
                    console.error("Failed to initialize:", error);
                    document.getElementById("loading").innerHTML = `
                        <div style="color: #ff6b6b; text-align: center;">
                            <p>Failed to load WASM module</p>
                            <p style="font-size: 0.875rem; margin-top: 0.5rem; color: #94a3b8;">${error.message}</p>
                        </div>
                    `;
                }
            }

            // Animation loop
            function animate(timestamp) {
                const delta = timestamp - lastTime;
                lastTime = timestamp;

                if (engine) {
                    engine.update_animations(delta);
                    engine.update_zoom(delta);
                }

                render();
                animationId = requestAnimationFrame(animate);
            }

            // Render function
            function render() {
                if (!engine || !ctx) return;

                const width = canvas.width / window.devicePixelRatio;
                const height = canvas.height / window.devicePixelRatio;

                // Clear canvas
                ctx.fillStyle = "#0a0a15";
                ctx.fillRect(0, 0, width, height);

                // Draw grid
                drawGrid(width, height);

                // Get shapes from engine
                const shapesData = engine.get_all_shapes();
                if (shapesData && Array.isArray(shapesData)) {
                    shapesData.forEach((shape, index) => {
                        drawShape(shape, index);
                    });
                }

                // Draw title
                ctx.fillStyle = "#00d4ff";
                ctx.font = "bold 24px system-ui";
                ctx.fillText("ArchFlow Engine v2.0", 20, 40);

                ctx.fillStyle = "#64748b";
                ctx.font = "14px system-ui";
                ctx.fillText(
                    `Shapes: ${engine.get_shape_count()} | Zoom: ${engine.get_zoom_level()} | Animations active`,
                    20,
                    65,
                );

                // Draw architecture boxes
                drawArchitecture(width, height);

                // Update stats
                updateStats();
            }

            // Draw grid
            function drawGrid(width, height) {
                const gridSize = parseFloat(
                    document.getElementById("gridSize").textContent,
                );
                ctx.strokeStyle = "rgba(255, 255, 255, 0.05)";
                ctx.lineWidth = 1;

                for (let x = 0; x < width; x += gridSize) {
                    ctx.beginPath();
                    ctx.moveTo(x, 0);
                    ctx.lineTo(x, height);
                    ctx.stroke();
                }

                for (let y = 0; y < height; y += gridSize) {
                    ctx.beginPath();
                    ctx.moveTo(0, y);
                    ctx.lineTo(width, y);
                    ctx.stroke();
                }
            }

            // Draw a shape
            function drawShape(shape, index) {
                ctx.save();

                const centerX = shape.x + shape.width / 2;
                const centerY = shape.y + shape.height / 2;

                // Convert hex to RGB
                const rgb = hexToRgb(shape.color);

                ctx.fillStyle = shape.color;
                ctx.strokeStyle = "rgba(255, 255, 255, 0.2)";
                ctx.lineWidth = 2;

                if (shape.shape_type === "rectangle") {
                    ctx.beginPath();
                    ctx.roundRect(
                        shape.x,
                        shape.y,
                        shape.width,
                        shape.height,
                        8,
                    );
                    ctx.fill();
                    ctx.stroke();

                    // Label
                    ctx.fillStyle = "white";
                    ctx.font = "12px system-ui";
                    ctx.fillText(
                        shape.shape_type,
                        shape.x + 8,
                        shape.y + shape.height / 2 + 4,
                    );
                } else if (shape.shape_type === "ellipse") {
                    ctx.beginPath();
                    ctx.ellipse(
                        centerX,
                        centerY,
                        shape.width / 2,
                        shape.height / 2,
                        0,
                        0,
                        Math.PI * 2,
                    );
                    ctx.fill();
                    ctx.stroke();

                    ctx.fillStyle = "white";
                    ctx.font = "12px system-ui";
                    ctx.fillText(shape.shape_type, centerX - 20, centerY + 4);
                } else if (shape.shape_type === "line") {
                    ctx.beginPath();
                    ctx.moveTo(shape.x, shape.y);
                    ctx.lineTo(shape.x + shape.width, shape.y + shape.height);
                    ctx.strokeStyle = shape.color;
                    ctx.lineWidth = 3;
                    ctx.stroke();
                }

                ctx.restore();
            }

            // Draw architecture diagram
            function drawArchitecture(width, height) {
                const boxWidth = 100;
                const boxHeight = 40;
                const startY = height - 80;

                const crates = [
                    { name: "Core", x: 50, color: "#00d4ff" },
                    { name: "Animation", x: 170, color: "#10b981" },
                    { name: "Zoom", x: 290, color: "#f59e0b" },
                    { name: "API", x: 410, color: "#9b59b6" },
                    { name: "WASM", x: 530, color: "#e91e63" },
                ];

                ctx.fillStyle = "#94a3b8";
                ctx.font = "12px system-ui";
                ctx.fillText("Architecture:", 50, startY - 15);

                crates.forEach((crate, i) => {
                    // Box
                    ctx.fillStyle = crate.color + "40";
                    ctx.strokeStyle = crate.color;
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.roundRect(crate.x, startY, boxWidth, boxHeight, 6);
                    ctx.fill();
                    ctx.stroke();

                    // Text
                    ctx.fillStyle = "white";
                    ctx.font = "bold 12px system-ui";
                    ctx.textAlign = "center";
                    ctx.fillText(
                        crate.name,
                        crate.x + boxWidth / 2,
                        startY + boxHeight / 2 + 4,
                    );
                    ctx.textAlign = "left";

                    // Arrow
                    if (i < crates.length - 1) {
                        ctx.strokeStyle = "rgba(255, 255, 255, 0.2)";
                        ctx.lineWidth = 1;
                        ctx.beginPath();
                        ctx.moveTo(
                            crate.x + boxWidth + 5,
                            startY + boxHeight / 2,
                        );
                        ctx.lineTo(
                            crate.x + boxWidth + 20,
                            startY + boxHeight / 2,
                        );
                        ctx.stroke();
                    }
                });
            }

            // Handle canvas click
            function handleCanvasClick(e) {
                const rect = canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;

                // Snap to grid
                const snapped = engine.snap_to_grid(x, y);

                // Create shape at clicked position
                createShapeAt(snapped[0], snapped[1]);
            }

            // Create shape at position
            function createShapeAt(x, y) {
                const width = 80 + Math.random() * 80;
                const height = 60 + Math.random() * 60;

                let id;
                const type = ["rectangle", "ellipse", "line"][
                    Math.floor(Math.random() * 3)
                ];

                if (type === "rectangle") {
                    id = engine.add_rectangle(
                        x - width / 2,
                        y - height / 2,
                        width,
                        height,
                        selectedColor,
                    );
                } else if (type === "ellipse") {
                    id = engine.add_ellipse(
                        x,
                        y,
                        width / 2,
                        height / 2,
                        selectedColor,
                    );
                } else {
                    id = engine.add_line(x - 40, y, x + 40, y, selectedColor);
                }

                updateShapeList();
                render();
            }

            // Create shape function (global)
            window.createShape = function (type) {
                const container = document.getElementById("canvasContainer");
                const rect = container.getBoundingClientRect();
                const x = 100 + Math.random() * (rect.width - 200);
                const y = 150 + Math.random() * (rect.height - 300);

                let id;
                const width = 80 + Math.random() * 60;
                const height = 60 + Math.random() * 60;

                if (type === "rectangle") {
                    id = engine.add_rectangle(
                        x,
                        y,
                        width,
                        height,
                        selectedColor,
                    );
                } else if (type === "ellipse") {
                    id = engine.add_ellipse(
                        x,
                        y,
                        width / 2,
                        height / 2,
                        selectedColor,
                    );
                } else {
                    id = engine.add_line(
                        x,
                        y - 20,
                        x + width,
                        y + 20,
                        selectedColor,
                    );
                }

                updateShapeList();
                render();
            };

            // Create random shape
            window.createRandom = function () {
                createShape(
                    ["rectangle", "ellipse", "line"][
                        Math.floor(Math.random() * 3)
                    ],
                );
            };

            // Clear canvas
            window.clearCanvas = function () {
                engine.clear_shapes();
                updateShapeList();
                render();
            };

            // Animate all shapes
            window.animateAll = function () {
                const count = engine.get_shape_count();
                for (let i = 0; i < count; i++) {
                    const shape = engine.get_shape(i);
                    if (shape) {
                        const targetX = shape.x + (Math.random() - 0.5) * 100;
                        const targetY = shape.y + (Math.random() - 0.5) * 100;
                        engine.animate_position(
                            shape.id,
                            targetX,
                            targetY,
                            1000,
                            selectedEasing,
                        );
                    }
                }
                render();
            };

            // Pulse animation
            window.pulseAnimation = function () {
                const count = engine.get_shape_count();
                for (let i = 0; i < count; i++) {
                    const shape = engine.get_shape(i);
                    if (shape) {
                        engine.animate_opacity(shape.id, 0.3, 300);
                        setTimeout(() => {
                            engine.animate_opacity(shape.id, 1.0, 300);
                        }, 350);
                    }
                }
                render();
            };

            // Arrange shapes
            window.arrangeShapes = function () {
                const count = engine.get_shape_count();
                const container = document.getElementById("canvasContainer");
                const rect = container.getBoundingClientRect();
                const cols = Math.ceil(Math.sqrt(count));
                const spacing = Math.min(150, (rect.width - 100) / cols);

                for (let i = 0; i < count; i++) {
                    const shape = engine.get_shape(i);
                    if (shape) {
                        const col = i % cols;
                        const row = Math.floor(i / cols);
                        const x = 100 + col * spacing;
                        const y = 120 + row * spacing;
                        engine.animate_position(
                            shape.id,
                            x,
                            y,
                            800,
                            "ease-in-out",
                        );
                    }
                }
                render();
            };

            // Zoom functions
            window.zoomIn = function () {
                engine.zoom_in();
                render();
            };

            window.zoomOut = function () {
                engine.zoom_out();
                render();
            };

            window.zoomTo = function (level) {
                engine.zoom_to(level);
                render();
            };

            // Setup color picker
            function setupColorPicker() {
                const picker = document.getElementById("colorPicker");
                picker.addEventListener("click", (e) => {
                    if (e.target.classList.contains("color-swatch")) {
                        picker
                            .querySelectorAll(".color-swatch")
                            .forEach((s) => s.classList.remove("active"));
                        e.target.classList.add("active");
                        selectedColor = e.target.dataset.color;
                    }
                });
            }

            // Setup easing selector
            function setupEasingSelector() {
                const selector = document.getElementById("easingSelector");
                selector.addEventListener("click", (e) => {
                    if (e.target.classList.contains("easing-btn")) {
                        selector
                            .querySelectorAll(".easing-btn")
                            .forEach((b) => b.classList.remove("active"));
                        e.target.classList.add("active");
                        selectedEasing = e.target.dataset.easing;
                    }
                });
            }

            // Update shape list
            function updateShapeList() {
                const list = document.getElementById("shapeList");
                const count = engine.get_shape_count();

                if (count === 0) {
                    list.innerHTML = `
                        <div style="color: #64748b; font-size: 0.8125rem; text-align: center; padding: 1rem;">
                            No shapes yet. Click "Create" to add!
                        </div>
                    `;
                    return;
                }

                let html = "";
                for (let i = 0; i < count; i++) {
                    const shape = engine.get_shape(i);
                    if (shape) {
                        html += `
                            <div class="shape-item" onclick="highlightShape('${shape.id}')">
                                <div class="shape-color" style="background: ${shape.color}"></div>
                                <span class="shape-name">${shape.shape_type} ${i + 1}</span>
                            </div>
                        `;
                    }
                }
                list.innerHTML = html;
            }

            // Update stats
            function updateStats() {
                document.getElementById("shapeCount").textContent =
                    engine.get_shape_count();
                document.getElementById("animCount").textContent =
                    engine.animation_manager?.len() || 0;
                document.getElementById("gridSize").textContent =
                    engine.snap_helper?.grid_size || 10 + "px";

                const scale = engine.get_zoom_scale();
                const percent = Math.round(scale / 10);
                document.getElementById("zoomLevel").textContent =
                    percent + "%";
                document.getElementById("zoomDisplay").textContent =
                    percent + "% (" + engine.get_zoom_level() + ")";
            }

            // Utility functions
            function hexToRgb(hex) {
                const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(
                    hex,
                );
                return result
                    ? {
                          r: parseInt(result[1], 16),
                          g: parseInt(result[2], 16),
                          b: parseInt(result[3], 16),
                      }
                    : { r: 0, g: 0, b: 0 };
            }

            // Start the app
            main();
        </script>
    </body>
</html>
