<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ArchFlow - Professional diagramming tool with infinite canvas and C4 Model support" />
    <title>ArchFlow - Professional Diagramming</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    
    <!-- Styles -->
    <link rel="stylesheet" href="./styles/main.css" />
    
    <!-- Icons -->
    <script src="https://unpkg.com/@phosphor-icons/core@2.0.2/script.js"></script>
  </head>
  <body>
    <!-- Main Application Container -->
    <div id="app">
      <!-- Toolbar -->
      <header id="toolbar" role="banner">
        <!-- Logo Section -->
        <div class="toolbar-section logo">
          <span class="logo-icon" aria-hidden="true">🎨</span>
          <span class="logo-text">ArchFlow</span>
        </div>
        
        <!-- Tools Section -->
        <div class="toolbar-section tools">
          <button class="tool-btn active" data-tool="select" title="Select (V)" aria-label="Select tool">
            <i class="ph ph-cursor" aria-hidden="true"></i>
            <span class="label">Select</span>
          </button>
          <button class="tool-btn" data-tool="rect" title="Rectangle (R)" aria-label="Rectangle tool">
            <i class="ph ph-square" aria-hidden="true"></i>
            <span class="label">Rect</span>
          </button>
          <button class="tool-btn" data-tool="ellipse" title="Ellipse (O)" aria-label="Ellipse tool">
            <i class="ph ph-circle" aria-hidden="true"></i>
            <span class="label">Ellipse</span>
          </button>
          <button class="tool-btn" data-tool="line" title="Line (L)" aria-label="Line tool">
            <i class="ph ph-line-segment" aria-hidden="true"></i>
            <span class="label">Line</span>
          </button>
          <button class="tool-btn" data-tool="text" title="Text (T)" aria-label="Text tool">
            <i class="ph ph-text-t" aria-hidden="true"></i>
            <span class="label">Text</span>
          </button>
        </div>
        
        <!-- Actions Section -->
        <div class="toolbar-section actions">
          <button class="icon-btn" id="btn-undo" title="Undo (Ctrl+Z)" aria-label="Undo">
            <i class="ph ph-arrow-counter-clockwise" aria-hidden="true"></i>
          </button>
          <button class="icon-btn" id="btn-redo" title="Redo (Ctrl+Y)" aria-label="Redo">
            <i class="ph ph-arrow-clockwise" aria-hidden="true"></i>
          </button>
          <div class="toolbar-separator" aria-hidden="true"></div>
          <button class="icon-btn" id="btn-clear" title="Clear Canvas" aria-label="Clear canvas">
            <i class="ph ph-trash" aria-hidden="true"></i>
          </button>
        </div>
        
        <div class="toolbar-spacer" aria-hidden="true"></div>
        
        <!-- Zoom Section -->
        <div class="toolbar-section zoom">
          <button class="icon-btn" id="zoom-out" title="Zoom Out" aria-label="Zoom out">
            <i class="ph ph-minus" aria-hidden="true"></i>
          </button>
          <span class="zoom-level" id="zoom-level" aria-live="polite">100%</span>
          <button class="icon-btn" id="zoom-in" title="Zoom In" aria-label="Zoom in">
            <i class="ph ph-plus" aria-hidden="true"></i>
          </button>
          <button class="tool-btn" id="zoom-fit" title="Fit to Screen">
            <span class="label">Fit</span>
          </button>
        </div>
      </header>
      
      <!-- Library Panel (Component Library) -->
      <aside id="library-panel" aria-label="Component Library">
        <!-- Search -->
        <div class="library-search">
          <div class="library-search-input">
            <i class="ph ph-magnifying-glass library-search-icon" aria-hidden="true"></i>
            <input 
              type="text" 
              id="library-search-input" 
              placeholder="Search components..." 
              aria-label="Search components"
            />
            <div class="library-search-actions">
              <button class="library-search-btn" id="library-settings" title="Library Settings" aria-label="Library settings">
                <i class="ph ph-gear" aria-hidden="true"></i>
              </button>
            </div>
          </div>
        </div>
        
        <!-- Categories -->
        <div class="library-categories" id="library-categories">
          <!-- Categories will be populated dynamically -->
        </div>
        
        <!-- Footer -->
        <div class="library-footer">
          <button class="import-library-btn" id="import-library" title="Import Custom Library">
            <i class="ph ph-plus" aria-hidden="true"></i>
            <span>Import Library</span>
          </button>
        </div>
      </aside>
      
      <!-- Sidebar (Tool Palette + Layers) -->
      <aside id="sidebar" aria-label="Tools and Layers">
        <!-- Tool Palette -->
        <div class="tool-palette">
          <button class="tool-icon active" data-tool="select" title="Select (V)" aria-label="Select tool">
            <i class="ph ph-cursor" aria-hidden="true"></i>
          </button>
          <button class="tool-icon" data-tool="rect" title="Rectangle (R)" aria-label="Rectangle tool">
            <i class="ph ph-square" aria-hidden="true"></i>
          </button>
          <button class="tool-icon" data-tool="ellipse" title="Ellipse (O)" aria-label="Ellipse tool">
            <i class="ph ph-circle" aria-hidden="true"></i>
          </button>
          <button class="tool-icon" data-tool="line" title="Line (L)" aria-label="Line tool">
            <i class="ph ph-line-segment" aria-hidden="true"></i>
          </button>
          <button class="tool-icon" data-tool="text" title="Text (T)" aria-label="Text tool">
            <i class="ph ph-text-t" aria-hidden="true"></i>
          </button>
          <button class="tool-icon" data-tool="pencil" title="Pencil (P)" aria-label="Pencil tool">
            <i class="ph ph-pencil-simple" aria-hidden="true"></i>
          </button>
          
          <div class="sidebar-separator" aria-hidden="true"></div>
          
          <button class="tool-icon" data-tool="hand" title="Pan (Space)" aria-label="Pan tool">
            <i class="ph ph-hand-grabbing" aria-hidden="true"></i>
          </button>
        </div>
        
        <!-- Layers Panel -->
        <div id="layers-panel">
          <div class="panel-header">
            <span class="panel-header-title">Layers</span>
            <button class="icon-btn" id="btn-add-layer" title="Add Layer" aria-label="Add layer">
              <i class="ph ph-plus" aria-hidden="true"></i>
            </button>
          </div>
          <div class="panel-content" id="layers-list">
            <!-- Layers will be populated dynamically -->
          </div>
        </div>
      </aside>
      
      <!-- Canvas Area -->
      <main id="canvas-area" role="main" aria-label="Canvas">
        <canvas id="canvas" aria-label="Drawing canvas"></canvas>
        <div id="cursors-overlay" aria-hidden="true"></div>
        <div id="selection-overlay" aria-hidden="true"></div>
      </main>
      
      <!-- Properties Panel -->
      <aside id="properties" aria-label="Properties">
        <!-- Transform Section -->
        <div class="panel-section" id="transform-panel">
          <div class="section-header" role="button" tabindex="0" aria-expanded="true">
            <span class="section-title">Transform</span>
            <i class="ph ph-caret-down section-toggle" aria-hidden="true"></i>
          </div>
          <div class="section-content">
            <div class="field-row">
              <label class="field-label">X</label>
              <div class="field-input">
                <input type="number" id="prop-x" value="0" step="1" aria-label="X position" />
              </div>
              <label class="field-label">Y</label>
              <div class="field-input">
                <input type="number" id="prop-y" value="0" step="1" aria-label="Y position" />
              </div>
            </div>
            <div class="field-row">
              <label class="field-label">W</label>
              <div class="field-input">
                <input type="number" id="prop-width" value="100" step="1" aria-label="Width" />
              </div>
              <label class="field-label">H</label>
              <div class="field-input">
                <input type="number" id="prop-height" value="100" step="1" aria-label="Height" />
              </div>
            </div>
            <div class="field-row">
              <label class="field-label">Rotation</label>
              <div class="field-input">
                <input type="number" id="prop-rotation" value="0" step="1" aria-label="Rotation" />
              </div>
              <span>°</span>
            </div>
            <label class="checkbox-field">
              <input type="checkbox" id="prop-lock-aspect" aria-label="Lock aspect ratio" />
              <span class="checkbox-label">Lock aspect ratio</span>
            </label>
          </div>
        </div>
        
        <!-- Appearance Section -->
        <div class="panel-section" id="appearance-panel">
          <div class="section-header" role="button" tabindex="0" aria-expanded="true">
            <span class="section-title">Appearance</span>
            <i class="ph ph-caret-down section-toggle" aria-hidden="true"></i>
          </div>
          <div class="section-content">
            <div class="field-row">
              <label class="field-label">Fill</label>
              <div class="color-picker">
                <div class="color-preview" id="prop-fill-preview" style="background-color: #3366cc;" role="button" tabindex="0" aria-label="Select fill color"></div>
                <span class="color-value" id="prop-fill-value">#3366cc</span>
              </div>
            </div>
            <div class="field-row">
              <label class="field-label">Stroke</label>
              <div class="color-picker">
                <div class="color-preview" id="prop-stroke-preview" style="background-color: #ffffff;" role="button" tabindex="0" aria-label="Select stroke color"></div>
                <span class="color-value" id="prop-stroke-value">#ffffff</span>
              </div>
            </div>
            <div class="field-row slider-field">
              <label class="field-label">Width</label>
              <input type="range" id="prop-stroke-width" min="0" max="10" value="1" aria-label="Stroke width" />
              <span class="slider-value" id="stroke-width-value">1px</span>
            </div>
            <div class="field-row slider-field">
              <label class="field-label">Opacity</label>
              <input type="range" id="prop-opacity" min="0" max="100" value="100" aria-label="Opacity" />
              <span class="slider-value" id="opacity-value">100%</span>
            </div>
          </div>
        </div>
        
        <!-- Alignment Section -->
        <div class="panel-section" id="alignment-panel">
          <div class="section-header" role="button" tabindex="0" aria-expanded="true">
            <span class="section-title">Align</span>
            <i class="ph ph-caret-down section-toggle" aria-hidden="true"></i>
          </div>
          <div class="section-content">
            <div class="alignment-grid">
              <button class="align-btn" data-align="left" title="Align Left" aria-label="Align left">
                <i class="ph ph-align-left" aria-hidden="true"></i>
              </button>
              <button class="align-btn" data-align="center-h" title="Center Horizontally" aria-label="Center horizontally">
                <i class="ph ph-align-center-horizontal" aria-hidden="true"></i>
              </button>
              <button class="align-btn" data-align="right" title="Align Right" aria-label="Align right">
                <i class="ph ph-align-right" aria-hidden="true"></i>
              </button>
              <button class="align-btn" data-align="top" title="Align Top" aria-label="Align top">
                <i class="ph ph-align-top" aria-hidden="true"></i>
              </button>
              <button class="align-btn" data-align="center-v" title="Center Vertically" aria-label="Center vertically">
                <i class="ph ph-align-center-vertical" aria-hidden="true"></i>
              </button>
              <button class="align-btn" data-align="bottom" title="Align Bottom" aria-label="Align bottom">
                <i class="ph ph-align-bottom" aria-hidden="true"></i>
              </button>
            </div>
            <div class="action-row">
              <button class="action-btn" id="btn-distribute-h" title="Distribute Horizontally">
                <i class="ph ph-arrows-horizontal" aria-hidden="true"></i>
                Distribute H
              </button>
              <button class="action-btn" id="btn-distribute-v" title="Distribute Vertically">
                <i class="ph ph-arrows-vertical" aria-hidden="true"></i>
                Distribute V
              </button>
            </div>
          </div>
        </div>
      </aside>
      
      <!-- Status Bar -->
      <footer id="statusbar" role="contentinfo">
        <div class="status-section">
          <span class="status-item">
            <span class="status-label">Shapes:</span>
            <span class="status-value" id="status-shape-count">0</span>
          </span>
          <span class="status-item">
            <span class="status-label">Selected:</span>
            <span class="status-value" id="status-selected-count">0</span>
          </span>
        </div>
        
        <div class="status-section">
          <span class="status-item">
            <span class="status-label">Pos:</span>
            <span class="status-value" id="status-position">0, 0</span>
          </span>
          <span class="status-item">
            <span class="status-label">Zoom:</span>
            <span class="status-value" id="status-zoom">100%</span>
          </span>
        </div>
        
        <div class="status-section">
          <button class="status-btn active" id="toggle-grid" title="Toggle Grid" aria-pressed="true">
            Grid: ON
          </button>
          <button class="status-btn active" id="toggle-snap" title="Toggle Snap" aria-pressed="true">
            Snap: ON
          </button>
        </div>
      </footer>
    </div>
    
    <!-- Context Menu (Hidden by default) -->
    <div id="context-menu" class="hidden" role="menu" aria-hidden="true">
      <div class="menu-item" role="menuitem" data-action="copy">
        <span>Copy</span>
        <span class="menu-shortcut">Ctrl+C</span>
      </div>
      <div class="menu-item" role="menuitem" data-action="cut">
        <span>Cut</span>
        <span class="menu-shortcut">Ctrl+X</span>
      </div>
      <div class="menu-item" role="menuitem" data-action="paste">
        <span>Paste</span>
        <span class="menu-shortcut">Ctrl+V</span>
      </div>
      <div class="menu-separator" role="separator"></div>
      <div class="menu-item" role="menuitem" data-action="duplicate">
        <span>Duplicate</span>
        <span class="menu-shortcut">Ctrl+D</span>
      </div>
      <div class="menu-separator" role="separator"></div>
      <div class="menu-item" role="menuitem" data-action="delete">
        <span>Delete</span>
        <span class="menu-shortcut">Del</span>
      </div>
      <div class="menu-separator" role="separator"></div>
      <div class="menu-item" role="menuitem" data-action="bring-forward">
        <span>Bring Forward</span>
        <span class="menu-shortcut">]</span>
      </div>
      <div class="menu-item" role="menuitem" data-action="send-backward">
        <span>Send Backward</span>
        <span class="menu-shortcut">[</span>
      </div>
    </div>

    <!-- Application Scripts -->
    <script type="module" src="./app.js"></script>
  </body>
</html>
