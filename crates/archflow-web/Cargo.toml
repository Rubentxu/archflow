[package]
name = "archflow-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "ArchFlow Web - Professional diagramming web application with component libraries"
authors = ["ArchFlow Team <team@archflow.dev>"]
license = "MIT"
repository = "https://github.com/archflow/archflow"
keywords = ["diagramming", "canvas", "web", "wasm", "c4-model"]
categories = ["graphics", "web-programming", "visualization"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Internal
archflow-sdk = { path = "../archflow-sdk", features = ["wasm"] }
archflow-core = { path = "../archflow-core" }

# WASM bindings
wasm-bindgen = { version = "0.2", features = ["serde-serialize"] }
js-sys = "0.3"
console_error_panic_hook = "0.1"
getrandom = { version = "0.2", features = ["js"] }
serde-wasm-bindgen = "0.6"

# Logging
log = "0.4"
console_log = "1.0"

# TypeScript generation
ts-rs = { version = "10.1", features = ["serde-json-impl"] }
serde = { workspace = true }

[dependencies.web-sys]
version = "0.3"
features = [
    "console",
    "Window",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "HtmlElement",
    "MouseEvent",
    "KeyboardEvent",
    "WheelEvent",
    "CanvasRenderingContext2d",
    "CanvasGradient",
    "CanvasPattern",
    "ImageData",
    "Path2d",
    "TextMetrics",
    "CssStyleDeclaration",
    "EventTarget",
    "Performance",
    "DomRect",
    "KeyboardEventInit",
    "MouseEventInit",
    "OffscreenCanvas",
    "OffscreenCanvasRenderingContext2d",
]

[profile.release]
opt-level = "s"
lto = true
