[package]
name = "archflow-renderer"
version.workspace = true
edition.workspace = true
description = "ArchFlow Renderer - GPU-accelerated 2D rendering with wgpu"

[dependencies]
# Workspace dependencies
archflow-core = { path = "../core" }
archflow-ecs = { path = "../ecs" }
glam = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }

# GPU rendering with wgpu
wgpu = "28"

# Window and surface management
winit = "0.30"

# Raw window handle for wgpu integration
raw-window-handle = "0.6"

# 2D geometry with lyon for path tessellation
lyon = "1.0"

# Font handling with cosmic-text
cosmic-text = "0.16"

# For text rendering
swash = "0.1"

# For buffer conversions
bytemuck = "1.0"

[dev-dependencies]
criterion = { workspace = true }
proptest = { workspace = true }
fastrand = "2.0"
