[package]
name = "archflow-collab"
version = "0.1.0"
edition = "2021"
authors = ["Hodei Platform Team"]
description = "CRDT-based collaboration system for real-time document editing"
license = "MIT"
repository = "https://github.com/rubentxu/hodei-archFlow"
keywords = ["crdt", "collaboration", "real-time", "sync"]
categories = ["network-programming", "concurrency"]

[dependencies]
# Local dependencies
archflow-records = { path = "../archflow-records" }

# Serialización
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "2.0"
crc32fast = "1.4"

# Concurrencia
tokio = { version = "1.0", features = ["sync", "time"] }
futures = { version = "0.3" }
async-trait = "0.1"

# WebSocket (opcional)
tokio-tungstenite = { version = "0.20", optional = true }

# Métricas y utilidades
parking_lot = "0.12"
dashmap = "6.0"

# Utilities
uuid = { version = "1.11", features = ["v4", "serde"] }
leb128 = "0.2"
tracing = "0.1"
rand = "0.8"

[dev-dependencies]
# Testing
criterion = "0.5"
tokio = { version = "1.0", features = ["test-util", "macros", "time"] }

[features]
default = []
websocket = ["tokio-tungstenite"]

[package.metadata.docs.rs]
all-features = true
