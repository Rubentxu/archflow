[package]
name = "archflow-spatial"
version = "0.1.0"
edition = "2021"
authors = ["Hodei Platform Team"]
description = "Spatial indexing system with R-Tree for efficient queries"
license = "MIT"
repository = "https://github.com/rubentxu/hodei-archFlow"
keywords = ["spatial", "rtree", "viewport", "culling", "queries"]
categories = ["data-structures", "algorithms"]

[dependencies]
# Local dependencies
archflow-records = { path = "../archflow-records" }

# R-Tree implementation
rstar = "0.11"

# Geometry
glam = { version = "0.25", features = ["serde"] }
euclid = { version = "0.22", features = ["serde"] }

# Concurrency
parking_lot = "0.12"
dashmap = "6.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
# Benchmarking
criterion = "0.5"
