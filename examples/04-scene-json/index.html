<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>ArchFlow - Scene JSON</title>
        <style>
            body {
                margin: 0;
                overflow: hidden;
                background: #0f0f1a;
                font-family: monospace;
            }
            canvas {
                display: block;
            }
            #controls {
                position: absolute;
                top: 10px;
                left: 10px;
                background: rgba(0, 0, 0, 0.8);
                padding: 15px;
                border-radius: 8px;
                color: #eee;
                font-size: 12px;
            }
            button {
                background: #00d4ff;
                border: none;
                padding: 8px 16px;
                border-radius: 4px;
                cursor: pointer;
                margin-right: 5px;
                font-weight: bold;
            }
            button:hover {
                background: #00b8e6;
            }
            #status {
                margin-top: 10px;
                color: #00ff88;
            }
        </style>
    </head>
    <body>
        <canvas id="canvas"></canvas>
        <div id="controls">
            <div><strong>Scene Serialization</strong></div>
            <div style="margin-top: 10px">
                <button id="btn-spawn">Spawn 5</button>
                <button id="btn-serialize">Serialize</button>
                <button id="btn-clear">Clear</button>
            </div>
            <div id="status">Click a button</div>
        </div>

        <script type="module">
            import { createEngine } from "../shared/archflow-client.js";

            // ============================================================
            // 04 - Scene JSON
            // ============================================================
            // spawn_entity + set_color to create entities
            // serialize_scene() exports ECS state to JSON
            // clear() resets the scene
            // ============================================================

            const { bridge } = await createEngine("canvas");

            // Color palette for entities
            const colorPalette = [
                0xff6b6b, 0x4ecdc4, 0xffe66d, 0x95e1d3, 0xf38181,
            ];

            document.getElementById("btn-spawn").onclick = () => {
                // Use bulk_spawn with positions and colors for efficient entity creation
                const positions = new Float32Array(5 * 2); // [x0, y0, x1, y1, ...]
                const sizes = new Float32Array(5);
                const colors = new Uint8Array(5 * 4); // [r0, g0, b0, a0, r1, g1, b1, a1, ...]

                for (let i = 0; i < 5; i++) {
                    positions[i * 2] = 100 + i * 120;
                    positions[i * 2 + 1] = 200 + Math.sin(i) * 50;
                    sizes[i] = 50;

                    const c = [
                        0xff6b6b, 0x4ecdc4, 0xffe66d, 0x95e1d3, 0xf38181,
                    ][i];
                    colors[i * 4] = (c >> 16) & 0xff;
                    colors[i * 4 + 1] = (c >> 8) & 0xff;
                    colors[i * 4 + 2] = c & 0xff;
                    colors[i * 4 + 3] = 255;
                }

                bridge.bulk_spawn(positions, sizes, colors);
                document.getElementById("status").textContent =
                    `Spawned 5 entities (total: ${bridge.entity_count()})`;
            };

            document.getElementById("btn-serialize").onclick = () => {
                const json = bridge.serialize_scene();
                console.log("Scene JSON:", JSON.parse(json));
                document.getElementById("status").textContent =
                    "Serialized to console (F12)";
            };

            document.getElementById("btn-clear").onclick = () => {
                bridge.clear();
                document.getElementById("status").textContent = "Cleared";
            };
        </script>
    </body>
</html>
