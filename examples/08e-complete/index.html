<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>ArchFlow - Logic Bricks: Complete</title>
        <style>
            @import url("https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Outfit:wght@300;400;600&display=swap");

            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                overflow: hidden;
                background: #0a0a0f;
                font-family: "Outfit", sans-serif;
                display: flex;
                flex-direction: column;
                align-items: center;
                min-height: 100vh;
            }

            h1 {
                color: #00d4ff;
                font-size: 24px;
                margin: 20px 0 10px;
                font-weight: 600;
                letter-spacing: 1px;
            }

            .subtitle {
                color: #888;
                font-size: 14px;
                margin-bottom: 20px;
                font-family: "JetBrains Mono", monospace;
            }

            canvas {
                display: block;
                border: 2px solid rgba(0, 212, 255, 0.3);
                border-radius: 8px;
                box-shadow: 0 0 40px rgba(0, 212, 255, 0.1);
            }

            .panel {
                position: absolute;
                top: 80px;
                left: 20px;
                background: linear-gradient(
                    135deg,
                    rgba(15, 15, 25, 0.95),
                    rgba(20, 20, 35, 0.95)
                );
                border: 1px solid rgba(155, 89, 182, 0.3);
                border-radius: 12px;
                padding: 20px;
                color: #e0e0e0;
                font-size: 12px;
                min-width: 260px;
                backdrop-filter: blur(10px);
            }

            .panel h3 {
                color: #b569d2;
                font-size: 14px;
                margin-bottom: 15px;
                text-transform: uppercase;
                letter-spacing: 1px;
            }

            .logic-chain {
                margin: 10px 0;
                padding: 12px;
                background: rgba(255, 255, 255, 0.03);
                border-radius: 8px;
            }

            .chain-title {
                font-family: "JetBrains Mono", monospace;
                font-size: 11px;
                color: #ffd93d;
                margin-bottom: 8px;
            }

            .chain-flow {
                display: flex;
                align-items: center;
                gap: 6px;
                font-size: 10px;
            }

            .chain-element {
                padding: 4px 8px;
                border-radius: 4px;
                background: rgba(255, 255, 255, 0.05);
            }

            .chain-element.sensor {
                color: #00d4ff;
            }
            .chain-element.controller {
                color: #ffd93d;
            }
            .chain-element.actuator {
                color: #00ff88;
            }
            .chain-arrow {
                color: #666;
            }

            .event-log {
                position: absolute;
                top: 80px;
                right: 20px;
                background: linear-gradient(
                    135deg,
                    rgba(15, 15, 25, 0.95),
                    rgba(20, 20, 35, 0.95)
                );
                border: 1px solid rgba(0, 212, 255, 0.3);
                border-radius: 12px;
                padding: 20px;
                color: #e0e0e0;
                font-size: 11px;
                min-width: 220px;
                max-height: 300px;
                overflow-y: auto;
                backdrop-filter: blur(10px);
            }

            .event-log h3 {
                color: #00d4ff;
                font-size: 14px;
                margin-bottom: 15px;
                text-transform: uppercase;
                letter-spacing: 1px;
            }

            .log-entry {
                padding: 6px 8px;
                margin: 4px 0;
                background: rgba(0, 0, 0, 0.3);
                border-radius: 4px;
                font-family: "JetBrains Mono", monospace;
                font-size: 10px;
                border-left: 2px solid #444;
            }

            .log-entry.hover {
                border-left-color: #00d4ff;
            }
            .log-entry.click {
                border-left-color: #00ff88;
            }
            .log-entry.select {
                border-left-color: #ffd93d;
            }

            .legend {
                position: absolute;
                bottom: 20px;
                left: 50%;
                transform: translateX(-50%);
                display: flex;
                gap: 30px;
                background: rgba(15, 15, 25, 0.9);
                border: 1px solid rgba(0, 212, 255, 0.2);
                border-radius: 8px;
                padding: 12px 24px;
            }

            .legend-item {
                display: flex;
                align-items: center;
                gap: 8px;
                font-size: 12px;
                color: #888;
            }

            .legend-item .key {
                background: rgba(0, 212, 255, 0.2);
                padding: 4px 10px;
                border-radius: 4px;
                color: #00d4ff;
                font-family: "JetBrains Mono", monospace;
            }
        </style>
    </head>
    <body>
        <h1>Logic Bricks: Complete</h1>
        <div class="subtitle">Sistema Completo Estilo BGE</div>

        <canvas id="canvas" width="900" height="500"></canvas>

        <div class="panel">
            <h3>Logic Chains</h3>

            <div class="logic-chain">
                <div class="chain-title">Main Entity</div>
                <div class="chain-flow">
                    <span class="chain-element sensor">MouseOver</span>
                    <span class="chain-arrow">→</span>
                    <span class="chain-element controller">AND</span>
                    <span class="chain-arrow">→</span>
                    <span class="chain-element actuator">Highlight</span>
                </div>
                <div class="chain-flow" style="margin-top: 6px">
                    <span class="chain-element sensor">MouseClick</span>
                    <span class="chain-arrow">→</span>
                    <span class="chain-element controller">OR</span>
                    <span class="chain-arrow">→</span>
                    <span class="chain-element actuator">Select+Sound</span>
                </div>
            </div>

            <div class="logic-chain">
                <div class="chain-title">Control Entity</div>
                <div class="chain-flow">
                    <span class="chain-element sensor">KeyShortcut</span>
                    <span class="chain-arrow">→</span>
                    <span class="chain-element controller">Direct</span>
                    <span class="chain-arrow">→</span>
                    <span class="chain-element actuator">Move</span>
                </div>
            </div>
        </div>

        <div class="event-log" id="event-log">
            <h3>Event Log</h3>
            <div id="log-entries">
                <div class="log-entry">Sistema inicializado...</div>
            </div>
        </div>

        <div class="legend">
            <div class="legend-item">
                <span class="key">Hover</span>
                <span>Highlight</span>
            </div>
            <div class="legend-item">
                <span class="key">Click</span>
                <span>Select</span>
            </div>
            <div class="legend-item">
                <span class="key">Space</span>
                <span>Resetea</span>
            </div>
        </div>

        <script type="module">
            import { createEngine } from "../shared/archflow-client.js";

            // ============================================================
            // 08e - Logic Bricks: Complete System
            // ============================================================
            // Sistema completo estilo Blender Game Engine
            // Múltiples sensores → Controladores → Actuadores
            //
            // Este ejemplo demuestra:
            // - Entidad principal con múltiples sensores
            // - Controladores AND, OR
            // - Múltiples actuadores (Highlight, Select)
            // - Entidad de control con keyboard
            // ============================================================

            const { bridge, canvas } = await createEngine("canvas");

            // Event log
            const logEntries = document.getElementById("log-entries");
            function addLogEntry(message, type = "") {
                const entry = document.createElement("div");
                entry.className = `log-entry ${type}`;
                const time = new Date().toLocaleTimeString();
                entry.textContent = `[${time}] ${message}`;
                logEntries.insertBefore(entry, logEntries.firstChild);

                // Keep only last 10 entries
                while (logEntries.children.length > 10) {
                    logEntries.removeChild(logEntries.lastChild);
                }
            }

            addLogEntry("Inicializando sistema BGE...");

            // Use bulk_spawn + batch_configure_entities for efficient entity creation
            const count = 3;
            const positions = new Float32Array([
                450,
                250, // Main entity (center)
                750,
                250, // Control entity (right)
                150,
                250, // Info entity (left)
            ]);
            const sizes = new Float32Array([100, 60, 60]);
            const colors = new Uint32Array([
                0xffb2599b, // Purple: 0xRRGGBBAA (155, 89, 182, 255)
                0xff71cc2e, // Green: 0xRRGGBBAA (46, 204, 113, 255)
                0xffd39834, // Blue: 0xRRGGBBAA (52, 152, 219, 255)
            ]);
            const shapes = new Uint8Array([1, 0, 1]); // circle, rect, circle

            const ids = bridge.bulk_spawn(positions, sizes, colors);

            // Configure with shapes
            const xs = new Float32Array([450, 750, 150]);
            const ys = new Float32Array([250, 250, 250]);
            const widths = new Float32Array([100, 60, 60]);
            const heights = new Float32Array([100, 60, 60]);
            const vxs = new Float32Array([0, 0, 0]);
            const vys = new Float32Array([0, 0, 0]);
            const axs = new Float32Array([0, 0, 0]);
            const ays = new Float32Array([0, 0, 0]);

            bridge.batch_configure_entities(
                ids,
                xs,
                ys,
                widths,
                heights,
                vxs,
                vys,
                axs,
                ays,
                colors,
                shapes,
            );

            const mainEntity = ids[0];
            const controlEntity = ids[1];
            const infoEntity = ids[2];

            // Add labels
            bridge.set_label(mainEntity, "Main Entity");
            bridge.set_label(controlEntity, "Control");
            bridge.set_label(infoEntity, "Info");

            // Chain 1: MouseOver -> AND -> Highlight
            bridge.add_sensor(mainEntity, 0, 1, 0); // sensor=0 (MouseOver), controller=1 (AND), actuator=0 (Highlight)

            // Chain 2: MouseClick -> OR -> Select
            bridge.add_sensor(mainEntity, 1, 2, 1); // sensor=1 (Click), controller=2 (OR), actuator=1 (Select)

            // Chain 3: RightClick -> Direct -> Delete
            bridge.add_sensor(mainEntity, 8, 0, 3); // sensor=8 (RightClick), actuator=3 (Delete)

            addLogEntry("Entidad principal creada", "hover");

            // Key shortcut sensor (Space key)
            bridge.add_sensor(controlEntity, 3, 0, 0); // sensor=3 (KeyShortcut), actuator=0 (Highlight)

            addLogEntry("Entidad de control creada");

            // Hover to show info
            bridge.add_sensor(infoEntity, 0, 0, 0);

            addLogEntry("Entidad de información creada");

            // Track hover state
            let hoveredEntity = null;

            canvas.addEventListener("pointermove", (e) => {
                const rect = canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;

                // Simple hover detection
                const allEntities = bridge.get_alive_entities();
                if (allEntities && allEntities.length > 0) {
                    for (const id of allEntities) {
                        const pos = bridge.get_entity_position_screen(id);
                        const size = bridge.get_entity_size_screen(id);
                        if (
                            pos &&
                            size &&
                            pos.length >= 2 &&
                            size.length >= 2
                        ) {
                            const halfW = size[0] / 2;
                            const halfH = size[1] / 2;
                            if (
                                x >= pos[0] - halfW &&
                                x <= pos[0] + halfW &&
                                y >= pos[1] - halfH &&
                                y <= pos[1] + halfH
                            ) {
                                if (hoveredEntity !== id) {
                                    hoveredEntity = id;
                                    const label = bridge.get_entity_label(id);
                                    if (label) {
                                        addLogEntry(`Hover: ${label}`, "hover");
                                    }
                                }
                                break;
                            }
                        }
                    }
                }
            });

            canvas.addEventListener("click", () => {
                addLogEntry("Click detectado", "click");

                const selected = bridge.get_selection();
                if (selected && selected.length > 0) {
                    addLogEntry(`Seleccionados: ${selected.length}`, "select");
                }
            });

            // Keyboard handler
            window.addEventListener("keydown", (e) => {
                if (e.code === "Space") {
                    e.preventDefault();
                    addLogEntry("Space presionado - Reseteando", "click");

                    // Deselect all
                    const selected = bridge.get_selection();
                    if (selected) {
                        for (const id of selected) {
                            bridge.set_selected(id, false);
                        }
                    }

                    addLogEntry("Selección limpiada", "select");
                }
            });

            console.log("08e-complete: Full BGE-style Logic Bricks system");
            console.log(
                "Main entity + Control entity + Info entity with full sensor chains",
            );
        </script>
    </body>
</html>
