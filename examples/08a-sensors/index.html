<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>ArchFlow - Logic Bricks: Sensores</title>
        <style>
            @import url("https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Outfit:wght@300;400;600&display=swap");

            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                overflow: hidden;
                background: #0a0a0f;
                font-family: "Outfit", sans-serif;
                display: flex;
                flex-direction: column;
                align-items: center;
                min-height: 100vh;
            }

            h1 {
                color: #00d4ff;
                font-size: 24px;
                margin: 20px 0 10px;
                font-weight: 600;
                letter-spacing: 1px;
            }

            .subtitle {
                color: #888;
                font-size: 14px;
                margin-bottom: 20px;
                font-family: "JetBrains Mono", monospace;
            }

            canvas {
                display: block;
                border: 2px solid rgba(0, 212, 255, 0.3);
                border-radius: 8px;
                box-shadow: 0 0 40px rgba(0, 212, 255, 0.1);
            }

            .panel {
                position: absolute;
                top: 80px;
                left: 20px;
                background: linear-gradient(
                    135deg,
                    rgba(15, 15, 25, 0.95),
                    rgba(20, 20, 35, 0.95)
                );
                border: 1px solid rgba(0, 212, 255, 0.3);
                border-radius: 12px;
                padding: 20px;
                color: #e0e0e0;
                font-size: 13px;
                min-width: 280px;
                backdrop-filter: blur(10px);
            }

            .panel h3 {
                color: #00d4ff;
                font-size: 14px;
                margin-bottom: 15px;
                text-transform: uppercase;
                letter-spacing: 1px;
            }

            .sensor-item {
                display: flex;
                align-items: center;
                padding: 10px;
                margin: 8px 0;
                background: rgba(255, 255, 255, 0.03);
                border-radius: 8px;
                border-left: 3px solid #444;
                transition: all 0.3s ease;
            }

            .sensor-item.active {
                border-left-color: #00ff88;
                background: rgba(0, 255, 136, 0.1);
            }

            .sensor-item .name {
                font-family: "JetBrains Mono", monospace;
                font-size: 12px;
                color: #aaa;
                flex: 1;
            }

            .sensor-item .status {
                width: 10px;
                height: 10px;
                border-radius: 50%;
                background: #333;
                transition: all 0.2s ease;
            }

            .sensor-item.active .status {
                background: #00ff88;
                box-shadow: 0 0 10px #00ff88;
            }

            .legend {
                position: absolute;
                bottom: 20px;
                left: 50%;
                transform: translateX(-50%);
                display: flex;
                gap: 30px;
                background: rgba(15, 15, 25, 0.9);
                border: 1px solid rgba(0, 212, 255, 0.2);
                border-radius: 8px;
                padding: 12px 24px;
            }

            .legend-item {
                display: flex;
                align-items: center;
                gap: 8px;
                font-size: 12px;
                color: #888;
            }

            .legend-item .key {
                background: rgba(0, 212, 255, 0.2);
                padding: 4px 10px;
                border-radius: 4px;
                color: #00d4ff;
                font-family: "JetBrains Mono", monospace;
            }
        </style>
    </head>
    <body>
        <h1>Logic Bricks: Sensores</h1>
        <div class="subtitle">MouseHover • MouseClick • KeyShortcut</div>

        <canvas id="canvas" width="900" height="500"></canvas>

        <div class="panel">
            <h3>Sensor Status</h3>
            <div class="sensor-item" id="sensor-hover">
                <span class="name">MouseOver</span>
                <span class="status"></span>
            </div>
            <div class="sensor-item" id="sensor-click">
                <span class="name">MouseClick</span>
                <span class="status"></span>
            </div>
            <div class="sensor-item" id="sensor-key">
                <span class="name">KeyShortcut (Space)</span>
                <span class="status"></span>
            </div>
            <div class="sensor-item" id="sensor-right">
                <span class="name">RightClick</span>
                <span class="status"></span>
            </div>
        </div>

        <div class="legend">
            <div class="legend-item">
                <span class="key">Hover</span>
                <span>Cambia color</span>
            </div>
            <div class="legend-item">
                <span class="key">Click</span>
                <span>Selecciona</span>
            </div>
            <div class="legend-item">
                <span class="key">Space</span>
                <span>Resetea</span>
            </div>
            <div class="legend-item">
                <span class="key">Right-Click</span>
                <span>Elimina</span>
            </div>
        </div>

        <script type="module">
            import { createEngine } from "../shared/archflow-client.js";

            // ============================================================
            // 08a - Logic Bricks: Sensores
            // ============================================================
            // Demuestra: MouseHover, MouseClick, KeyShortcut, RightClick
            //
            // SENSORES disponibles:
            // - sensor_type 0: MouseOver (hover)
            // - sensor_type 1: MouseClick (left click)
            // - sensor_type 2: Proximity
            // - sensor_type 3: KeyShortcut
            // - sensor_type 4: Touch
            // - sensor_type 5: Radar
            // - sensor_type 6: DoubleTap
            // - sensor_type 7: LongPress
            // - sensor_type 8: RightClick
            //
            // CONTROLADORES:
            // - controller_type 0: Direct
            // - controller_type 1: AND
            // - controller_type 2: OR
            // - controller_type 3: NOT
            //
            // ACTUADORES:
            // - actuator_type 0: Highlight
            // - actuator_type 1: Select
            // - actuator_type 2: Move
            // - actuator_type 3: Delete
            // ============================================================

            const { bridge, canvas } = await createEngine("canvas", {
                onFrame: (dt, fps) => {
                    // UI updates can go here
                },
            });

            // Create interactive entities
            const entities = [];
            const colorValues = [
                0xffeb3b3c, // Red: 0xRRGGBBAA (231, 76, 60, 255)
                0xff71cc2e, // Green: 0xRRGGBBAA (46, 204, 113, 255)
                0xffd39834, // Blue: 0xRRGGBBAA (52, 152, 219, 255)
                0xffb2599b, // Purple: 0xRRGGBBAA (155, 89, 182, 255)
                0xff15c4f1, // Yellow: 0xRRGGBBAA (241, 196, 15, 255)
            ];

            // Use bulk_spawn + batch_configure_entities for efficient creation
            const count = 5;
            const positions = new Float32Array(count * 2);
            const sizes = new Float32Array(count);
            const colors = new Uint32Array(count);
            const shapes = new Uint8Array(count);

            for (let i = 0; i < count; i++) {
                positions[i * 2] = 150 + i * 140;
                positions[i * 2 + 1] = 250;
                sizes[i] = 60;
                colors[i] = colorValues[i];
                shapes[i] = 1; // circle
            }

            // Spawn all entities
            const ids = bridge.bulk_spawn(positions, sizes, colors);

            // Configure with shapes
            const xs = new Float32Array(count);
            const ys = new Float32Array(count);
            const widths = new Float32Array(count);
            const heights = new Float32Array(count);
            const vxs = new Float32Array(count);
            const vys = new Float32Array(count);
            const axs = new Float32Array(count);
            const ays = new Float32Array(count);

            for (let i = 0; i < count; i++) {
                xs[i] = positions[i * 2];
                ys[i] = positions[i * 2 + 1];
                widths[i] = sizes[i];
                heights[i] = sizes[i];
                vxs[i] = 0;
                vys[i] = 0;
                axs[i] = 0;
                ays[i] = 0;
            }

            bridge.batch_configure_entities(
                ids,
                xs,
                ys,
                widths,
                heights,
                vxs,
                vys,
                axs,
                ays,
                colors,
                shapes,
            );

            // Add sensors to each entity
            for (let i = 0; i < count; i++) {
                const id = ids[i];
                // Add MouseOver + Highlight: sensor=0, controller=0, actuator=0
                bridge.add_sensor(id, 0, 0, 0);
                // Add MouseClick + Select: sensor=1, controller=0, actuator=1
                bridge.add_sensor(id, 1, 0, 1);
                // Add RightClick + Delete: sensor=8, controller=0, actuator=3
                bridge.add_sensor(id, 8, 0, 3);

                entities.push({ id, originalColor: colorValues[i] });
            }

            // Add keyboard shortcut for reset (Space)
            // We'll handle this via event listener since it's global
            window.addEventListener("keydown", (e) => {
                if (e.code === "Space") {
                    e.preventDefault();
                    // Respawn all deleted entities using bulk_spawn
                    const deletedCount = entities.filter(
                        (e) => !bridge.is_alive(e.id),
                    ).length;
                    if (deletedCount > 0) {
                        const newPositions = new Float32Array(deletedCount * 2);
                        const newSizes = new Float32Array(deletedCount);
                        const newColors = new Uint32Array(deletedCount);
                        let idx = 0;
                        for (let i = 0; i < count; i++) {
                            if (!bridge.is_alive(entities[i].id)) {
                                newPositions[idx * 2] = 150 + i * 140;
                                newPositions[idx * 2 + 1] = 250;
                                newSizes[idx] = 60;
                                newColors[idx] = colorValues[i];
                                idx++;
                            }
                        }
                        const newIds = bridge.bulk_spawn(
                            newPositions,
                            newSizes,
                            newColors,
                        );

                        // Configure and add sensors to new entities
                        const newXs = new Float32Array(deletedCount);
                        const newYs = new Float32Array(deletedCount);
                        const newWidths = new Float32Array(deletedCount);
                        const newHeights = new Float32Array(deletedCount);
                        const zeroArr = new Float32Array(deletedCount);

                        for (let j = 0; j < deletedCount; j++) {
                            newXs[j] = newPositions[j * 2];
                            newYs[j] = newPositions[j * 2 + 1];
                            newWidths[j] = newSizes[j];
                            newHeights[j] = newSizes[j];
                        }

                        const newShapes = new Uint8Array(deletedCount).fill(1);
                        bridge.batch_configure_entities(
                            newIds,
                            newXs,
                            newYs,
                            newWidths,
                            newHeights,
                            zeroArr,
                            zeroArr,
                            zeroArr,
                            zeroArr,
                            newColors,
                            newShapes,
                        );

                        // Track new IDs and add sensors
                        idx = 0;
                        for (let i = 0; i < count; i++) {
                            if (!bridge.is_alive(entities[i].id)) {
                                const newId = newIds[idx++];
                                entities[i].id = newId;
                                bridge.add_sensor(newId, 0, 0, 0);
                                bridge.add_sensor(newId, 1, 0, 1);
                                bridge.add_sensor(newId, 8, 0, 3);
                            }
                        }
                    }
                    updateSensorUI(0, true);
                }
            });

            // Manual sensor status UI update (since we can't easily get sensor state)
            function updateSensorUI(sensorType, active) {
                const ids = [
                    "sensor-hover",
                    "sensor-click",
                    "sensor-key",
                    "sensor-right",
                ];
                if (sensorType < ids.length) {
                    const el = document.getElementById(ids[sensorType]);
                    if (active) {
                        el.classList.add("active");
                        setTimeout(() => el.classList.remove("active"), 200);
                    }
                }
            }

            // Listen for engine events (if available)
            console.log("08a-sensors: Logic Bricks initialized");
            console.log(
                "5 entities with MouseOver, MouseClick, RightClick sensors",
            );
        </script>
    </body>
</html>
