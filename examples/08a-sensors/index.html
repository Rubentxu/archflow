<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>ArchFlow - Logic Bricks: Sensores</title>
        <style>
            @import url("https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Outfit:wght@300;400;600&display=swap");

            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                overflow: hidden;
                background: #0a0a0f;
                font-family: "Outfit", sans-serif;
                display: flex;
                flex-direction: column;
                align-items: center;
                min-height: 100vh;
            }

            h1 {
                color: #00d4ff;
                font-size: 24px;
                margin: 20px 0 10px;
                font-weight: 600;
                letter-spacing: 1px;
            }

            .subtitle {
                color: #888;
                font-size: 14px;
                margin-bottom: 20px;
                font-family: "JetBrains Mono", monospace;
            }

            canvas {
                display: block;
                border: 2px solid rgba(0, 212, 255, 0.3);
                border-radius: 8px;
                box-shadow: 0 0 40px rgba(0, 212, 255, 0.1);
            }

            .panel {
                position: absolute;
                top: 80px;
                left: 20px;
                background: linear-gradient(135deg, rgba(15, 15, 25, 0.95), rgba(20, 20, 35, 0.95));
                border: 1px solid rgba(0, 212, 255, 0.3);
                border-radius: 12px;
                padding: 20px;
                color: #e0e0e0;
                font-size: 13px;
                min-width: 280px;
                backdrop-filter: blur(10px);
            }

            .panel h3 {
                color: #00d4ff;
                font-size: 14px;
                margin-bottom: 15px;
                text-transform: uppercase;
                letter-spacing: 1px;
            }

            .sensor-item {
                display: flex;
                align-items: center;
                padding: 10px;
                margin: 8px 0;
                background: rgba(255, 255, 255, 0.03);
                border-radius: 8px;
                border-left: 3px solid #444;
                transition: all 0.3s ease;
            }

            .sensor-item.active {
                border-left-color: #00ff88;
                background: rgba(0, 255, 136, 0.1);
            }

            .sensor-item .name {
                font-family: "JetBrains Mono", monospace;
                font-size: 12px;
                color: #aaa;
                flex: 1;
            }

            .sensor-item .status {
                width: 10px;
                height: 10px;
                border-radius: 50%;
                background: #333;
                transition: all 0.2s ease;
            }

            .sensor-item.active .status {
                background: #00ff88;
                box-shadow: 0 0 10px #00ff88;
            }

            .legend {
                position: absolute;
                bottom: 20px;
                left: 50%;
                transform: translateX(-50%);
                display: flex;
                gap: 30px;
                background: rgba(15, 15, 25, 0.9);
                border: 1px solid rgba(0, 212, 255, 0.2);
                border-radius: 8px;
                padding: 12px 24px;
            }

            .legend-item {
                display: flex;
                align-items: center;
                gap: 8px;
                font-size: 12px;
                color: #888;
            }

            .legend-item .key {
                background: rgba(0, 212, 255, 0.2);
                padding: 4px 10px;
                border-radius: 4px;
                color: #00d4ff;
                font-family: "JetBrains Mono", monospace;
            }
        </style>
    </head>
    <body>
        <h1>Logic Bricks: Sensores</h1>
        <div class="subtitle">MouseHover • MouseClick • KeyShortcut</div>

        <canvas id="canvas" width="900" height="500"></canvas>

        <div class="panel">
            <h3>Sensor Status</h3>
            <div class="sensor-item" id="sensor-hover">
                <span class="name">MouseOver</span>
                <span class="status"></span>
            </div>
            <div class="sensor-item" id="sensor-click">
                <span class="name">MouseClick</span>
                <span class="status"></span>
            </div>
            <div class="sensor-item" id="sensor-key">
                <span class="name">KeyShortcut (Space)</span>
                <span class="status"></span>
            </div>
            <div class="sensor-item" id="sensor-right">
                <span class="name">RightClick</span>
                <span class="status"></span>
            </div>
        </div>

        <div class="legend">
            <div class="legend-item">
                <span class="key">Hover</span>
                <span>Cambia color</span>
            </div>
            <div class="legend-item">
                <span class="key">Click</span>
                <span>Selecciona</span>
            </div>
            <div class="legend-item">
                <span class="key">Space</span>
                <span>Resetea</span>
            </div>
            <div class="legend-item">
                <span class="key">Right-Click</span>
                <span>Elimina</span>
            </div>
        </div>

        <script type="module">
            import { createEngine } from "../shared/archflow-client.js";

            // ============================================================
            // 08a - Logic Bricks: Sensores
            // ============================================================
            // Demuestra: MouseHover, MouseClick, KeyShortcut, RightClick
            //
            // SENSORES disponibles:
            // - sensor_type 0: MouseOver (hover)
            // - sensor_type 1: MouseClick (left click)
            // - sensor_type 2: Proximity
            // - sensor_type 3: KeyShortcut
            // - sensor_type 4: Touch
            // - sensor_type 5: Radar
            // - sensor_type 6: DoubleTap
            // - sensor_type 7: LongPress
            // - sensor_type 8: RightClick
            //
            // CONTROLADORES:
            // - controller_type 0: Direct
            // - controller_type 1: AND
            // - controller_type 2: OR
            // - controller_type 3: NOT
            //
            // ACTUADORES:
            // - actuator_type 0: Highlight
            // - actuator_type 1: Select
            // - actuator_type 2: Move
            // - actuator_type 3: Delete
            // ============================================================

            const { bridge, canvas } = await createEngine("canvas", {
                onFrame: (dt, fps) => {
                    // UI updates can go here
                }
            });

            // Create interactive entities
            const entities = [];
            const colors = [
                [231, 76, 60],   // Red
                [46, 204, 113],  // Green
                [52, 152, 219],  // Blue
                [155, 89, 182],  // Purple
                [241, 196, 15],  // Yellow
            ];

            // Create 5 entities in a row
            for (let i = 0; i < 5; i++) {
                const id = bridge.spawn_entity(
                    150 + i * 140,
                    250,
                    60,
                    60
                );
                bridge.set_color(id, colors[i][0], colors[i][1], colors[i][2], 255);
                bridge.set_shape(id, 1); // circle

                // Add MouseOver + Highlight
                // sensor=0, controller=0 (Direct), actuator=0 (Highlight)
                bridge.add_sensor(id, 0, 0, 0);

                // Add MouseClick + Select
                // sensor=1, controller=0, actuator=1 (Select)
                bridge.add_sensor(id, 1, 0, 1);

                // Add RightClick + Delete
                // sensor=8, controller=0, actuator=3 (Delete)
                bridge.add_sensor(id, 8, 0, 3);

                entities.push({ id, originalColor: colors[i] });
            }

            // Add keyboard shortcut for reset (Space)
            // We'll handle this via event listener since it's global
            window.addEventListener("keydown", (e) => {
                if (e.code === "Space") {
                    e.preventDefault();
                    // Respawn all deleted entities
                    for (let i = 0; i < 5; i++) {
                        if (!bridge.is_alive(i)) {
                            const id = bridge.spawn_entity(
                                150 + i * 140,
                                250,
                                60,
                                60
                            );
                            bridge.set_color(id, colors[i][0], colors[i][1], colors[i][2], 255);
                            bridge.set_shape(id, 1);
                            bridge.add_sensor(id, 0, 0, 0); // MouseOver -> Highlight
                            bridge.add_sensor(id, 1, 0, 1);  // MouseClick -> Select
                            bridge.add_sensor(id, 8, 0, 3);  // RightClick -> Delete
                        }
                    }
                    updateSensorUI(0, true);
                }
            });

            // Manual sensor status UI update (since we can't easily get sensor state)
            function updateSensorUI(sensorType, active) {
                const ids = ["sensor-hover", "sensor-click", "sensor-key", "sensor-right"];
                if (sensorType < ids.length) {
                    const el = document.getElementById(ids[sensorType]);
                    if (active) {
                        el.classList.add("active");
                        setTimeout(() => el.classList.remove("active"), 200);
                    }
                }
            }

            // Listen for engine events (if available)
            console.log("08a-sensors: Logic Bricks initialized");
            console.log("5 entities with MouseOver, MouseClick, RightClick sensors");
        </script>
    </body>
</html>
