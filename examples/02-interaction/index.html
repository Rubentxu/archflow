<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>ArchFlow - Interaction</title>
        <style>
            body {
                margin: 0;
                overflow: hidden;
                background: #0f0f1a;
                font-family: monospace;
            }
            canvas {
                display: block;
            }
            #info {
                position: absolute;
                top: 10px;
                left: 10px;
                color: #00ff88;
                font-size: 12px;
                background: rgba(0, 0, 0, 0.7);
                padding: 10px;
                border-radius: 4px;
                max-width: 300px;
            }
            .event {
                color: #888;
            }
            .value {
                color: #00d4ff;
            }
        </style>
    </head>
    <body>
        <canvas id="canvas"></canvas>
        <div id="info">
            <div>Input Event Demo</div>
            <div class="event">
                Pointer: <span class="value" id="pointer">-</span>
            </div>
            <div class="event">
                Button: <span class="value" id="buttons">-</span>
            </div>
            <div class="event">
                Wheel: <span class="value" id="wheel">0</span>
            </div>
            <div class="event">
                Method: <span class="value">push_input_event + coalescing</span>
            </div>
        </div>

        <script type="module">
            import { createEngine } from "../shared/archflow-client.js";

            // ============================================================
            // 02 - Interaction
            // ============================================================
            // All input goes through push_input_event() → InputRingBuffer
            // Pointer Events with getCoalescedEvents() for efficiency
            // UI callbacks are optional — just for display
            // ============================================================

            const { bridge } = await createEngine("canvas", {
                onPointerDown(x, y, button) {
                    document.getElementById("pointer").textContent =
                        `${Math.round(x)}, ${Math.round(y)}`;
                    document.getElementById("buttons").textContent =
                        ["L", "M", "R"][button] || "?";
                },
                onPointerMove(x, y) {
                    document.getElementById("pointer").textContent =
                        `${Math.round(x)}, ${Math.round(y)}`;
                },
                onWheel(deltaY) {
                    document.getElementById("wheel").textContent =
                        Math.round(deltaY);
                },
            });
        </script>
    </body>
</html>
