<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>ArchFlow - Hello World</title>
        <style>
            body {
                margin: 0;
                overflow: hidden;
                background: #0f0f1a;
                font-family: monospace;
            }
            canvas {
                display: block;
            }
            #info {
                position: absolute;
                top: 10px;
                left: 10px;
                color: #00ff88;
                font-size: 12px;
                background: rgba(0, 0, 0, 0.7);
                padding: 10px;
                border-radius: 4px;
            }
        </style>
    </head>
    <body>
        <canvas id="canvas"></canvas>
        <div id="info">Initializing...</div>

        <script type="module">
            import { createEngine } from "../shared/archflow-client.js";

            // ============================================================
            // 01 - Hello World
            // ============================================================
            // One line: createEngine() handles EVERYTHING:
            //   WASM loading → WasmBridge → initialize → graphics →
            //   push_input_event ring buffer → resize → render loop
            // ============================================================

            const { bridge } = await createEngine("canvas", {
                onFrame: (dt, fps) => {
                    document.getElementById("info").textContent =
                        `Engine running! FPS: ${fps}`;
                },
            });
        </script>
    </body>
</html>
