<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>ArchFlow - Audio</title>
        <style>
            body {
                margin: 0;
                overflow: hidden;
                background: #0f0f1a;
                font-family: monospace;
            }
            canvas {
                display: block;
            }
            #controls {
                position: absolute;
                top: 10px;
                left: 10px;
                background: rgba(0, 0, 0, 0.8);
                padding: 15px;
                border-radius: 8px;
                color: #eee;
                font-size: 12px;
            }
            button {
                background: #00d4ff;
                border: none;
                padding: 8px 16px;
                border-radius: 4px;
                cursor: pointer;
                margin: 2px;
            }
            button:hover {
                background: #00b8e6;
            }
            #info {
                margin-top: 10px;
                color: #00ff88;
            }
        </style>
    </head>
    <body>
        <canvas id="canvas"></canvas>
        <div id="controls">
            <div><strong>Audio Demo</strong></div>
            <div style="margin-top: 10px">
                <button id="btn-init">Init Audio</button>
                <button id="btn-beep">Beep!</button>
            </div>
            <div id="info">Click Init Audio to start</div>
        </div>

        <script type="module">
            import { createEngine } from "../shared/archflow-client.js";

            // ============================================================
            // 06 - Audio
            // ============================================================
            // init_audio() creates WebAudio context inside WASM
            // play_beep(frequency, duration, volume) synthesizes sound
            // No external audio files — all generated in WASM
            // ============================================================

            const { bridge } = await createEngine("canvas");

            // Visual speaker entity - centered in viewport
            const id = bridge.spawn_entity(200, 200, 80, 80);
            bridge.set_shape(id, 1); // circle
            bridge.set_color(id, 0, 212, 255, 255);

            let audioReady = false;

            document.getElementById("btn-init").onclick = () => {
                audioReady = bridge.init_audio();
                document.getElementById("info").textContent = audioReady
                    ? "Audio ready!"
                    : "Audio failed";
            };

            document.getElementById("btn-beep").onclick = () => {
                if (audioReady) {
                    bridge.play_beep(440, 0.2, 0.5);
                    document.getElementById("info").textContent = "Beep!";
                }
            };
        </script>
    </body>
</html>
