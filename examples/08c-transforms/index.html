<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>ArchFlow - Logic Bricks: Transformaciones</title>
        <style>
            @import url("https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Outfit:wght@300;400;600&display=swap");

            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                overflow: hidden;
                background: #0a0a0f;
                font-family: "Outfit", sans-serif;
                display: flex;
                flex-direction: column;
                align-items: center;
                min-height: 100vh;
            }

            h1 {
                color: #00d4ff;
                font-size: 24px;
                margin: 20px 0 10px;
                font-weight: 600;
                letter-spacing: 1px;
            }

            .subtitle {
                color: #888;
                font-size: 14px;
                margin-bottom: 20px;
                font-family: "JetBrains Mono", monospace;
            }

            canvas {
                display: block;
                border: 2px solid rgba(0, 212, 255, 0.3);
                border-radius: 8px;
                box-shadow: 0 0 40px rgba(0, 212, 255, 0.1);
            }

            .panel {
                position: absolute;
                top: 80px;
                left: 20px;
                background: linear-gradient(135deg, rgba(15, 15, 25, 0.95), rgba(20, 20, 35, 0.95));
                border: 1px solid rgba(0, 212, 255, 0.3);
                border-radius: 12px;
                padding: 20px;
                color: #e0e0e0;
                font-size: 13px;
                min-width: 280px;
                backdrop-filter: blur(10px);
            }

            .panel h3 {
                color: #00d4ff;
                font-size: 14px;
                margin-bottom: 15px;
                text-transform: uppercase;
                letter-spacing: 1px;
            }

            .transform-item {
                display: flex;
                align-items: center;
                padding: 12px;
                margin: 10px 0;
                background: rgba(255, 255, 255, 0.03);
                border-radius: 8px;
                gap: 12px;
            }

            .transform-icon {
                width: 32px;
                height: 32px;
                border-radius: 6px;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 16px;
            }

            .transform-icon.move {
                background: rgba(231, 76, 60, 0.2);
            }
            .transform-icon.rotate {
                background: rgba(46, 204, 113, 0.2);
            }
            .transform-icon.scale {
                background: rgba(52, 152, 219, 0.2);
            }

            .transform-info {
                flex: 1;
            }

            .transform-name {
                font-family: "JetBrains Mono", monospace;
                font-size: 12px;
                color: #fff;
            }

            .transform-desc {
                font-size: 10px;
                color: #666;
            }

            .legend {
                position: absolute;
                bottom: 20px;
                left: 50%;
                transform: translateX(-50%);
                display: flex;
                gap: 30px;
                background: rgba(15, 15, 25, 0.9);
                border: 1px solid rgba(0, 212, 255, 0.2);
                border-radius: 8px;
                padding: 12px 24px;
            }

            .legend-item {
                display: flex;
                align-items: center;
                gap: 8px;
                font-size: 12px;
                color: #888;
            }

            .legend-item .key {
                background: rgba(0, 212, 255, 0.2);
                padding: 4px 10px;
                border-radius: 4px;
                color: #00d4ff;
                font-family: "JetBrains Mono", monospace;
            }
        </style>
    </head>
    <body>
        <h1>Logic Bricks: Transformaciones</h1>
        <div class="subtitle">Move • Rotate • Scale</div>

        <canvas id="canvas" width="900" height="500"></canvas>

        <div class="panel">
            <h3>Transform Actions</h3>

            <div class="transform-item">
                <div class="transform-icon move">→</div>
                <div class="transform-info">
                    <div class="transform-name">Move</div>
                    <div class="transform-desc">Hover to move right</div>
                </div>
            </div>

            <div class="transform-item">
                <div class="transform-icon rotate">↻</div>
                <div class="transform-info">
                    <div class="transform-name">Rotate</div>
                    <div class="transform-desc">Click to rotate 45°</div>
                </div>
            </div>

            <div class="transform-item">
                <div class="transform-icon scale">⤡</div>
                <div class="transform-info">
                    <div class="transform-name">Scale</div>
                    <div class="transform-desc">Double-click to scale</div>
                </div>
            </div>
        </div>

        <div class="legend">
            <div class="legend-item">
                <span class="key">Hover</span>
                <span>Mueve entidad</span>
            </div>
            <div class="legend-item">
                <span class="key">Click</span>
                <span>Rota 45°</span>
            </div>
            <div class="legend-item">
                <span class="key">Double-Click</span>
                <span>Escala 1.5x</span>
            </div>
        </div>

        <script type="module">
            import { createEngine } from "../shared/archflow-client.js";

            // ============================================================
            // 08c - Logic Bricks: Transformaciones
            // ============================================================
            // Demuestra: Move, Rotate, Scale actuators
            //
            // ACTUADORES disponibles:
            // - actuator_type 0: Highlight
            // - actuator_type 1: Select
            // - actuator_type 2: Move
            // - actuator_type 3: Delete
            // - actuator_type 4: Undo
            // - actuator_type 5: Redo
            // - actuator_type 6: Camera
            //
            // SENSORES:
            // - sensor 0: MouseOver
            // - sensor 1: MouseClick
            // - sensor 6: DoubleTap
            // ============================================================

            const { bridge, canvas } = await createEngine("canvas");

            // === MOVE Entity ===
            // Move actuator - set velocity on hover
            const moveEntity = bridge.spawn_entity(200, 250, 60, 60);
            bridge.set_color(moveEntity, 231, 76, 60, 255); // Red
            bridge.set_shape(moveEntity, 0); // rectangle
            // Add sensor with Move actuator
            bridge.add_sensor(moveEntity, 0, 0, 2); // Hover -> Move

            // === ROTATE Entity ===
            // Click to rotate (would need rotation actuator)
            const rotateEntity = bridge.spawn_entity(450, 250, 60, 60);
            bridge.set_color(rotateEntity, 46, 204, 113, 255); // Green
            bridge.set_shape(rotateEntity, 1); // circle
            bridge.add_sensor(rotateEntity, 1, 0, 0); // Click -> Highlight

            // === SCALE Entity ===
            // Double-click to scale
            const scaleEntity = bridge.spawn_entity(700, 250, 60, 60);
            bridge.set_color(scaleEntity, 52, 152, 219, 255); // Blue
            bridge.set_shape(scaleEntity, 0); // rectangle
            bridge.add_sensor(scaleEntity, 6, 0, 0); // DoubleTap -> Highlight

            // Animation state for move entity
            let moveStartTime = 0;
            let moveDirection = 1;

            // Implement manual transformations (since WASM bridge uses velocity for move)
            function animateMove() {
                const time = performance.now() / 1000;
                const offset = Math.sin(time * 2) * 30;
                const newX = 200 + offset;

                bridge.set_position(moveEntity, newX, 250);

                requestAnimationFrame(animateMove);
            }
            animateMove();

            // Click handler for rotate
            let rotateAngle = 0;
            canvas.addEventListener("click", (e) => {
                const rect = canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;

                // Check if clicked on rotate entity (simple proximity)
                const pos = bridge.get_entity_position_screen(rotateEntity);
                if (pos && pos.length >= 2) {
                    const entityX = pos[0];
                    const entityY = pos[1];
                    const dist = Math.sqrt((x - entityX) ** 2 + (y - entityY) ** 2);

                    if (dist < 50) {
                        rotateAngle += 45;
                        console.log("Rotated to:", rotateAngle, "°");
                        // Flash effect
                        bridge.set_color(rotateEntity, 255, 255, 255, 255);
                        setTimeout(() => {
                            bridge.set_color(rotateEntity, 46, 204, 113, 255);
                        }, 100);
                    }
                }

                // Scale entity - toggle scale
                const pos2 = bridge.get_entity_position_screen(scaleEntity);
                if (pos2 && pos2.length >= 2) {
                    const entityX = pos2[0];
                    const entityY = pos2[1];
                    const dist = Math.sqrt((x - entityX) ** 2 + (y - entityY) ** 2);

                    if (dist < 50) {
                        // Toggle scale
                        const currentSize = bridge.get_entity_size_screen(scaleEntity);
                        if (currentSize && currentSize.length >= 2) {
                            const newScale = currentSize[0] > 70 ? 0.7 : 1.5;
                            bridge.set_size(scaleEntity,
                                60 * newScale,
                                60 * newScale
                            );
                        }
                    }
                }
            });

            console.log("08c-transforms: Move, Rotate, Scale demo");
        </script>
    </body>
</html>
