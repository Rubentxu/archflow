<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>ArchFlow - Logic Bricks: UI</title>
        <style>
            @import url("https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Outfit:wght@300;400;600&display=swap");

            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                overflow: hidden;
                background: #0a0a0f;
                font-family: "Outfit", sans-serif;
                display: flex;
                flex-direction: column;
                align-items: center;
                min-height: 100vh;
            }

            h1 {
                color: #00d4ff;
                font-size: 24px;
                margin: 20px 0 10px;
                font-weight: 600;
                letter-spacing: 1px;
            }

            .subtitle {
                color: #888;
                font-size: 14px;
                margin-bottom: 20px;
                font-family: "JetBrains Mono", monospace;
            }

            canvas {
                display: block;
                border: 2px solid rgba(0, 212, 255, 0.3);
                border-radius: 8px;
                box-shadow: 0 0 40px rgba(0, 212, 255, 0.1);
            }

            .panel {
                position: absolute;
                top: 80px;
                left: 20px;
                background: linear-gradient(
                    135deg,
                    rgba(15, 15, 25, 0.95),
                    rgba(20, 20, 35, 0.95)
                );
                border: 1px solid rgba(0, 212, 255, 0.3);
                border-radius: 12px;
                padding: 20px;
                color: #e0e0e0;
                font-size: 13px;
                min-width: 260px;
                backdrop-filter: blur(10px);
            }

            .panel h3 {
                color: #00d4ff;
                font-size: 14px;
                margin-bottom: 15px;
                text-transform: uppercase;
                letter-spacing: 1px;
            }

            .ui-item {
                display: flex;
                align-items: center;
                padding: 12px;
                margin: 10px 0;
                background: rgba(255, 255, 255, 0.03);
                border-radius: 8px;
                gap: 12px;
            }

            .ui-icon {
                width: 36px;
                height: 36px;
                border-radius: 8px;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 18px;
            }

            .ui-icon.highlight {
                background: linear-gradient(
                    135deg,
                    rgba(255, 217, 61, 0.3),
                    rgba(255, 217, 61, 0.1)
                );
            }
            .ui-icon.select {
                background: linear-gradient(
                    135deg,
                    rgba(0, 212, 255, 0.3),
                    rgba(0, 212, 255, 0.1)
                );
            }
            .ui-icon.multi {
                background: linear-gradient(
                    135deg,
                    rgba(155, 89, 182, 0.3),
                    rgba(155, 89, 182, 0.1)
                );
            }

            .ui-info {
                flex: 1;
            }

            .ui-name {
                font-family: "JetBrains Mono", monospace;
                font-size: 12px;
                color: #fff;
            }

            .ui-desc {
                font-size: 10px;
                color: #666;
            }

            .selection-info {
                position: absolute;
                top: 80px;
                right: 20px;
                background: linear-gradient(
                    135deg,
                    rgba(15, 15, 25, 0.95),
                    rgba(20, 20, 35, 0.95)
                );
                border: 1px solid rgba(0, 255, 136, 0.3);
                border-radius: 12px;
                padding: 20px;
                color: #e0e0e0;
                font-size: 13px;
                min-width: 200px;
                backdrop-filter: blur(10px);
            }

            .selection-info h3 {
                color: #00ff88;
                font-size: 14px;
                margin-bottom: 15px;
                text-transform: uppercase;
                letter-spacing: 1px;
            }

            .selection-count {
                font-size: 32px;
                font-weight: 600;
                color: #00ff88;
                text-align: center;
                margin: 10px 0;
            }

            .selection-label {
                text-align: center;
                color: #666;
                font-size: 12px;
            }

            .legend {
                position: absolute;
                bottom: 20px;
                left: 50%;
                transform: translateX(-50%);
                display: flex;
                gap: 30px;
                background: rgba(15, 15, 25, 0.9);
                border: 1px solid rgba(0, 212, 255, 0.2);
                border-radius: 8px;
                padding: 12px 24px;
            }

            .legend-item {
                display: flex;
                align-items: center;
                gap: 8px;
                font-size: 12px;
                color: #888;
            }

            .legend-item .key {
                background: rgba(0, 212, 255, 0.2);
                padding: 4px 10px;
                border-radius: 4px;
                color: #00d4ff;
                font-family: "JetBrains Mono", monospace;
            }
        </style>
    </head>
    <body>
        <h1>Logic Bricks: UI</h1>
        <div class="subtitle">Highlight • Select</div>

        <canvas id="canvas" width="900" height="500"></canvas>

        <div class="panel">
            <h3>UI Components</h3>

            <div class="ui-item">
                <div class="ui-icon highlight">✦</div>
                <div class="ui-info">
                    <div class="ui-name">Highlight</div>
                    <div class="ui-desc">Hover to glow</div>
                </div>
            </div>

            <div class="ui-item">
                <div class="ui-icon select">◉</div>
                <div class="ui-info">
                    <div class="ui-name">Select</div>
                    <div class="ui-desc">Click to select (exclusive)</div>
                </div>
            </div>

            <div class="ui-item">
                <div class="ui-icon multi">◎</div>
                <div class="ui-info">
                    <div class="ui-name">Multi-Select</div>
                    <div class="ui-desc">Ctrl+Click for multiple</div>
                </div>
            </div>
        </div>

        <div class="selection-info">
            <h3>Selection</h3>
            <div class="selection-count" id="selection-count">0</div>
            <div class="selection-label">entities selected</div>
        </div>

        <div class="legend">
            <div class="legend-item">
                <span class="key">Hover</span>
                <span>Highlight glow</span>
            </div>
            <div class="legend-item">
                <span class="key">Click</span>
                <span>Select (exclusive)</span>
            </div>
            <div class="legend-item">
                <span class="key">Ctrl+Click</span>
                <span>Multi-select</span>
            </div>
        </div>

        <script type="module">
            import { createEngine } from "../shared/archflow-client.js";

            // ============================================================
            // 08d - Logic Bricks: UI
            // ============================================================
            // Demuestra: Highlight, Select (UI components)
            //
            // ACTUADORES:
            // - actuator 0: Highlight (glow effect)
            // - actuator 1: Select (mark as selected)
            //
            // SENSORES:
            // - sensor 0: MouseOver -> Highlight
            // - sensor 1: MouseClick -> Select
            // ============================================================

            const { bridge, canvas } = await createEngine("canvas");

            // Grid of selectable entities
            const rows = 3;
            const cols = 4;
            const entities = [];

            // Packed RGBA colors (0xRRGGBBAA format)
            const colorPalette = [
                0xffeb3b3c, // Red
                0xff71cc2e, // Green
                0xffd39834, // Blue
                0xff15c4f1, // Yellow
                0xffb2599b, // Purple
                0xff7ee226, // Orange
                0xff9cbc9c, // Teal
                0xfff1ecf2, // White
                0xffa69949, // Gray
                0xffeb3b3c, // Red
                0xff71cc2e, // Green
                0xffd39834, // Blue
            ];

            // Create grid using bulk_spawn + batch_configure_entities
            const count = rows * cols;

            const positions = new Float32Array(count * 2);
            const sizes = new Float32Array(count);
            const colors = new Uint32Array(count);
            const shapes = new Uint8Array(count);

            let idx = 0;
            for (let row = 0; row < rows; row++) {
                for (let col = 0; col < cols; col++) {
                    const x = 180 + col * 140;
                    const y = 150 + row * 100;

                    positions[idx * 2] = x;
                    positions[idx * 2 + 1] = y;
                    sizes[idx] = 50;
                    colors[idx] = colorPalette[idx % colorPalette.length];
                    shapes[idx] = col % 2; // alternating shapes

                    idx++;
                }
            }

            const ids = bridge.bulk_spawn(positions, sizes, colors);

            // Separate arrays for batch_configure_entities
            const xs = new Float32Array(count);
            const ys = new Float32Array(count);
            const widths = new Float32Array(count);
            const heights = new Float32Array(count);
            const vxs = new Float32Array(count);
            const vys = new Float32Array(count);
            const axs = new Float32Array(count);
            const ays = new Float32Array(count);

            for (let i = 0; i < count; i++) {
                xs[i] = positions[i * 2];
                ys[i] = positions[i * 2 + 1];
                widths[i] = sizes[i];
                heights[i] = sizes[i];
                vxs[i] = 0;
                vys[i] = 0;
                axs[i] = 0;
                ays[i] = 0;
            }

            bridge.batch_configure_entities(
                ids,
                xs,
                ys,
                widths,
                heights,
                vxs,
                vys,
                axs,
                ays,
                colors,
                shapes,
            );

            // Add sensors to each entity
            idx = 0;
            for (let row = 0; row < rows; row++) {
                for (let col = 0; col < cols; col++) {
                    const id = ids[idx];
                    const x = 180 + col * 140;
                    const y = 150 + row * 100;

                    // MouseOver -> Highlight (actuator 0)
                    bridge.add_sensor(id, 0, 0, 0);
                    // MouseClick -> Select (actuator 1)
                    bridge.add_sensor(id, 1, 0, 1);

                    entities.push({ id, x, y });
                    idx++;
                }
            }

            // Update selection count
            function updateSelectionCount() {
                const selected = bridge.get_selection();
                const count = selected ? selected.length : 0;
                document.getElementById("selection-count").textContent = count;
            }

            // Handle clicks for multi-select
            let lastClickTime = 0;
            let lastClickEntity = null;

            canvas.addEventListener("click", (e) => {
                const now = Date.now();

                // Update selection display
                setTimeout(updateSelectionCount, 50);
            });

            // Check selection on frame tick (simple polling)
            setInterval(updateSelectionCount, 200);

            // Initial count
            updateSelectionCount();

            console.log("08d-ui: Highlight and Select demo");
            console.log("12 entities in grid with highlight/select sensors");
        </script>
    </body>
</html>
