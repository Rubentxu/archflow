<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>ArchFlow - Entity Queries</title>
        <style>
            body {
                margin: 0;
                overflow: hidden;
                background: #0f0f1a;
                font-family: monospace;
            }
            canvas {
                display: block;
            }
            #controls {
                position: absolute;
                top: 10px;
                right: 10px;
                background: rgba(0, 0, 0, 0.8);
                padding: 15px;
                border-radius: 8px;
                color: #eee;
                font-size: 12px;
                min-width: 200px;
            }
            button {
                background: #00d4ff;
                border: none;
                padding: 8px 12px;
                border-radius: 4px;
                cursor: pointer;
                margin: 2px;
                font-size: 11px;
            }
            button:hover {
                background: #00b8e6;
            }
            #results {
                margin-top: 10px;
                color: #00ff88;
                max-height: 200px;
                overflow-y: auto;
            }
        </style>
    </head>
    <body>
        <canvas id="canvas"></canvas>
        <div id="controls">
            <div><strong>Entity Queries</strong></div>
            <div style="margin: 10px 0">
                <button id="q-all">All</button>
                <button id="q-rect">Rectangles</button>
                <button id="q-circle">Circles</button>
            </div>
            <div><strong>Results:</strong></div>
            <div id="results">-</div>
        </div>

        <script type="module">
            import { createEngine } from "../shared/archflow-client.js";

            // ============================================================
            // 05 - Entity Queries
            // ============================================================
            // get_alive_entities() returns Uint32Array of all entity IDs
            // query_by_shape(0) = rectangles, query_by_shape(1) = circles
            // Results are Uint32Array — use Array.from() for JS methods
            // ============================================================

            const { bridge } = await createEngine("canvas");

            // Create 5 red rectangles + 5 blue circles using bulk_spawn + batch_configure_entities
            const count = 10;
            const positions = new Float32Array(count * 2);
            const sizes = new Float32Array(count);
            const colors = new Uint32Array(count); // Uint32 for RGBA packed
            const shapes = new Uint8Array(count);

            // Fill positions, sizes, colors, shapes
            for (let i = 0; i < 5; i++) {
                positions[i * 2] = 100 + i * 60;
                positions[i * 2 + 1] = 100 + Math.random() * 100;
                sizes[i] = 40;
                colors[i] = 0xffeb3b3c; // RGBA packed: 0xRRGGBBAA (231, 76, 60, 255)
                shapes[i] = 0; // rectangle
            }
            for (let i = 0; i < 5; i++) {
                const idx = i + 5;
                positions[idx * 2] = 400 + i * 60;
                positions[idx * 2 + 1] = 100 + Math.random() * 100;
                sizes[idx] = 35;
                colors[idx] = 0xffd39834; // RGBA packed: 0xRRGGBBAA (52, 152, 219, 255)
                shapes[idx] = 1; // circle
            }

            // Get IDs from bulk_spawn (returns Uint32Array of entity IDs)
            const ids = bridge.bulk_spawn(positions, sizes, colors);

            // Separate xs, ys, widths, heights for batch_configure_entities
            const xs = new Float32Array(count);
            const ys = new Float32Array(count);
            const widths = new Float32Array(count);
            const heights = new Float32Array(count);
            const vxs = new Float32Array(count); // velocities x (all 0)
            const vys = new Float32Array(count); // velocities y (all 0)
            const axs = new Float32Array(count); // accelerations x (all 0)
            const ays = new Float32Array(count); // accelerations y (all 0)

            for (let i = 0; i < count; i++) {
                xs[i] = positions[i * 2];
                ys[i] = positions[i * 2 + 1];
                widths[i] = sizes[i];
                heights[i] = sizes[i];
                vxs[i] = 0;
                vys[i] = 0;
                axs[i] = 0;
                ays[i] = 0;
            }

            // batch_configure_entities needs: ids, xs, ys, widths, heights, vxs, vys, axs, ays, colors, shapes
            bridge.batch_configure_entities(
                ids,
                xs,
                ys,
                widths,
                heights,
                vxs,
                vys,
                axs,
                ays,
                colors,
                shapes,
            );

            function runQuery(type) {
                const results =
                    type === "all"
                        ? bridge.get_alive_entities()
                        : type === "rectangle"
                          ? bridge.query_by_shape(0)
                          : bridge.query_by_shape(1);

                const ids = Array.from(results || []);
                document.getElementById("results").innerHTML =
                    ids.map((id) => `<div>Entity ${id}</div>`).join("") ||
                    "<div>None</div>";
            }

            document.getElementById("q-all").onclick = () => runQuery("all");
            document.getElementById("q-rect").onclick = () =>
                runQuery("rectangle");
            document.getElementById("q-circle").onclick = () =>
                runQuery("circle");

            runQuery("all");
        </script>
    </body>
</html>
