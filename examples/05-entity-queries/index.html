<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>ArchFlow - Entity Queries</title>
        <style>
            body {
                margin: 0;
                overflow: hidden;
                background: #0f0f1a;
                font-family: monospace;
            }
            canvas {
                display: block;
            }
            #controls {
                position: absolute;
                top: 10px;
                right: 10px;
                background: rgba(0, 0, 0, 0.8);
                padding: 15px;
                border-radius: 8px;
                color: #eee;
                font-size: 12px;
                min-width: 200px;
            }
            button {
                background: #00d4ff;
                border: none;
                padding: 8px 12px;
                border-radius: 4px;
                cursor: pointer;
                margin: 2px;
                font-size: 11px;
            }
            button:hover {
                background: #00b8e6;
            }
            #results {
                margin-top: 10px;
                color: #00ff88;
                max-height: 200px;
                overflow-y: auto;
            }
        </style>
    </head>
    <body>
        <canvas id="canvas"></canvas>
        <div id="controls">
            <div><strong>Entity Queries</strong></div>
            <div style="margin: 10px 0">
                <button id="q-all">All</button>
                <button id="q-rect">Rectangles</button>
                <button id="q-circle">Circles</button>
            </div>
            <div><strong>Results:</strong></div>
            <div id="results">-</div>
        </div>

        <script type="module">
            import { createEngine } from "../shared/archflow-client.js";

            // ============================================================
            // 05 - Entity Queries
            // ============================================================
            // get_alive_entities() returns Uint32Array of all entity IDs
            // query_by_shape(0) = rectangles, query_by_shape(1) = circles
            // Results are Uint32Array — use Array.from() for JS methods
            // ============================================================

            const { bridge } = await createEngine("canvas");

            // Create 5 red rectangles + 5 blue circles
            for (let i = 0; i < 5; i++) {
                const id = bridge.spawn_entity(
                    100 + i * 60,
                    100 + Math.random() * 100,
                    40,
                    40,
                );
                bridge.set_color(id, 231, 76, 60, 255);
                bridge.set_shape(id, 0); // rectangle
            }
            for (let i = 0; i < 5; i++) {
                const id = bridge.spawn_entity(
                    400 + i * 60,
                    100 + Math.random() * 100,
                    35,
                    35,
                );
                bridge.set_color(id, 52, 152, 219, 255);
                bridge.set_shape(id, 1); // circle
            }

            function runQuery(type) {
                const results =
                    type === "all"
                        ? bridge.get_alive_entities()
                        : type === "rectangle"
                          ? bridge.query_by_shape(0)
                          : bridge.query_by_shape(1);

                const ids = Array.from(results || []);
                document.getElementById("results").innerHTML =
                    ids.map((id) => `<div>Entity ${id}</div>`).join("") ||
                    "<div>None</div>";
            }

            document.getElementById("q-all").onclick = () => runQuery("all");
            document.getElementById("q-rect").onclick = () =>
                runQuery("rectangle");
            document.getElementById("q-circle").onclick = () =>
                runQuery("circle");

            runQuery("all");
        </script>
    </body>
</html>
