<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>ArchFlow - Logic Bricks: Physics</title>
        <style>
            @import url("https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Outfit:wght@300;400;600&display=swap");

            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                overflow: hidden;
                background: #0a0a0f;
                font-family: "Outfit", sans-serif;
                display: flex;
                flex-direction: column;
                align-items: center;
                min-height: 100vh;
            }

            h1 {
                color: #00d4ff;
                font-size: 24px;
                margin: 20px 0 10px;
                font-weight: 600;
                letter-spacing: 1px;
            }

            .subtitle {
                color: #888;
                font-size: 14px;
                margin-bottom: 20px;
                font-family: "JetBrains Mono", monospace;
            }

            canvas {
                display: block;
                border: 2px solid rgba(0, 212, 255, 0.3);
                border-radius: 8px;
                box-shadow: 0 0 40px rgba(0, 212, 255, 0.1);
            }

            .panel {
                position: absolute;
                top: 80px;
                left: 20px;
                background: linear-gradient(135deg, rgba(15, 15, 25, 0.95), rgba(20, 20, 35, 0.95));
                border: 1px solid rgba(0, 212, 255, 0.3);
                border-radius: 12px;
                padding: 20px;
                color: #e0e0e0;
                font-size: 12px;
                min-width: 200px;
                backdrop-filter: blur(10px);
            }

            .panel h3 {
                color: #00d4ff;
                font-size: 14px;
                margin-bottom: 15px;
                text-transform: uppercase;
                letter-spacing: 1px;
            }

            .stat-row {
                display: flex;
                justify-content: space-between;
                padding: 8px 0;
                border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            }

            .stat-row:last-child {
                border-bottom: none;
            }

            .stat-label {
                color: #888;
            }

            .stat-value {
                font-family: "JetBrains Mono", monospace;
                font-weight: 600;
            }

            .stat-value.entities {
                color: #ff6b6b;
            }

            .stat-value.fps {
                color: #00ff88;
            }

            .stat-value.physics {
                color: #ffd93d;
            }

            .legend {
                position: absolute;
                bottom: 20px;
                left: 50%;
                transform: translateX(-50%);
                display: flex;
                gap: 30px;
                background: rgba(15, 15, 25, 0.9);
                border: 1px solid rgba(0, 212, 255, 0.2);
                border-radius: 8px;
                padding: 12px 24px;
            }

            .legend-item {
                display: flex;
                align-items: center;
                gap: 8px;
                font-size: 12px;
                color: #888;
            }

            .legend-item .key {
                background: rgba(0, 212, 255, 0.2);
                padding: 4px 10px;
                border-radius: 4px;
                color: #00d4ff;
                font-family: "JetBrains Mono", monospace;
            }
        </style>
    </head>
    <body>
        <h1>Logic Bricks: Physics</h1>
        <div class="subtitle">PhysicsSystem + Logic Bricks</div>

        <canvas id="canvas" width="900" height="500"></canvas>

        <div class="panel">
            <h3>Physics Stats</h3>
            <div class="stat-row">
                <span class="stat-label">Entities</span>
                <span class="stat-value entities" id="entity-count">0</span>
            </div>
            <div class="stat-row">
                <span class="stat-label">FPS</span>
                <span class="stat-value fps" id="fps">60</span>
            </div>
            <div class="stat-row">
                <span class="stat-label">Physics</span>
                <span class="stat-value physics" id="physics-time">0ms</span>
            </div>
            <div class="stat-row">
                <span class="stat-label">Click count</span>
                <span class="stat-value" id="click-count">0</span>
            </div>
        </div>

        <div class="legend">
            <div class="legend-item">
                <span class="key">Click</span>
                <span>Spawn 5 shapes</span>
            </div>
            <div class="legend-item">
                <span class="key">Space</span>
                <span>Clear all</span>
            </div>
            <div class="legend-item">
                <span class="key">Hover</span>
                <span>Highlight</span>
            </div>
        </div>

        <script type="module">
            import { createEngine } from "../shared/archflow-client.js";

            // ============================================================
            // 08f - Logic Bricks: Physics
            // ============================================================
            // PhysicsSystem + Logic Bricks integration demo
            // - Click to spawn bouncing shapes
            // - Shapes have velocity and bounce off edges
            // - Hover highlights, Click selects
            // - Space to clear
            //
            // This demonstrates:
            // - Velocity component
            // - Boundary checking
            // - Logic Bricks integration
            // ============================================================

            const { bridge, canvas, loop } = await createEngine("canvas", {
                onFrame: (dt, fps) => {
                    document.getElementById("fps").textContent = fps;
                }
            });

            // Physics state
            let shapes = [];
            let clickCount = 0;
            let startTime = performance.now();

            // HSL to RGB
            function hslToRgbBytes(h, s, l) {
                s /= 100;
                l /= 100;
                const k = (n) => (n + h / 30) % 12;
                const a = s * Math.min(l, 1 - l);
                const f = (n) => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
                return {
                    r: Math.round(255 * f(0)),
                    g: Math.round(255 * f(8)),
                    b: Math.round(255 * f(4)),
                };
            }

            // Spawn shapes with physics
            function spawnShapes(count, clickX, clickY) {
                const spawnStart = performance.now();

                for (let i = 0; i < count; i++) {
                    const x = clickX + (Math.random() - 0.5) * 30;
                    const y = clickY + (Math.random() - 0.5) * 30;
                    const size = 20 + Math.random() * 25;

                    const id = bridge.spawn_entity(x, y, size, size);

                    // Random bright color
                    const hue = Math.random() * 360;
                    const rgb = hslToRgbBytes(hue, 75, 55);
                    bridge.set_color(id, rgb.r, rgb.g, rgb.b, 255);

                    // Random shape
                    bridge.set_shape(id, Math.random() > 0.5 ? 0 : 1);

                    // Set velocity for physics
                    const vx = (Math.random() - 0.5) * 6;
                    const vy = (Math.random() - 0.5) * 6;
                    bridge.set_velocity(id, vx, vy);

                    // Add Logic Bricks
                    // Hover -> Highlight
                    bridge.add_sensor(id, 0, 0, 0);
                    // Click -> Select
                    bridge.add_sensor(id, 1, 0, 1);

                    shapes.push({
                        id,
                        x,
                        y,
                        vx,
                        vy,
                        size,
                    });
                }

                const spawnTime = (performance.now() - spawnStart).toFixed(2);
                document.getElementById("entity-count").textContent = shapes.length;
                document.getElementById("physics-time").textContent = `${spawnTime}ms`;
            }

            // Physics update - simple Euler integration
            function updatePhysics() {
                if (shapes.length === 0) return;

                const physicsStart = performance.now();

                const ids = [];
                const xs = [];
                const ys = [];

                for (const shape of shapes) {
                    // Update position
                    shape.x += shape.vx;
                    shape.y += shape.vy;

                    // Boundary bounce
                    if (shape.x < 0 || shape.x + shape.size > canvas.width) {
                        shape.vx *= -1;
                        shape.x = Math.max(0, Math.min(shape.x, canvas.width - shape.size));
                    }
                    if (shape.y < 0 || shape.y + shape.size > canvas.height) {
                        shape.vy *= -1;
                        shape.y = Math.max(0, Math.min(shape.y, canvas.height - shape.size));
                    }

                    ids.push(shape.id);
                    xs.push(shape.x);
                    ys.push(shape.y);
                }

                // Batch update positions
                bridge.batch_set_positions(new Uint32Array(ids), new Float32Array(xs), new Float32Array(ys));

                const physicsTime = (performance.now() - physicsStart).toFixed(2);
                document.getElementById("physics-time").textContent = `${physicsTime}ms`;
            }

            // Click handler
            canvas.addEventListener("click", (e) => {
                const rect = canvas.getBoundingClientRect();
                const clickX = e.clientX - rect.left;
                const clickY = e.clientY - rect.top;

                clickCount++;
                document.getElementById("click-count").textContent = clickCount;

                // Spawn 5 shapes per click
                spawnShapes(5, clickX, clickY);
            });

            // Keyboard handler - Space to clear
            window.addEventListener("keydown", (e) => {
                if (e.code === "Space") {
                    e.preventDefault();

                    // Batch despawn
                    if (shapes.length > 0) {
                        const ids = new Uint32Array(shapes.map(s => s.id));
                        bridge.batch_despawn(ids);
                        shapes = [];
                        document.getElementById("entity-count").textContent = "0";
                    }
                }
            });

            // Main loop
            let lastTime = performance.now();

            function gameLoop() {
                const now = performance.now();
                const dt = (now - lastTime) / 1000;
                lastTime = now;

                // Tick the engine
                bridge.tick(dt);

                // Update physics
                updatePhysics();

                requestAnimationFrame(gameLoop);
            }

            // Start
            gameLoop();

            // Spawn initial shapes
            spawnShapes(10, canvas.width / 2, canvas.height / 2);

            console.log("08f-physics: Physics + Logic Bricks demo");
            console.log("Click to spawn shapes, Space to clear");
        </script>
    </body>
</html>
