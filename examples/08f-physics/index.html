<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>ArchFlow - Logic Bricks: Physics</title>
        <style>
            @import url("https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Outfit:wght@300;400;600&display=swap");

            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                overflow: hidden;
                background: #0a0a0f;
                font-family: "Outfit", sans-serif;
                display: flex;
                flex-direction: column;
                align-items: center;
                min-height: 100vh;
            }

            h1 {
                color: #00d4ff;
                font-size: 24px;
                margin: 20px 0 10px;
                font-weight: 600;
                letter-spacing: 1px;
            }

            .subtitle {
                color: #888;
                font-size: 14px;
                margin-bottom: 20px;
                font-family: "JetBrains Mono", monospace;
            }

            canvas {
                display: block;
                border: 2px solid rgba(0, 212, 255, 0.3);
                border-radius: 8px;
                box-shadow: 0 0 40px rgba(0, 212, 255, 0.1);
            }

            .panel {
                position: absolute;
                top: 80px;
                left: 20px;
                background: linear-gradient(
                    135deg,
                    rgba(15, 15, 25, 0.95),
                    rgba(20, 20, 35, 0.95)
                );
                border: 1px solid rgba(0, 212, 255, 0.3);
                border-radius: 12px;
                padding: 20px;
                color: #e0e0e0;
                font-size: 12px;
                min-width: 200px;
                backdrop-filter: blur(10px);
            }

            .panel h3 {
                color: #00d4ff;
                font-size: 14px;
                margin-bottom: 15px;
                text-transform: uppercase;
                letter-spacing: 1px;
            }

            .stat-row {
                display: flex;
                justify-content: space-between;
                padding: 8px 0;
                border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            }

            .stat-row:last-child {
                border-bottom: none;
            }

            .stat-label {
                color: #888;
            }

            .stat-value {
                font-family: "JetBrains Mono", monospace;
                font-weight: 600;
            }

            .stat-value.entities {
                color: #ff6b6b;
            }

            .stat-value.fps {
                color: #00ff88;
            }

            .stat-value.physics {
                color: #ffd93d;
            }

            .legend {
                position: absolute;
                bottom: 20px;
                left: 50%;
                transform: translateX(-50%);
                display: flex;
                gap: 30px;
                background: rgba(15, 15, 25, 0.9);
                border: 1px solid rgba(0, 212, 255, 0.2);
                border-radius: 8px;
                padding: 12px 24px;
            }

            .legend-item {
                display: flex;
                align-items: center;
                gap: 8px;
                font-size: 12px;
                color: #888;
            }

            .legend-item .key {
                background: rgba(0, 212, 255, 0.2);
                padding: 4px 10px;
                border-radius: 4px;
                color: #00d4ff;
                font-family: "JetBrains Mono", monospace;
            }
        </style>
    </head>
    <body>
        <h1>Logic Bricks: Physics</h1>
        <div class="subtitle">PhysicsSystem + Logic Bricks</div>

        <canvas id="canvas" width="900" height="500"></canvas>

        <div class="panel">
            <h3>Physics Stats</h3>
            <div class="stat-row">
                <span class="stat-label">Entities</span>
                <span class="stat-value entities" id="entity-count">0</span>
            </div>
            <div class="stat-row">
                <span class="stat-label">FPS</span>
                <span class="stat-value fps" id="fps">60</span>
            </div>
            <div class="stat-row">
                <span class="stat-label">Physics</span>
                <span class="stat-value physics" id="physics-time">0ms</span>
            </div>
            <div class="stat-row">
                <span class="stat-label">Click count</span>
                <span class="stat-value" id="click-count">0</span>
            </div>
        </div>

        <div class="legend">
            <div class="legend-item">
                <span class="key">Click</span>
                <span>Spawn 5 shapes</span>
            </div>
            <div class="legend-item">
                <span class="key">Space</span>
                <span>Clear all</span>
            </div>
            <div class="legend-item">
                <span class="key">Hover</span>
                <span>Highlight</span>
            </div>
        </div>

        <script type="module">
            import { createEngine } from "../shared/archflow-client.js";

            // ============================================================
            // 08f - Logic Bricks: Physics
            // ============================================================
            // PhysicsSystem + Logic Bricks integration demo
            // - Click to spawn bouncing shapes
            // - Shapes have velocity and bounce off edges
            // - Hover highlights, Click selects
            // - Space to clear
            //
            // This demonstrates:
            // - Velocity component
            // - Boundary checking
            // - Logic Bricks integration
            // ============================================================

            const { bridge, canvas, loop } = await createEngine("canvas", {
                onFrame: (dt, fps) => {
                    document.getElementById("fps").textContent = fps;
                },
            });

            // Physics state
            let shapes = [];
            let clickCount = 0;
            let startTime = performance.now();

            // HSL to RGB
            function hslToRgbBytes(h, s, l) {
                s /= 100;
                l /= 100;
                const k = (n) => (n + h / 30) % 12;
                const a = s * Math.min(l, 1 - l);
                const f = (n) =>
                    l -
                    a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
                return {
                    r: Math.round(255 * f(0)),
                    g: Math.round(255 * f(8)),
                    b: Math.round(255 * f(4)),
                };
            }

            // Spawn shapes with physics
            function spawnShapes(count, clickX, clickY) {
                const spawnStart = performance.now();

                // Prepare arrays for bulk spawn
                const positions = new Float32Array(count * 2);
                const sizes = new Float32Array(count * 2);
                const colors = new Uint8Array(count * 4);
                const shapesArr = new Uint8Array(count);
                const vxs = new Float32Array(count);
                const vys = new Float32Array(count);
                const entityData = [];

                for (let i = 0; i < count; i++) {
                    const x = clickX + (Math.random() - 0.5) * 30;
                    const y = clickY + (Math.random() - 0.5) * 30;
                    const size = 20 + Math.random() * 25;

                    positions[i * 2] = x;
                    positions[i * 2 + 1] = y;
                    sizes[i * 2] = size;
                    sizes[i * 2 + 1] = size;

                    // Random bright color
                    const hue = Math.random() * 360;
                    const rgb = hslToRgbBytes(hue, 75, 55);
                    colors[i * 4] = rgb.r;
                    colors[i * 4 + 1] = rgb.g;
                    colors[i * 4 + 2] = rgb.b;
                    colors[i * 4 + 3] = 255;

                    // Random shape
                    shapesArr[i] = Math.random() > 0.5 ? 0 : 1;

                    // Velocity (pixels/second) - range: -150 to +150
                    vxs[i] = (Math.random() - 0.5) * 300;
                    vys[i] = (Math.random() - 0.5) * 300;

                    entityData.push({ x, y, size, vx: vxs[i], vy: vys[i] });
                }

                // Bulk spawn with colors (accepts Uint8Array r,g,b,a)
                const ids = bridge.bulk_spawn(positions, sizes, colors);

                // Pack RGBA bytes into Uint32Array for batch_configure_entities
                const packedColors = new Uint32Array(count);
                for (let i = 0; i < count; i++) {
                    const r = colors[i * 4];
                    const g = colors[i * 4 + 1];
                    const b = colors[i * 4 + 2];
                    const a = colors[i * 4 + 3];
                    packedColors[i] =
                        ((a << 24) | (b << 16) | (g << 8) | r) >>> 0;
                }

                // Separate arrays for batch_configure_entities (expects separate widths/heights)
                const xs = new Float32Array(count);
                const ys = new Float32Array(count);
                const widths = new Float32Array(count);
                const heights = new Float32Array(count);
                for (let i = 0; i < count; i++) {
                    xs[i] = positions[i * 2];
                    ys[i] = positions[i * 2 + 1];
                    widths[i] = sizes[i * 2];
                    heights[i] = sizes[i * 2 + 1];
                }

                // Configure with velocities and shapes using batch_configure_entities
                bridge.batch_configure_entities(
                    ids,
                    xs,
                    ys,
                    widths,
                    heights,
                    vxs,
                    vys,
                    new Float32Array(count).fill(0),
                    new Float32Array(count).fill(0),
                    packedColors,
                    shapesArr,
                );

                // Add Logic Bricks for each entity
                for (let i = 0; i < ids.length; i++) {
                    const id = ids[i];
                    // Hover -> Highlight
                    bridge.add_sensor(id, 0, 0, 0);
                    // Click -> Select
                    bridge.add_sensor(id, 1, 0, 1);
                }

                // Store entity info
                for (let i = 0; i < ids.length; i++) {
                    shapes.push({
                        id: ids[i],
                        ...entityData[i],
                    });
                }

                const spawnTime = (performance.now() - spawnStart).toFixed(2);
                document.getElementById("entity-count").textContent =
                    shapes.length;
                document.getElementById("physics-time").textContent =
                    `${spawnTime}ms`;
            }

            // Click handler
            canvas.addEventListener("click", (e) => {
                const rect = canvas.getBoundingClientRect();
                const clickX = e.clientX - rect.left;
                const clickY = e.clientY - rect.top;

                clickCount++;
                document.getElementById("click-count").textContent = clickCount;

                // Spawn 5 shapes per click
                spawnShapes(5, clickX, clickY);
            });

            // Keyboard handler - Space to clear
            window.addEventListener("keydown", (e) => {
                if (e.code === "Space") {
                    e.preventDefault();

                    // Batch despawn
                    if (shapes.length > 0) {
                        const ids = new Uint32Array(shapes.map((s) => s.id));
                        bridge.batch_despawn(ids);
                        shapes = [];
                        document.getElementById("entity-count").textContent =
                            "0";
                    }
                }
            });

            // Main loop - bridge.tick() expects a millisecond timestamp (performance.now())
            function gameLoop(timestamp) {
                // Tick the engine (includes physics automatically with Fixed Timestep)
                // IMPORTANT: pass performance.now() timestamp, NOT a delta-time!
                bridge.tick(timestamp || performance.now());

                requestAnimationFrame(gameLoop);
            }

            // Start
            gameLoop();

            // Spawn initial shapes
            spawnShapes(10, canvas.width / 2, canvas.height / 2);

            console.log("08f-physics: Physics + Logic Bricks demo");
            console.log("Click to spawn shapes, Space to clear");
        </script>
    </body>
</html>
