<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>ArchFlow - Stress Test</title>
        <style>
            @import url("https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Outfit:wght@300;400;600;700&display=swap");

            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                overflow: hidden;
                background: #0a0a0f;
                font-family: "JetBrains Mono", monospace;
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: 100vh;
            }

            canvas {
                display: block;
                width: 1000px;
                height: 600px;
                border: 1px solid rgba(0, 212, 255, 0.2);
                border-radius: 4px;
            }

            #stats-panel {
                position: absolute;
                top: 12px;
                left: 12px;
                background: linear-gradient(
                    135deg,
                    rgba(15, 15, 25, 0.95) 0%,
                    rgba(20, 20, 35, 0.95) 100%
                );
                border: 1px solid rgba(0, 212, 255, 0.3);
                border-radius: 12px;
                padding: 16px 20px;
                color: #e0e0e0;
                font-size: 11px;
                min-width: 220px;
                backdrop-filter: blur(10px);
                box-shadow:
                    0 8px 32px rgba(0, 0, 0, 0.4),
                    inset 0 1px 0 rgba(255, 255, 255, 0.05);
            }

            #stats-panel h2 {
                font-family: "Outfit", sans-serif;
                font-weight: 600;
                font-size: 14px;
                color: #00d4ff;
                margin-bottom: 12px;
                letter-spacing: 1px;
                text-transform: uppercase;
                display: flex;
                align-items: center;
                gap: 8px;
            }

            #stats-panel h2::before {
                content: "";
                width: 8px;
                height: 8px;
                background: #00ff88;
                border-radius: 50%;
                animation: pulse 1.5s ease-in-out infinite;
            }

            @keyframes pulse {
                0%,
                100% {
                    opacity: 1;
                    transform: scale(1);
                }
                50% {
                    opacity: 0.5;
                    transform: scale(0.8);
                }
            }

            .stat-row {
                display: flex;
                justify-content: space-between;
                padding: 6px 0;
                border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            }

            .stat-row:last-child {
                border-bottom: none;
            }

            .stat-label {
                color: #888;
                font-weight: 400;
            }

            .stat-value {
                font-weight: 600;
                font-size: 12px;
            }

            .stat-value.fps {
                color: #00ff88;
                font-size: 18px;
            }

            .stat-value.entities {
                color: #ff6b6b;
            }

            .stat-value.batch-time {
                color: #ffd93d;
            }

            .stat-value.uptime {
                color: #6bcfff;
            }

            #instructions {
                position: absolute;
                bottom: 12px;
                left: 50%;
                transform: translateX(-50%);
                background: rgba(15, 15, 25, 0.9);
                border: 1px solid rgba(0, 212, 255, 0.2);
                border-radius: 8px;
                padding: 10px 24px;
                color: #aaa;
                font-size: 12px;
                font-family: "Outfit", sans-serif;
                letter-spacing: 0.5px;
                display: flex;
                gap: 16px;
                align-items: center;
            }

            #instructions .key {
                color: #00d4ff;
                font-weight: 600;
                background: rgba(0, 212, 255, 0.15);
                padding: 2px 8px;
                border-radius: 4px;
            }

            #instructions .action {
                color: #ff6b6b;
            }

            .metric-bar {
                height: 3px;
                background: rgba(255, 255, 255, 0.1);
                border-radius: 2px;
                margin-top: 4px;
                overflow: hidden;
            }

            .metric-bar-fill {
                height: 100%;
                border-radius: 2px;
                transition: width 0.3s ease;
            }

            .metric-bar-fill.fps {
                background: linear-gradient(90deg, #00ff88, #00d4ff);
            }

            #batch-indicator {
                position: absolute;
                top: 12px;
                right: 12px;
                background: rgba(15, 15, 25, 0.9);
                border: 1px solid rgba(255, 217, 61, 0.3);
                border-radius: 8px;
                padding: 8px 14px;
                color: #ffd93d;
                font-size: 10px;
                opacity: 0;
                transition: opacity 0.3s ease;
            }

            #batch-indicator.show {
                opacity: 1;
            }
        </style>
    </head>
    <body>
        <canvas id="canvas" width="1000" height="600"></canvas>

        <div id="stats-panel">
            <h2>Performance Metrics</h2>
            <div class="stat-row">
                <span class="stat-label">FPS</span>
                <span class="stat-value fps" id="fps">0</span>
            </div>
            <div class="metric-bar">
                <div
                    class="metric-bar-fill fps"
                    id="fps-bar"
                    style="width: 0%"
                ></div>
            </div>

            <div class="stat-row">
                <span class="stat-label">Entities</span>
                <span class="stat-value entities" id="entities">0</span>
            </div>

            <div class="stat-row">
                <span class="stat-label">Spawn Time</span>
                <span class="stat-value batch-time" id="spawn-time">0ms</span>
            </div>

            <div class="stat-row">
                <span class="stat-label">Update Time</span>
                <span class="stat-value batch-time" id="update-time">0ms</span>
            </div>

            <div class="stat-row">
                <span class="stat-label">Batch Calls</span>
                <span class="stat-value" id="batch-calls">0</span>
            </div>

            <div class="stat-row">
                <span class="stat-label">Uptime</span>
                <span class="stat-value uptime" id="uptime">00:00</span>
            </div>
        </div>

        <div id="batch-indicator">⚡ Batch Update</div>

        <div id="instructions">
            <span class="key">Click</span> spawn
            <span id="spawn-count">150</span> shapes
            <span class="key">Space</span> clear all
            <span class="action">FPS: Real-time</span>
        </div>

        <script type="module">
            import { createEngine } from "../shared/archflow-client.js";

            // ============================================================
            // Stress Test - Performance Benchmark
            // ============================================================
            // CONFIGURABLE: Entities per spawn (change this value)
            const ENTITIES_PER_SPAWN = 150; // CHANGE THIS: 20, 50, 100, 150, 200...
            // ============================================================
            //
            // This demo measures WASM engine performance under load:
            // - Click to spawn N shapes (configurable above) with random velocities
            // - Shapes bounce off screen edges
            // - All position updates use batch_set_positions (1 WASM call)
            // - Metrics show FPS, entity count, batch operation time
            //
            // Maximum efficiency: batch operations + requestAnimationFrame
            // ============================================================

            const { bridge, canvas, loop } = await createEngine("canvas");

            // Update spawn count display dynamically
            document.getElementById("spawn-count").textContent =
                ENTITIES_PER_SPAWN;

            // State
            let shapes = [];
            let batchCallCount = 0;
            let startTime = performance.now();
            let lastFrameTime = performance.now();
            let frameCount = 0;
            let fps = 0;
            let fpsAccum = 0;
            let fpsSamples = 0;

            // Click handler - spawn 20 shapes using BULK SPAWN
            canvas.addEventListener("click", (e) => {
                const rect = canvas.getBoundingClientRect();
                const clickX = e.clientX - rect.left;
                const clickY = e.clientY - rect.top;

                const spawnStart = performance.now();

                // Prepare flat arrays for bulk_spawn - ZERO-COPY
                const positions = new Float32Array(ENTITIES_PER_SPAWN * 2); // [x0, y0, x1, y1, ...]
                const sizes = new Float32Array(ENTITIES_PER_SPAWN * 2); // [w0, h0, w1, h1, ...]
                const colors = new Uint8Array(ENTITIES_PER_SPAWN * 4); // [r0, g0, b0, a0, ...]

                for (let i = 0; i < ENTITIES_PER_SPAWN; i++) {
                    const x = clickX + (Math.random() - 0.5) * 40;
                    const y = clickY + (Math.random() - 0.5) * 40;
                    const size = 15 + Math.random() * 15;

                    positions[i * 2] = x;
                    positions[i * 2 + 1] = y;
                    sizes[i * 2] = size;
                    sizes[i * 2 + 1] = size;

                    // Random bright color
                    const hue = Math.random() * 360;
                    const rgb = hslToRgbBytes(hue, 75, 55);
                    colors[i * 4] = rgb.r;
                    colors[i * 4 + 1] = rgb.g;
                    colors[i * 4 + 2] = rgb.b;
                    colors[i * 4 + 3] = 255;
                }

                // Single call to bulk_spawn - MUCH FASTER!
                const ids = bridge.bulk_spawn(positions, sizes, colors);

                // Now set shapes (this is still one-by-one, but shapes don't change often)
                for (let i = 0; i < ids.length; i++) {
                    bridge.set_shape(ids[i], Math.random() > 0.5 ? 0 : 1);
                }

                // Track shapes for physics
                for (let i = 0; i < ids.length; i++) {
                    shapes.push({
                        id: ids[i],
                        x: positions[i * 2],
                        y: positions[i * 2 + 1],
                        vx: (Math.random() - 0.5) * 8,
                        vy: (Math.random() - 0.5) * 8,
                        size: sizes[i * 2],
                    });
                }

                const spawnTime = (performance.now() - spawnStart).toFixed(2);
                document.getElementById("spawn-time").textContent =
                    `${spawnTime}ms`;
                document.getElementById("entities").textContent = shapes.length;

                batchCallCount += 1; // Only 1 call now!
                document.getElementById("batch-calls").textContent =
                    batchCallCount;
            });

            // Override loop for custom update
            const originalLoop = loop;

            // Physics update + batch render
            function updatePhysics() {
                if (shapes.length === 0) return;

                const updateStart = performance.now();

                const xs = new Float32Array(shapes.length);
                const ys = new Float32Array(shapes.length);

                for (let i = 0; i < shapes.length; i++) {
                    const s = shapes[i];

                    // Update position
                    s.x += s.vx;
                    s.y += s.vy;

                    // Bounce off edges
                    if (s.x < 0 || s.x + s.size > canvas.width) {
                        s.vx *= -1;
                        s.x = Math.max(0, Math.min(s.x, canvas.width - s.size));
                    }
                    if (s.y < 0 || s.y + s.size > canvas.height) {
                        s.vy *= -1;
                        s.y = Math.max(
                            0,
                            Math.min(s.y, canvas.height - s.size),
                        );
                    }

                    xs[i] = s.x;
                    ys[i] = s.y;
                }

                // Batch update positions - ONE WASM CALL for all entities!
                const ids = new Uint32Array(shapes.map((s) => s.id));
                bridge.batch_set_positions(ids, xs, ys);
                batchCallCount++;

                const updateTime = (performance.now() - updateStart).toFixed(2);
                document.getElementById("update-time").textContent =
                    `${updateTime}ms`;
                document.getElementById("batch-calls").textContent =
                    batchCallCount;

                // Show batch indicator briefly
                const indicator = document.getElementById("batch-indicator");
                indicator.classList.add("show");
                setTimeout(() => indicator.classList.remove("show"), 150);
            }

            // FPS calculation
            function updateFPS() {
                const now = performance.now();
                const delta = now - lastFrameTime;
                lastFrameTime = now;

                fpsAccum += 1000 / delta;
                fpsSamples++;

                if (fpsSamples >= 10) {
                    fps = Math.round(fpsAccum / fpsSamples);
                    fpsAccum = 0;
                    fpsSamples = 0;

                    document.getElementById("fps").textContent = fps;
                    document.getElementById("fps-bar").style.width =
                        `${Math.min(100, fps)}%`;
                }
            }

            // Uptime display
            function updateUptime() {
                const elapsed = Math.floor(
                    (performance.now() - startTime) / 1000,
                );
                const mins = Math.floor(elapsed / 60)
                    .toString()
                    .padStart(2, "0");
                const secs = (elapsed % 60).toString().padStart(2, "0");
                document.getElementById("uptime").textContent =
                    `${mins}:${secs}`;
            }

            // Main loop
            function gameLoop() {
                updatePhysics();
                updateFPS();
                updateUptime();
                requestAnimationFrame(gameLoop);
            }

            // Start
            gameLoop();

            // Keyboard handler - Space to clear
            window.addEventListener("keydown", (e) => {
                if (e.code === "Space") {
                    e.preventDefault();
                    if (shapes.length > 0) {
                        const ids = new Uint32Array(shapes.map((s) => s.id));
                        bridge.batch_despawn(ids);
                        shapes = [];
                        document.getElementById("entities").textContent = "0";
                        document.getElementById("spawn-time").textContent =
                            "0ms";
                    }
                }
            });

            // Utility: HSL to RGB integer
            function hslToRgb(h, s, l) {
                s /= 100;
                l /= 100;
                const k = (n) => (n + h / 30) % 12;
                const a = s * Math.min(l, 1 - l);
                const f = (n) =>
                    l -
                    a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
                return (
                    (Math.round(255 * f(0)) << 16) |
                    (Math.round(255 * f(8)) << 8) |
                    Math.round(255 * f(4))
                );
            }

            // Utility: HSL to RGB bytes (for Uint8Array)
            function hslToRgbBytes(h, s, l) {
                s /= 100;
                l /= 100;
                const k = (n) => (n + h / 30) % 12;
                const a = s * Math.min(l, 1 - l);
                const f = (n) =>
                    l -
                    a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
                return {
                    r: Math.round(255 * f(0)),
                    g: Math.round(255 * f(8)),
                    b: Math.round(255 * f(4)),
                };
            }
        </script>
    </body>
</html>
