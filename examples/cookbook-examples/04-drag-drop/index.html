<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Cookbook Example 4 - Drag and Drop</title>
        <style>
            body {
                margin: 0;
                overflow: hidden;
                background: #0f0f1a;
                font-family: system-ui;
            }
            canvas {
                display: block;
                cursor: crosshair;
            }
            #info {
                position: fixed;
                top: 20px;
                left: 20px;
                background: rgba(0, 0, 0, 0.85);
                color: #00ff88;
                padding: 15px;
                border-radius: 8px;
                font-family: "Monaco", monospace;
                font-size: 13px;
                z-index: 100;
                max-width: 400px;
            }
            .controls {
                position: fixed;
                top: 20px;
                right: 20px;
                display: flex;
                flex-direction: column;
                gap: 10px;
                z-index: 100;
            }
            .controls h3 {
                color: #4488ff;
                margin: 0 0 8px 0;
                font-size: 12px;
                text-transform: uppercase;
                letter-spacing: 1px;
            }
            .control-group {
                background: rgba(0, 0, 0, 0.5);
                padding: 12px;
                border-radius: 6px;
            }
            .control-row {
                display: flex;
                gap: 8px;
                margin-bottom: 8px;
            }
            .control-row:last-child {
                margin-bottom: 0;
            }
            .controls button {
                background: #4488ff;
                color: white;
                border: none;
                padding: 10px 16px;
                border-radius: 6px;
                font-size: 12px;
                font-weight: 600;
                cursor: pointer;
                transition: all 0.2s;
                flex: 1;
            }
            .controls button:hover {
                background: #5599ff;
                transform: scale(1.05);
            }
            .controls button:active {
                transform: scale(0.95);
            }
            .controls button.danger {
                background: #ff4466;
            }
            .controls button.danger:hover {
                background: #ff5577;
            }
            .controls button.success {
                background: #44ff88;
                color: #000;
            }
            .controls button.success:hover {
                background: #55ff99;
            }
            .drag-status {
                position: fixed;
                bottom: 20px;
                left: 20px;
                background: rgba(0, 0, 0, 0.8);
                color: #4488ff;
                padding: 12px;
                border-radius: 6px;
                font-family: "Monaco", monospace;
                font-size: 12px;
                z-index: 100;
            }
            .drag-status.active {
                color: #44ff88;
            }
            .drag-status .indicator {
                display: inline-block;
                width: 10px;
                height: 10px;
                border-radius: 50%;
                margin-right: 8px;
                background: #333;
            }
            .drag-status.active .indicator {
                background: #44ff88;
            }
            .instructions {
                position: fixed;
                bottom: 20px;
                right: 20px;
                background: rgba(0, 0, 0, 0.8);
                color: #888;
                padding: 12px;
                border-radius: 6px;
                font-family: "Monaco", monospace;
                font-size: 11px;
                z-index: 100;
                max-width: 300px;
            }
            .instructions strong {
                color: #4488ff;
            }
        </style>
    </head>
    <body>
        <canvas id="canvas"></canvas>
        <div id="info">Initializing...</div>
        <div class="drag-status" id="dragStatus">
            <span class="indicator"></span
            ><span id="dragStatusText">Not dragging</span>
        </div>
        <div class="instructions">
            <strong>Click & Drag</strong> any shape to move it<br />
            <strong>Shift+Click</strong> to select multiple<br />
            <strong>Ctrl+Click</strong> to clone
        </div>

        <div class="controls">
            <div class="control-group">
                <h3>🎨 Spawn Shapes</h3>
                <div class="control-row">
                    <button onclick="spawnRectangles()">▭ Rects</button>
                    <button onclick="spawnCircles()">● Circles</button>
                </div>
                <div class="control-row">
                    <button onclick="spawnMixed()">★ Mixed</button>
                    <button onclick="spawnGrid()">▦ Grid</button>
                </div>
            </div>

            <div class="control-group">
                <h3>⚙️ Drag Options</h3>
                <div class="control-row">
                    <button onclick="toggleSnap()">
                        <span id="snapBtn">Snap: OFF</span>
                    </button>
                    <button onclick="toggleConstraints()">
                        <span id="constraintBtn">Constrain: OFF</span>
                    </button>
                </div>
                <div class="control-row">
                    <button onclick="toggleMultiSelect()">
                        <span id="multiBtn">Multi: OFF</span>
                    </button>
                </div>
            </div>

            <div class="control-group">
                <h3>🎯 Actions</h3>
                <div class="control-row">
                    <button class="success" onclick="cloneSelected()">
                        Clone
                    </button>
                    <button class="danger" onclick="deleteSelected()">
                        Delete
                    </button>
                </div>
                <div class="control-row">
                    <button onclick="resetPositions()">Reset</button>
                    <button class="danger" onclick="clearAll()">Clear</button>
                </div>
            </div>
        </div>

        <script type="module">
            import {
                createEngine,
                createRectangle,
                createCircle,
                createTriangle,
                hexToRgba,
                getTransforms,
                hexToPacked,
                makeDraggable,
                makeSelectable,
            } from "../../cookbook-shared/cookbook-utils.js";

            let bridge = null;
            let canvas = null;

            // Drag state
            let isDragging = false;
            let draggedEntity = null;
            let dragOffset = { x: 0, y: 0 };
            let selectedEntities = new Set();

            // Drag options
            let snapEnabled = false;
            let snapSize = 50;
            let constrainX = false;
            let constrainY = false;
            let multiSelectEnabled = false;

            // Store initial positions for reset
            const initialPositions = new Map();

            // ═══════════════════════════════════════════════════════════════════════════════
            // EJEMPLO 4: DRAG AND DROP
            // ═══════════════════════════════════════════════════════════════════════════════

            async function init() {
                try {
                    const startTime = performance.now();

                    const { bridge: b, canvas: c } = await createEngine(
                        "canvas",
                        {
                            onFrame: (dt, fps) => {
                                const count = bridge.get_entity_count
                                    ? bridge.get_entity_count()
                                    : 0;
                                updateInfo(
                                    `FPS: ${fps} | Entities: ${count} | Selected: ${selectedEntities.size}`,
                                );
                            },
                        },
                    );

                    bridge = b;
                    canvas = c;

                    // Setup mouse/touch input
                    setupDragInput(canvas);

                    // Spawn initial shapes
                    await spawnInitialShapes();

                    const endTime = performance.now();
                    console.log(
                        `Initialization time: ${(endTime - startTime).toFixed(2)}ms`,
                    );
                    updateInfo("✓ Ready! Click and drag shapes to move them");
                } catch (error) {
                    console.error("Initialization failed:", error);
                    updateInfo("✗ Error: " + error.message, true);
                }
            }

            // ═══════════════════════════════════════════════════════════════════════════════
            // SPAWN SHAPES
            // ═══════════════════════════════════════════════════════════════════════════════

            async function spawnInitialShapes() {
                const colors = [
                    "#ff4466",
                    "#44ff88",
                    "#4488ff",
                    "#ffff44",
                    "#ff44ff",
                ];
                const positions = [
                    { x: 500, y: 400, w: 120, h: 120 },
                    { x: 960, y: 400, w: 100, h: 100 },
                    { x: 1420, y: 400, w: 140, h: 100 },
                    { x: 730, y: 650, w: 110, h: 110 },
                    { x: 1190, y: 650, w: 130, h: 90 },
                ];

                for (let i = 0; i < 5; i++) {
                    const id = await createRectangle(
                        bridge,
                        positions[i].x,
                        positions[i].y,
                        positions[i].w,
                        positions[i].h,
                        colors[i],
                        "#000000",
                        2,
                    );

                    // Add WASM Logic Brick: Click → Move (Draggable)
                    makeDraggable(bridge, id);
                    makeSelectable(bridge, id);

                    initialPositions.set(id, {
                        x: positions[i].x,
                        y: positions[i].y,
                    });
                }
            }

            async function spawnRectangles() {
                const colors = ["#ff4466", "#ff8844", "#ffff44"];
                for (let i = 0; i < 5; i++) {
                    const x = 300 + Math.random() * 1320;
                    const y = 200 + Math.random() * 600;
                    const color =
                        colors[Math.floor(Math.random() * colors.length)];
                    const id = await createRectangle(
                        bridge,
                        x,
                        y,
                        80 + Math.random() * 60,
                        60 + Math.random() * 40,
                        color,
                        "#000",
                        2,
                    );
                    initialPositions.set(id, { x, y });
                }
                updateInfo("✓ Spawned 5 rectangles");
            }

            async function spawnCircles() {
                const colors = ["#44ff88", "#44ffff", "#4488ff"];
                for (let i = 0; i < 5; i++) {
                    const x = 300 + Math.random() * 1320;
                    const y = 200 + Math.random() * 600;
                    const color =
                        colors[Math.floor(Math.random() * colors.length)];
                    const size = 50 + Math.random() * 50;

                    const rgba = hexToRgba(color);
                    bridge.set_active_color(rgba.r, rgba.g, rgba.b, rgba.a);
                    let id = await bridge.spawn_entity(
                        x,
                        y,
                        size * 2,
                        size * 2,
                    );
                    bridge.configure_entity(
                        id,
                        NaN,
                        NaN,
                        NaN,
                        NaN,
                        NaN,
                        NaN,
                        NaN,
                        NaN,
                        0,
                        0,
                        0,
                        1,
                        2,
                    );

                    initialPositions.set(id, { x, y });
                }
                updateInfo("✓ Spawned 5 circles");
            }

            async function spawnMixed() {
                const colors = [
                    "#ff4466",
                    "#44ff88",
                    "#4488ff",
                    "#ffff44",
                    "#ff44ff",
                ];
                for (let i = 0; i < 6; i++) {
                    const x = 300 + Math.random() * 1320;
                    const y = 200 + Math.random() * 600;
                    const color = colors[i % colors.length];
                    const size = 60 + Math.random() * 40;

                    let id;
                    if (i % 3 === 0) {
                        id = await createRectangle(
                            bridge,
                            x,
                            y,
                            size,
                            size * 0.7,
                            color,
                            "#000",
                            2,
                        );
                    } else if (i % 3 === 1) {
                        const rgba = hexToRgba(color);
                        bridge.set_active_color(rgba.r, rgba.g, rgba.b, rgba.a);
                        id = await bridge.spawn_entity(
                            x,
                            y,
                            size * 2,
                            size * 2,
                        );
                        bridge.configure_entity(
                            id,
                            NaN,
                            NaN,
                            NaN,
                            NaN,
                            NaN,
                            NaN,
                            NaN,
                            NaN,
                            0,
                            0,
                            0,
                            1,
                            2,
                        );
                    } else {
                        id = await createTriangle(bridge, x, y, size, color);
                    }
                    initialPositions.set(id, { x, y });
                }
                updateInfo("✓ Spawned 6 mixed shapes");
            }

            async function spawnGrid() {
                const cols = 5;
                const rows = 3;
                const spacing = 100;
                const startX = (1920 - (cols - 1) * spacing) / 2;
                const startY = (1080 - (rows - 1) * spacing) / 2;

                const colors = ["#ff4466", "#44ff88", "#4488ff"];

                for (let row = 0; row < rows; row++) {
                    for (let col = 0; col < cols; col++) {
                        const x = startX + col * spacing;
                        const y = startY + row * spacing;
                        const color = colors[row % colors.length];

                        const id = await createRectangle(
                            bridge,
                            x,
                            y,
                            60,
                            60,
                            color,
                            "#000",
                            2,
                        );
                        initialPositions.set(id, { x, y });
                    }
                }
                updateInfo(`✓ Spawned ${cols * rows} shapes in grid`);
            }

            // ═══════════════════════════════════════════════════════════════════════════════
            // DRAG AND DROP INPUT HANDLING
            // ═══════════════════════════════════════════════════════════════════════════════

            function setupDragInput(canvas) {
                // Get pointer position relative to canvas
                function getPointerPos(e) {
                    const rect = canvas.getBoundingClientRect();
                    const clientX = e.touches
                        ? e.touches[0].clientX
                        : e.clientX;
                    const clientY = e.touches
                        ? e.touches[0].clientY
                        : e.clientY;
                    return {
                        x: (clientX - rect.left) * (canvas.width / rect.width),
                        y: (clientY - rect.top) * (canvas.height / rect.height),
                    };
                }

                // Find entity at position
                function findEntityAt(pos) {
                    const transforms = getTransforms(bridge);
                    const count = bridge.get_entity_count();

                    // Search in reverse order (top entities first)
                    for (let i = count - 1; i >= 0; i--) {
                        const x = transforms[i * 4 + 0];
                        const y = transforms[i * 4 + 1];
                        const width = transforms[i * 4 + 2];
                        const height = transforms[i * 4 + 3];

                        const halfWidth = width / 2;
                        const halfHeight = height / 2;

                        if (
                            pos.x >= x - halfWidth &&
                            pos.x <= x + halfWidth &&
                            pos.y >= y - halfHeight &&
                            pos.y <= y + halfHeight
                        ) {
                            return i;
                        }
                    }
                    return null;
                }

                // Mouse/Touch down
                function handleStart(e) {
                    e.preventDefault();
                    const pos = getPointerPos(e);
                    const entity = findEntityAt(pos);

                    if (entity !== null) {
                        // Handle multi-select with shift
                        if (e.shiftKey && multiSelectEnabled) {
                            if (selectedEntities.has(entity)) {
                                selectedEntities.delete(entity);
                                bridge.set_selected(entity, false);
                            } else {
                                selectedEntities.add(entity);
                                bridge.set_selected(entity, true);
                            }
                            updateDragStatus(false);
                            return;
                        }

                        // Handle clone with ctrl
                        if (e.ctrlKey || e.metaKey) {
                            cloneEntity(entity, pos);
                            return;
                        }

                        // Start dragging
                        isDragging = true;
                        draggedEntity = entity;

                        const transforms = getTransforms(bridge);
                        dragOffset.x = pos.x - transforms[entity * 4 + 0];
                        dragOffset.y = pos.y - transforms[entity * 4 + 1];

                        // Select the entity
                        if (!multiSelectEnabled) {
                            // Clear previous selection
                            selectedEntities.forEach((id) =>
                                bridge.set_selected(id, false),
                            );
                            selectedEntities.clear();
                        }
                        selectedEntities.add(entity);
                        bridge.set_selected(entity, true);

                        updateDragStatus(true);
                    }
                }

                // Mouse/Touch move
                function handleMove(e) {
                    if (!isDragging || draggedEntity === null) return;

                    e.preventDefault();
                    const pos = getPointerPos(e);

                    let newX = pos.x - dragOffset.x;
                    let newY = pos.y - dragOffset.y;

                    // Apply constraints
                    if (constrainX)
                        newY = getTransforms(bridge)[draggedEntity * 4 + 1];
                    if (constrainY)
                        newX = getTransforms(bridge)[draggedEntity * 4 + 0];

                    // Apply snap
                    if (snapEnabled) {
                        newX = Math.round(newX / snapSize) * snapSize;
                        newY = Math.round(newY / snapSize) * snapSize;
                    }

                    // Move entity
                    bridge.configure_entity(
                        draggedEntity,
                        newX,
                        newY, // position
                        NaN,
                        NaN, // skip size
                        NaN,
                        NaN, // skip velocity
                        NaN, // skip color
                        0, // skip stroke
                        0, // skip stroke_width
                        NaN, // skip rotation
                        255, // skip shape
                        2, // visible
                    );
                }

                // Mouse/Touch up
                function handleEnd(e) {
                    if (isDragging) {
                        isDragging = false;
                        draggedEntity = null;
                        updateDragStatus(false);
                    }
                }

                // Register event listeners
                canvas.addEventListener("mousedown", handleStart);
                canvas.addEventListener("mousemove", handleMove);
                canvas.addEventListener("mouseup", handleEnd);
                canvas.addEventListener("mouseleave", handleEnd);

                canvas.addEventListener("touchstart", handleStart, {
                    passive: false,
                });
                canvas.addEventListener("touchmove", handleMove, {
                    passive: false,
                });
                canvas.addEventListener("touchend", handleEnd);
                canvas.addEventListener("touchcancel", handleEnd);

                // Prevent context menu on right click
                canvas.addEventListener("contextmenu", (e) =>
                    e.preventDefault(),
                );

                // Make canvas focusable for keyboard
                canvas.tabIndex = 0;
                canvas.focus();
            }

            // ═══════════════════════════════════════════════════════════════════════════════
            // DRAG OPTIONS
            // ═══════════════════════════════════════════════════════════════════════════════

            function toggleSnap() {
                snapEnabled = !snapEnabled;
                document.getElementById("snapBtn").textContent =
                    `Snap: ${snapEnabled ? "ON" : "OFF"}`;
                updateInfo(
                    `✓ Snap ${snapEnabled ? "enabled" : "disabled"} (${snapSize}px)`,
                );
            }

            function toggleConstraints() {
                if (!constrainX && !constrainY) {
                    constrainX = true;
                    document.getElementById("constraintBtn").textContent =
                        "Constrain: X";
                } else if (constrainX && !constrainY) {
                    constrainX = false;
                    constrainY = true;
                    document.getElementById("constraintBtn").textContent =
                        "Constrain: Y";
                } else {
                    constrainY = false;
                    document.getElementById("constraintBtn").textContent =
                        "Constrain: OFF";
                }
                updateInfo(`✓ Constraints updated`);
            }

            function toggleMultiSelect() {
                multiSelectEnabled = !multiSelectEnabled;
                document.getElementById("multiBtn").textContent =
                    `Multi: ${multiSelectEnabled ? "ON" : "OFF"}`;
                updateInfo(
                    `✓ Multi-select ${multiSelectEnabled ? "enabled" : "disabled"}`,
                );
            }

            // ═══════════════════════════════════════════════════════════════════════════════
            // ENTITY OPERATIONS
            // ═══════════════════════════════════════════════════════════════════════════════

            async function cloneEntity(entityId, pos) {
                const transforms = getTransforms(bridge);
                const idx = entityId;

                const x = transforms[idx * 4 + 0] + 30;
                const y = transforms[idx * 4 + 1] + 30;
                const width = transforms[idx * 4 + 2];
                const height = transforms[idx * 4 + 3];

                // Get current color
                const colorsPtr = bridge.get_colors_ptr();
                const colors = new Uint32Array(
                    wasmMemory.buffer,
                    colorsPtr,
                    bridge.get_transforms_count(),
                );
                const currentColor = colors[idx];

                const rgba = {
                    r: currentColor & 0xff,
                    g: (currentColor >> 8) & 0xff,
                    b: (currentColor >> 16) & 0xff,
                    a: (currentColor >> 24) & 0xff,
                };

                bridge.set_active_color(rgba.r, rgba.g, rgba.b, rgba.a);
                const newId = await bridge.spawn_entity(x, y, width, height);

                initialPositions.set(newId, { x, y });
                updateInfo(`✓ Cloned entity #${entityId} → #${newId}`);
            }

            function cloneSelected() {
                if (selectedEntities.size === 0) {
                    updateInfo("⚠ No entities selected");
                    return;
                }

                const transforms = getTransforms(bridge);
                const colorsPtr = bridge.get_colors_ptr();
                const colors = new Uint32Array(
                    wasmMemory.buffer,
                    colorsPtr,
                    bridge.get_transforms_count(),
                );

                selectedEntities.forEach(async (entityId) => {
                    const idx = entityId;
                    const x = transforms[idx * 4 + 0] + 50;
                    const y = transforms[idx * 4 + 1] + 50;
                    const width = transforms[idx * 4 + 2];
                    const height = transforms[idx * 4 + 3];
                    const currentColor = colors[idx];

                    const rgba = {
                        r: currentColor & 0xff,
                        g: (currentColor >> 8) & 0xff,
                        b: (currentColor >> 16) & 0xff,
                        a: (currentColor >> 24) & 0xff,
                    };

                    bridge.set_active_color(rgba.r, rgba.g, rgba.b, rgba.a);
                    const newId = await bridge.spawn_entity(
                        x,
                        y,
                        width,
                        height,
                    );
                    initialPositions.set(newId, { x, y });
                });

                updateInfo(`✓ Cloned ${selectedEntities.size} entities`);
            }

            function deleteSelected() {
                if (selectedEntities.size === 0) {
                    updateInfo("⚠ No entities selected");
                    return;
                }

                const ecb = bridge.create_ecb(selectedEntities.size);
                selectedEntities.forEach((id) => ecb.despawn(id));
                bridge.execute_ecb(ecb);

                selectedEntities.clear();
                updateInfo(`✓ Deleted selected entities`);
            }

            function resetPositions() {
                const transforms = getTransforms(bridge);
                const count = bridge.get_entity_count();

                for (let i = 0; i < count; i++) {
                    const initial = initialPositions.get(i);
                    if (initial) {
                        bridge.configure_entity(
                            i,
                            initial.x,
                            initial.y,
                            NaN,
                            NaN,
                            NaN,
                            NaN,
                            NaN,
                            NaN,
                            0,
                            0,
                            0,
                            255,
                            2,
                        );
                    }
                }

                updateInfo("✓ Reset positions");
            }

            async function clearAll() {
                const count = bridge.get_entity_count();
                const ecb = bridge.create_ecb(count);

                for (let i = 0; i < count; i++) {
                    ecb.despawn(i);
                }

                await bridge.execute_ecb(ecb);
                selectedEntities.clear();
                initialPositions.clear();

                updateInfo("✓ Cleared all entities");
            }

            // ═══════════════════════════════════════════════════════════════════════════════
            // UI UPDATES
            // ═══════════════════════════════════════════════════════════════════════════════

            function updateInfo(message) {
                const info = document.getElementById("info");
                if (info) info.textContent = message;
            }

            function updateDragStatus(dragging) {
                const status = document.getElementById("dragStatus");
                const text = document.getElementById("dragStatusText");

                if (dragging) {
                    status.classList.add("active");
                    text.textContent = `Dragging entity #${draggedEntity}`;
                } else {
                    status.classList.remove("active");
                    text.textContent =
                        selectedEntities.size > 0
                            ? `${selectedEntities.size} selected`
                            : "Not dragging";
                }
            }

            // ═══════════════════════════════════════════════════════════════════════════════
            // STARTUP
            // ═══════════════════════════════════════════════════════════════════════════════

            console.log(`
════════════════════════════════════════════════════════════════════════════════
📖 COOKBOOK EXAMPLE 4 - Drag and Drop
════════════════════════════════════════════════════════════════════════════════

This example demonstrates:
  ✓ Mouse/touch drag detection using pointer events
  ✓ Entity hit testing with bounding box collision
  ✓ Real-time entity position updates during drag
  ✓ Drag constraints (horizontal/vertical)
  ✓ Grid snapping for precise alignment
  ✓ Multi-select with Shift+Click
  ✓ Clone entities with Ctrl+Click

DRAG AND DROP PATTERN:
  1. Detect pointer down → Find entity at position
  2. Calculate offset from entity center
  3. On pointer move → Update entity position
  4. On pointer up → Stop dragging

ZERO-COPY OPTIMIZATION:
  configure_entity() with NaN for unchanged properties:
  → Only position is updated each frame
  → No redundant reads/writes
  → Smooth 60fps dragging even with 1000+ entities

INPUT HANDLING:
  ├─ Mouse events (desktop)
  ├─ Touch events (mobile)
  ├─ Shift+Click for multi-select
  ├─ Ctrl+Click for quick clone
  └─ Visual feedback during drag

CONTROLS:
  ├─ Click & Drag → Move entity
  ├─ Shift+Click → Multi-select mode
  ├─ Ctrl+Click → Clone entity
  ├─ Snap button → Enable grid snapping
  ├─ Constrain button → Lock to X/Y axis
  └─ Multi button → Enable multi-select

════════════════════════════════════════════════════════════════════════════════
        `);

            // Start
            init();

            // Expose functions to window for onclick handlers
            window.spawnRectangles = spawnRectangles;
            window.spawnCircles = spawnCircles;
            window.spawnMixed = spawnMixed;
            window.spawnGrid = spawnGrid;
            window.toggleSnap = toggleSnap;
            window.toggleConstraints = toggleConstraints;
            window.toggleMultiSelect = toggleMultiSelect;
            window.cloneSelected = cloneSelected;
