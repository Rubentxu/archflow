<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Cookbook Example 5 - Tween Animations</title>
        <style>
            body {
                margin: 0;
                overflow: hidden;
                background: #0f0f1a;
                font-family: system-ui;
            }
            canvas {
                display: block;
            }
            #info {
                position: fixed;
                top: 20px;
                left: 20px;
                background: rgba(0, 0, 0, 0.85);
                color: #00ff88;
                padding: 15px;
                border-radius: 8px;
                font-family: "Monaco", monospace;
                font-size: 13px;
                z-index: 100;
                max-width: 420px;
            }
            .controls {
                position: fixed;
                top: 20px;
                right: 20px;
                display: flex;
                flex-direction: column;
                gap: 10px;
                z-index: 100;
                max-width: 280px;
            }
            .controls h3 {
                color: #4488ff;
                margin: 0 0 8px 0;
                font-size: 12px;
                text-transform: uppercase;
                letter-spacing: 1px;
            }
            .control-group {
                background: rgba(0, 0, 0, 0.5);
                padding: 12px;
                border-radius: 6px;
                margin-bottom: 8px;
            }
            .control-row {
                display: flex;
                gap: 6px;
                margin-bottom: 6px;
                flex-wrap: wrap;
            }
            .control-row:last-child {
                margin-bottom: 0;
            }
            .controls button {
                background: #334455;
                color: white;
                border: none;
                padding: 8px 12px;
                border-radius: 5px;
                font-size: 11px;
                font-weight: 600;
                cursor: pointer;
                transition: all 0.2s;
                flex: 1;
                min-width: 55px;
            }
            .controls button:hover {
                background: #445566;
                transform: scale(1.02);
            }
            .controls button:active {
                transform: scale(0.98);
            }
            .controls button.primary {
                background: #4488ff;
            }
            .controls button.primary:hover {
                background: #5599ff;
            }
            .controls button.success {
                background: #44ff88;
                color: #000;
            }
            .controls button.success:hover {
                background: #55ff99;
            }
            .controls button.danger {
                background: #ff4466;
            }
            .controls button.danger:hover {
                background: #ff5577;
            }
            .easing-demo {
                display: flex;
                gap: 4px;
                flex-wrap: wrap;
            }
            .easing-demo button {
                font-size: 9px;
                padding: 6px 8px;
                min-width: 45px;
            }
            .tween-info {
                position: fixed;
                bottom: 20px;
                left: 20px;
                background: rgba(0, 0, 0, 0.8);
                color: #4488ff;
                padding: 12px;
                border-radius: 6px;
                font-family: "Monaco", monospace;
                font-size: 11px;
                z-index: 100;
                min-width: 250px;
            }
            .tween-info .label {
                color: #888;
                margin-right: 8px;
            }
            .tween-info .value {
                color: #fff;
                font-weight: bold;
            }
            .progress-bar {
                width: 100%;
                height: 4px;
                background: #333;
                border-radius: 2px;
                margin-top: 8px;
                overflow: hidden;
            }
            .progress-fill {
                height: 100%;
                background: linear-gradient(90deg, #4488ff, #44ff88);
                transition: width 0.1s;
            }
        </style>
    </head>
    <body>
        <canvas id="canvas"></canvas>
        <div id="info">Initializing...</div>

        <div class="tween-info" id="tweenInfo">
            <div>
                <span class="label">Active Tweens:</span
                ><span class="value" id="activeTweens">0</span>
            </div>
            <div>
                <span class="label">Current:</span
                ><span class="value" id="currentTween">None</span>
            </div>
            <div>
                <span class="label">Progress:</span
                ><span class="value" id="tweenProgress">0%</span>
            </div>
            <div class="progress-bar">
                <div
                    class="progress-fill"
                    id="progressFill"
                    style="width: 0%"
                ></div>
            </div>
        </div>

        <div class="controls">
            <div class="control-group">
                <h3>📍 Position Tweens</h3>
                <div class="control-row">
                    <button class="primary" onclick="tweenMove('linear')">
                        Linear
                    </button>
                    <button class="primary" onclick="tweenMove('easeInOut')">
                        EaseInOut
                    </button>
                </div>
                <div class="control-row">
                    <button class="primary" onclick="tweenMove('bounce')">
                        Bounce
                    </button>
                    <button class="primary" onclick="tweenMove('easeOutCubic')">
                        Cubic
                    </button>
                </div>
            </div>

            <div class="control-group">
                <h3>📐 Scale Tweens</h3>
                <div class="control-row">
                    <button onclick="tweenScale('grow')">Grow 2x</button>
                    <button onclick="tweenScale('shrink')">Shrink 0.5x</button>
                </div>
                <div class="control-row">
                    <button onclick="tweenScale('pulse')">Pulse</button>
                    <button onclick="tweenScale('wobble')">Wobble</button>
                </div>
            </div>

            <div class="control-group">
                <h3>🎨 Color Tweens</h3>
                <div class="control-row">
                    <button onclick="tweenColor('rainbow')">Rainbow</button>
                    <button onclick="tweenColor('fade')">Fade Out</button>
                </div>
                <div class="control-row">
                    <button onclick="tweenColor('flash')">Flash</button>
                    <button onclick="tweenColor('gradient')">Gradient</button>
                </div>
            </div>

            <div class="control-group">
                <h3>🎭 Sequences & Parallel</h3>
                <div class="control-row">
                    <button class="success" onclick="playSequence()">
                        Sequence
                    </button>
                    <button class="success" onclick="playParallel()">
                        Parallel
                    </button>
                </div>
                <div class="control-row">
                    <button onclick="playChained()">Chained</button>
                    <button onclick="playComplex()">Complex</button>
                </div>
            </div>

            <div class="control-group">
                <h3>⚡ Quick Actions</h3>
                <div class="control-row">
                    <button onclick="spawnDemoEntity()">+ Entity</button>
                    <button class="danger" onclick="stopAll()">Stop All</button>
                </div>
                <div class="control-row">
                    <button onclick="resetScene()">Reset</button>
                    <button class="danger" onclick="clearAll()">Clear</button>
                </div>
            </div>

            <div class="control-group">
                <h3>📈 Easing Comparison</h3>
                <div class="easing-demo">
                    <button onclick="compareEasing('linear')">Lin</button>
                    <button onclick="compareEasing('easeIn')">In</button>
                    <button onclick="compareEasing('easeOut')">Out</button>
                    <button onclick="compareEasing('easeInOut')">InOut</button>
                    <button onclick="compareEasing('bounce')">Bnce</button>
                </div>
            </div>
        </div>

        <script type="module">
            import {
                createEngine,
                createRectangle,
                createCircle,
                TweenSystem,
                hexToRgba,
            } from "../../cookbook-shared/cookbook-utils.js";

            let bridge = null;
            let tweenSystem = null;
            let demoEntities = [];
            let currentTweenInfo = { name: "None", progress: 0 };

            // ═══════════════════════════════════════════════════════════════════════════════
            // EJEMPLO 5: TWEEN ANIMATIONS
            // ═══════════════════════════════════════════════════════════════════════════════

            async function init() {
                try {
                    const startTime = performance.now();

                    const { bridge: b } = await createEngine("canvas", {
                        onFrame: (dt, fps) => {
                            const count = bridge.get_entity_count
                                ? bridge.get_entity_count()
                                : 0;
                            const activeCount = tweenSystem
                                ? tweenSystem.tweens.length
                                : 0;
                            updateInfo(
                                `FPS: ${fps} | Entities: ${count} | Active Tweens: ${activeCount}`,
                            );
                            updateTweenInfo();
                        },
                    });

                    bridge = b;
                    tweenSystem = new TweenSystem(bridge);

                    // Spawn demo entities
                    await spawnDemoEntities();

                    const endTime = performance.now();
                    console.log(
                        `Initialization time: ${(endTime - startTime).toFixed(2)}ms`,
                    );
                    updateInfo(
                        "✓ Ready! Click buttons to play tween animations",
                    );
                } catch (error) {
                    console.error("Initialization failed:", error);
                    updateInfo("✗ Error: " + error.message, true);
                }
            }

            // ═══════════════════════════════════════════════════════════════════════════════
            // SPAWN DEMO ENTITIES
            // ═══════════════════════════════════════════════════════════════════════════════

            async function spawnDemoEntities() {
                // Create 5 demo entities in a row
                const colors = [
                    "#ff4466",
                    "#44ff88",
                    "#4488ff",
                    "#ffff44",
                    "#ff44ff",
                ];
                const startX = 960 - 2 * 180;
                const y = 540;

                for (let i = 0; i < 5; i++) {
                    const x = startX + i * 180;
                    const id = await createRectangle(
                        bridge,
                        x,
                        y,
                        100,
                        100,
                        colors[i],
                        "#000",
                        2,
                    );
                    demoEntities.push(id);
                }
            }

            async function spawnDemoEntity() {
                const colors = [
                    "#ff4466",
                    "#44ff88",
                    "#4488ff",
                    "#ffff44",
                    "#ff44ff",
                ];
                const color = colors[demoEntities.length % colors.length];
                const x = 200 + Math.random() * 1520;
                const y = 150 + Math.random() * 780;

                const id = await createRectangle(
                    bridge,
                    x,
                    y,
                    80,
                    80,
                    color,
                    "#000",
                    2,
                );
                demoEntities.push(id);
                updateInfo(`✓ Spawned entity #${demoEntities.length - 1}`);
            }

            // ═══════════════════════════════════════════════════════════════════════════════
            // POSITION TWEENS
            // ═══════════════════════════════════════════════════════════════════════════════

            function tweenMove(easing) {
                if (demoEntities.length === 0) return;

                const entity = demoEntities[0];
                const transforms = getTransforms(bridge);
                const startX = transforms[entity * 4 + 0];
                const startY = transforms[entity * 4 + 1];

                // Move in a square pattern
                const targetX = startX + 200;
                const targetY = startY;

                tweenSystem.moveTo(entity, targetX, targetY, 1000, easing, {
                    onUpdate: (progress) => {
                        currentTweenInfo = {
                            name: `Move (${easing})`,
                            progress,
                        };
                    },
                    onComplete: () => {
                        // Return to start
                        tweenSystem.moveTo(
                            entity,
                            startX,
                            startY,
                            1000,
                            easing,
                            {
                                onComplete: () => {
                                    currentTweenInfo = {
                                        name: "None",
                                        progress: 0,
                                    };
                                },
                            },
                        );
                    },
                });

                updateInfo(`✓ Playing move tween with ${easing} easing`);
            }

            // ═══════════════════════════════════════════════════════════════════════════════
            // SCALE TWEENS
            // ═══════════════════════════════════════════════════════════════════════════════

            function tweenScale(type) {
                if (demoEntities.length < 2) return;

                const entity = demoEntities[1];

                switch (type) {
                    case "grow":
                        tweenSystem.scaleTo(entity, 2.0, 800, "easeOutCubic", {
                            onUpdate: (p) => {
                                currentTweenInfo = {
                                    name: "Grow 2x",
                                    progress: p,
                                };
                            },
                            onComplete: () => {
                                tweenSystem.scaleTo(
                                    entity,
                                    1.0,
                                    800,
                                    "easeOutCubic",
                                    {
                                        onUpdate: (p) => {
                                            currentTweenInfo = {
                                                name: "Shrink back",
                                                progress: p,
                                            };
                                        },
                                        onComplete: () => {
                                            currentTweenInfo = {
                                                name: "None",
                                                progress: 0,
                                            };
                                        },
                                    },
                                );
                            },
                        });
                        break;

                    case "shrink":
                        tweenSystem.scaleTo(entity, 0.5, 800, "easeOutCubic", {
                            onUpdate: (p) => {
                                currentTweenInfo = {
                                    name: "Shrink 0.5x",
                                    progress: p,
                                };
                            },
                            onComplete: () => {
                                tweenSystem.scaleTo(
                                    entity,
                                    1.0,
                                    800,
                                    "easeOutCubic",
                                    {
                                        onUpdate: (p) => {
                                            currentTweenInfo = {
                                                name: "Grow back",
                                                progress: p,
                                            };
                                        },
                                        onComplete: () => {
                                            currentTweenInfo = {
                                                name: "None",
                                                progress: 0,
                                            };
                                        },
                                    },
                                );
                            },
                        });
                        break;

                    case "pulse":
                        pulseAnimation(entity);
                        break;

                    case "wobble":
                        wobbleAnimation(entity);
                        break;
                }

                updateInfo(`✓ Playing ${type} scale animation`);
            }

            function pulseAnimation(entity) {
                const pulse = () => {
                    tweenSystem.scaleTo(entity, 1.3, 400, "easeOutCubic", {
                        onComplete: () => {
                            tweenSystem.scaleTo(
                                entity,
                                1.0,
                                400,
                                "easeInCubic",
                                {
                                    onComplete: () => {
                                        if (
                                            currentTweenInfo.name.includes(
                                                "Pulse",
                                            )
                                        ) {
                                            pulse(entity);
                                        } else {
                                            currentTweenInfo = {
                                                name: "None",
                                                progress: 0,
                                            };
                                        }
                                    },
                                },
                            );
                        },
                    });
                };
                currentTweenInfo = { name: "Pulse", progress: 0 };
                pulse(entity);
            }

            function wobbleAnimation(entity) {
                const wobble = () => {
                    tweenSystem.scaleTo(entity, 1.4, 150, "easeOutCubic", {
                        onComplete: () => {
                            tweenSystem.scaleTo(
                                entity,
                                0.7,
                                150,
                                "easeInCubic",
                                {
                                    onComplete: () => {
                                        tweenSystem.scaleTo(
                                            entity,
                                            1.1,
                                            150,
                                            "easeOutCubic",
                                            {
                                                onComplete: () => {
                                                    tweenSystem.scaleTo(
                                                        entity,
                                                        1.0,
                                                        150,
                                                        "easeInCubic",
                                                        {
                                                            onComplete: () => {
                                                                if (
                                                                    currentTweenInfo.name.includes(
                                                                        "Wobble",
                                                                    )
                                                                ) {
                                                                    wobble(
                                                                        entity,
                                                                    );
                                                                } else {
                                                                    currentTweenInfo =
                                                                        {
                                                                            name: "None",
                                                                            progress: 0,
                                                                        };
                                                                }
                                                            },
                                                        },
                                                    );
                                                },
                                            },
                                        );
                                    },
                                },
                            );
                        },
                    });
                };
                currentTweenInfo = { name: "Wobble", progress: 0 };
                wobble(entity);
            }

            // ═══════════════════════════════════════════════════════════════════════════════
            // COLOR TWEENS
            // ═══════════════════════════════════════════════════════════════════════════════

            function tweenColor(type) {
                if (demoEntities.length < 3) return;

                const entity = demoEntities[2];

                switch (type) {
                    case "rainbow":
                        rainbowAnimation(entity);
                        break;

                    case "fade":
                        tweenSystem.colorTo(
                            entity,
                            "#ffffff",
                            1000,
                            "easeInOut",
                            {
                                onUpdate: (p) => {
                                    currentTweenInfo = {
                                        name: "Fade Out",
                                        progress: p,
                                    };
                                },
                                onComplete: () => {
                                    tweenSystem.colorTo(
                                        entity,
                                        "#ff44ff",
                                        1000,
                                        "easeInOut",
                                        {
                                            onUpdate: (p) => {
                                                currentTweenInfo = {
                                                    name: "Fade In",
                                                    progress: p,
                                                };
                                            },
                                            onComplete: () => {
                                                currentTweenInfo = {
                                                    name: "None",
                                                    progress: 0,
                                                };
                                            },
                                        },
                                    );
                                },
                            },
                        );
                        break;

                    case "flash":
                        flashAnimation(entity);
                        break;

                    case "gradient":
                        gradientAnimation(entity);
                        break;
                }

                updateInfo(`✓ Playing ${type} color animation`);
            }

            function rainbowAnimation(entity) {
                const colors = [
                    "#ff0000",
                    "#ff8800",
                    "#ffff00",
                    "#00ff00",
                    "#0088ff",
                    "#8800ff",
                ];
                let index = 0;

                const nextColor = () => {
                    tweenSystem.colorTo(
                        entity,
                        colors[index % colors.length],
                        300,
                        "linear",
                        {
                            onUpdate: (p) => {
                                currentTweenInfo = {
                                    name: "Rainbow",
                                    progress: p,
                                };
                            },
                            onComplete: () => {
                                index++;
                                if (currentTweenInfo.name.includes("Rainbow")) {
                                    nextColor();
                                } else {
                                    currentTweenInfo = {
                                        name: "None",
                                        progress: 0,
                                    };
                                }
                            },
                        },
                    );
                };

                currentTweenInfo = { name: "Rainbow", progress: 0 };
                nextColor();
            }

            function flashAnimation(entity) {
                const flash = () => {
                    tweenSystem.colorTo(entity, "#ffffff", 100, "linear", {
                        onComplete: () => {
                            tweenSystem.colorTo(
                                entity,
                                "#ffff44",
                                100,
                                "linear",
                                {
                                    onComplete: () => {
                                        if (
                                            currentTweenInfo.name.includes(
                                                "Flash",
                                            )
                                        ) {
                                            flash(entity);
                                        } else {
                                            currentTweenInfo = {
                                                name: "None",
                                                progress: 0,
                                            };
                                        }
                                    },
                                },
                            );
                        },
                    });
                };
                currentTweenInfo = { name: "Flash", progress: 0 };
                flash(entity);
            }

            function gradientAnimation(entity) {
                const colors = [
                    "#4488ff",
                    "#44ffff",
                    "#44ff88",
                    "#ffff44",
                    "#ff4444",
                ];
                let index = 0;

                const nextGradient = () => {
                    tweenSystem.colorTo(
                        entity,
                        colors[index % colors.length],
                        600,
                        "easeInOut",
                        {
                            onUpdate: (p) => {
                                currentTweenInfo = {
                                    name: "Gradient",
                                    progress: p,
                                };
                            },
                            onComplete: () => {
                                index++;
                                if (
                                    index < colors.length &&
                                    currentTweenInfo.name.includes("Gradient")
                                ) {
                                    nextGradient();
                                } else {
                                    currentTweenInfo = {
                                        name: "None",
                                        progress: 0,
                                    };
                                }
                            },
                        },
                    );
                };

                currentTweenInfo = { name: "Gradient", progress: 0 };
                nextGradient();
            }

            // ═══════════════════════════════════════════════════════════════════════════════
            // SEQUENCES & PARALLEL
            // ═══════════════════════════════════════════════════════════════════════════════

            function playSequence() {
                if (demoEntities.length < 4) return;

                const entity = demoEntities[3];
                const transforms = getTransforms(bridge);
                const startX = transforms[entity * 4 + 0];
                const startY = transforms[entity * 4 + 1];

                currentTweenInfo = { name: "Sequence", progress: 0 };

                // Sequence: Move → Scale → Color → Reset
                setTimeout(() => {
                    tweenSystem.moveTo(
                        entity,
                        startX + 150,
                        startY,
                        600,
                        "easeInOut",
                        {
                            onUpdate: (p) => {
                                currentTweenInfo = {
                                    name: "Sequence: Move",
                                    progress: p,
                                };
                            },
                            onComplete: () => {
                                tweenSystem.scaleTo(
                                    entity,
                                    1.5,
                                    400,
                                    "easeOutCubic",
                                    {
                                        onUpdate: (p) => {
                                            currentTweenInfo = {
                                                name: "Sequence: Scale",
                                                progress: p,
                                            };
                                        },
                                        onComplete: () => {
                                            tweenSystem.colorTo(
                                                entity,
                                                "#ff4466",
                                                500,
                                                "easeInOut",
                                                {
                                                    onUpdate: (p) => {
                                                        currentTweenInfo = {
                                                            name: "Sequence: Color",
                                                            progress: p,
                                                        };
                                                    },
                                                    onComplete: () => {
                                                        // Reset
                                                        tweenSystem.moveTo(
                                                            entity,
                                                            startX,
                                                            startY,
                                                            600,
                                                            "easeInOut",
                                                            {
                                                                onComplete:
                                                                    () => {
                                                                        tweenSystem.scaleTo(
                                                                            entity,
                                                                            1.0,
                                                                            400,
                                                                            "easeInOut",
                                                                            {
                                                                                onComplete:
                                                                                    () => {
                                                                                        tweenSystem.colorTo(
                                                                                            entity,
                                                                                            "#ffff44",
                                                                                            500,
                                                                                            "easeInOut",
                                                                                            {
                                                                                                onComplete:
                                                                                                    () => {
                                                                                                        currentTweenInfo =
                                                                                                            {
                                                                                                                name: "None",
                                                                                                                progress: 0,
                                                                                                            };
                                                                                                    },
                                                                                            },
                                                                                        );
                                                                                    },
                                                                            },
                                                                        );
                                                                    },
                                                            },
                                                        );
                                                    },
                                                },
                                            );
                                        },
                                    },
                                );
                            },
                        },
                    );
                }, 100);

                updateInfo("✓ Playing sequence animation");
            }

            function playParallel() {
                if (demoEntities.length < 4) return;

                const entity = demoEntities[3];
                const transforms = getTransforms(bridge);
                const startX = transforms[entity * 4 + 0];
                const startY = transforms[entity * 4 + 1];

                currentTweenInfo = { name: "Parallel", progress: 0 };

                // Run all tweens simultaneously
                tweenSystem.moveTo(
                    entity,
                    startX + 100,
                    startY - 100,
                    1000,
                    "easeInOut",
                    {
                        onUpdate: (p) => {
                            currentTweenInfo.progress = p;
                        },
                    },
                );

                tweenSystem.scaleTo(entity, 0.6, 1000, "easeOutCubic");

                tweenSystem.colorTo(entity, "#44ffff", 1000, "easeInOut", {
                    onComplete: () => {
                        // Reset all
                        tweenSystem.moveTo(
                            entity,
                            startX,
                            startY,
                            800,
                            "easeInOut",
                        );
                        tweenSystem.scaleTo(entity, 1.0, 800, "easeInOut");
                        tweenSystem.colorTo(
                            entity,
                            "#ffff44",
                            800,
                            "easeInOut",
                            {
                                onComplete: () => {
                                    currentTweenInfo = {
                                        name: "None",
                                        progress: 0,
                                    };
                                },
                            },
                        );
                    },
                });

                updateInfo("✓ Playing parallel animation");
            }

            function playChained() {
                if (demoEntities.length < 5) return;

                // Chain animations through multiple entities
                const delay = 200;

                demoEntities.forEach((entity, index) => {
                    setTimeout(() => {
                        const transforms = getTransforms(bridge);
                        const startX = transforms[entity * 4 + 0];
                        const startY = transforms[entity * 4 + 1];

                        tweenSystem.scaleTo(entity, 1.5, 300, "easeOutCubic", {
                            onComplete: () => {
                                tweenSystem.scaleTo(
                                    entity,
                                    1.0,
                                    300,
                                    "easeInCubic",
                                );
                            },
                        });
                    }, index * delay);
                });

                currentTweenInfo = { name: "Chained", progress: 0 };
                updateInfo("✓ Playing chained animation");
            }

            function playComplex() {
                // Complex multi-entity choreography
                if (demoEntities.length < 3) return;

                const transforms = getTransforms(bridge);

                // Entity 0: Orbit
                const entity0 = demoEntities[0];
                const startX0 = transforms[entity0 * 4 + 0];
                const startY0 = transforms[entity0 * 4 + 1];

                tweenSystem.moveTo(
                    entity0,
                    startX0 + 100,
                    startY0,
                    500,
                    "easeInOut",
                    {
                        onComplete: () => {
                            tweenSystem.moveTo(
                                entity0,
                                startX0,
                                startY0 + 100,
                                500,
                                "easeInOut",
                                {
                                    onComplete: () => {
                                        tweenSystem.moveTo(
                                            entity0,
                                            startX0 - 100,
                                            startY0,
                                            500,
                                            "easeInOut",
                                            {
                                                onComplete: () => {
                                                    tweenSystem.moveTo(
                                                        entity0,
                                                        startX0,
                                                        startY0,
                                                        500,
                                                        "easeInOut",
                                                        {
                                                            onComplete: () => {
                                                                currentTweenInfo =
                                                                    {
                                                                        name: "None",
                                                                        progress: 0,
                                                                    };
                                                            },
                                                        },
                                                    );
                                                },
                                            },
                                        );
                                    },
                                },
                            );
                        },
                    },
                );

                // Entity 1: Pulse continuously
                const entity1 = demoEntities[1];
                pulseAnimation(entity1);

                // Entity 2: Rainbow
                const entity2 = demoEntities[2];
                rainbowAnimation(entity2);

                currentTweenInfo = { name: "Complex", progress: 0 };
                updateInfo("✓ Playing complex choreography");
            }

            // ═══════════════════════════════════════════════════════════════════════════════
            // EASING COMPARISON
            // ═══════════════════════════════════════════════════════════════════════════════

            function compareEasing(easing) {
                // Spawn 5 entities to compare easing functions
                const startX = 300;
                const y = 540;
                const colors = [
                    "#ff4466",
                    "#44ff88",
                    "#4488ff",
                    "#ffff44",
                    "#ff44ff",
                ];

                demoEntities.forEach(async (id, i) => {
                    const x = startX + i * 150;
                    const newId = await createRectangle(
                        bridge,
                        x,
                        y - 150,
                        60,
                        60,
                        colors[i],
                        "#000",
                        2,
                    );

                    setTimeout(() => {
                        tweenSystem.moveTo(newId, x, y + 150, 1500, easing, {
                            onUpdate: (progress) => {
                                currentTweenInfo = {
                                    name: `Easing: ${easing}`,
                                    progress,
                                };
                            },
                            onComplete: () => {
                                if (i === demoEntities.length - 1) {
                                    currentTweenInfo = {
                                        name: "None",
                                        progress: 0,
                                    };
                                }
                            },
                        });
                    }, i * 100);
                });

                updateInfo(
                    `✓ Comparing ${easing} easing across ${demoEntities.length} entities`,
                );
            }

            // ═══════════════════════════════════════════════════════════════════════════════
            // ACTIONS
            // ═══════════════════════════════════════════════════════════════════════════════

            function stopAll() {
                tweenSystem.stopAll();
                currentTweenInfo = { name: "None", progress: 0 };
                updateInfo("✓ Stopped all tweens");
            }

            function resetScene() {
                stopAll();

                // Reset all entities to original positions
                demoEntities.forEach((entity, index) => {
                    const x = 960 - 2 * 180 + index * 180;
                    const y = 540;

                    tweenSystem.moveTo(entity, x, y, 500, "easeInOut");
                    tweenSystem.scaleTo(entity, 1.0, 500, "easeInOut");

                    const colors = [
                        "#ff4466",
                        "#44ff88",
                        "#4488ff",
                        "#ffff44",
                        "#ff44ff",
                    ];
                    tweenSystem.colorTo(
                        entity,
                        colors[index],
                        500,
                        "easeInOut",
                    );
                });

                updateInfo("✓ Reset scene");
            }

            async function clearAll() {
                stopAll();

                const count = bridge.get_entity_count();
                const ecb = bridge.create_ecb(count);

                for (let i = 0; i < count; i++) {
                    ecb.despawn(i);
                }

                await bridge.execute_ecb(ecb);
                demoEntities = [];

                updateInfo("✓ Cleared all entities");
            }

            // ═══════════════════════════════════════════════════════════════════════════════
            // UI UPDATES
            // ═══════════════════════════════════════════════════════════════════════════════

            function updateInfo(message) {
                const info = document.getElementById("info");
                if (info) info.textContent = message;
            }

            function updateTweenInfo() {
                const activeCount = tweenSystem ? tweenSystem.tweens.length : 0;
                document.getElementById("activeTweens").textContent =
                    activeCount;
                document.getElementById("currentTween").textContent =
                    currentTweenInfo.name;
                document.getElementById("tweenProgress").textContent =
                    Math.round(currentTweenInfo.progress * 100) + "%";
                document.getElementById("progressFill").style.width =
                    currentTweenInfo.progress * 100 + "%";
            }

            function getTransforms(bridge) {
                const ptr = bridge.get_transforms_ptr();
                const count = bridge.get_transforms_count();
                return new Float32Array(wasmMemory.buffer, ptr, count * 4);
            }

            // ═══════════════════════════════════════════════════════════════════════════════
            // STARTUP
            // ═══════════════════════════════════════════════════════════════════════════════

            console.log(`
════════════════════════════════════════════════════════════════════════════════
📖 COOKBOOK EXAMPLE 5 - Tween Animations
════════════════════════════════════════════════════════════════════════════════

This example demonstrates:
  ✓ TweenSystem class for smooth animations
  ✓ Position tweens with different easing functions
  ✓ Scale tweens (grow, shrink, pulse, wobble)
  ✓ Color tweens (rainbow, fade, flash, gradient)
  ✓ Sequential animations (one after another)
  ✓ Parallel animations (simultaneous)
  ✓ Chained animations (delayed across entities)
  ✓ Complex choreography combining multiple tweens

EASING FUNCTIONS:
  ├─ linear - Constant speed
  ├─ easeIn - Accelerating from zero
  ├─ easeOut - Decelerating to zero
  ├─ easeInOut - Accelerate then decelerate
  ├─ easeInCubic - Cubic acceleration
  ├─ easeOutCubic - Cubic deceleration
  ├─ easeInOutCubic - Smooth cubic
  └─ bounce - Bouncy effect at end

TWEEN ARCHITECTURE:
  1. TweenSystem manages all active tweens
  2. Each tween has: start, target, duration, easing
  3. requestAnimationFrame drives the update loop
  4. configure_entity() updates values each frame
  5. Tweens auto-remove when complete

ANIMATION PATTERNS:
  ├─ Simple: Single property tween
  ├─ Sequence: onComplete triggers next tween
  ├─ Parallel: Multiple tweens run simultaneously
  ├─ Chained: Delayed start across entities
  └─ Complex: Combination of patterns

PERFORMANCE:
  ├─ Zero-copy memory access via getTransforms()
  ├─ Partial updates with NaN skip pattern
  ├─ Automatic cleanup on completion
  └─ Efficient 60fps even with 100+ tweens

CONTROLS:
  ├─ Position Tweens - Move with easing comparison
  ├─ Scale Tweens - Grow, shrink, pulse, wobble
  ├─ Color Tweens - Rainbow, fade, flash effects
  ├─ Sequences - Ordered animations
  ├─ Parallel - Simultaneous animations
  ├─ Easing Demo - Compare easing functions
  └─ Stop All - Cancel active tweens

════════════════════════════════════════════════════════════════════════════════
        `);

            // Start
            init();

            // Expose functions to window for onclick handlers
            window.tweenMove = tweenMove;
            window.tweenScale = tweenScale;
            window.tweenColor = tweenColor;
            window.playSequence = playSequence;
            window.playParallel = playParallel;
            window.playChained = playChained;
            window.playComplex = playComplex;
            window.compareEasing = compareEasing;
            window.spawnDemoEntity = spawnDemoEntity;
            window.stopAll = stopAll;
            window.resetScene = resetScene;
            window.clearAll = clearAll;
        </script>
    </body>
</html>
