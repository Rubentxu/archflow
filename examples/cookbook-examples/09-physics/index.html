<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Cookbook Example 9 - Physics</title>
        <style>

                font-family: system-ui;
            }
            canvas {
                display: block;

            #info {
                position: fixed;

            .controls button.primary {

            }
            .controls button.primary:hover {

            .controls button.success:hover {

            .physics-info .value {

            .physics-info .row {

                position: fixed;
                bottom: 20px;

        </style>

    <body>
        <canvas id="canvas"></canvas>
        <div id="info">Initializing...</div>

        <div class="physics-info" id="physicsInfo">
            <div class="row">
                <span class="label">Physics Bodies:</span
                ><span class="value" id="bodyCount">0</span>
            </div>
            <div class="row">
                <span class="label">Gravity:</span
                ><span class="value" id="gravityValue">500 px/s²</span>
            </div>
            <div class="row">
                <span class="label">Sim Speed:</span
                ><span class="value" id="simSpeed">1.0x</span>
            </div>
            <div class="row">
                <span class="label">Collisions:</span
                ><span class="value" id="collisionCount">0</span>
            </div>
        </div>

        <div class="instructions">
            <strong>Physics Simulation</strong><br /><br />
            <kbd>Click</kbd> Spawn ball at cursor<br />
            <kbd>Space</kbd> Pause/Resume<br />
            <kbd>G</kbd> Toggle gravity<br />
            <kbd>R</kbd> Reset simulation
        </div>

        <div class="controls">
            <div class="control-group">
                <h3>🎱 Spawn Objects</h3>
                <div class="control-row">
                    <button class="primary" onclick="spawnBall()">Ball</button>
                    <button class="primary" onclick="spawnBox()">Box</button>
                </div>
                <div class="control-row">
                    <button class="primary" onclick="spawnRain()">
                        Rain (20)
                    </button>
                    <button class="primary" onclick="spawnExplosion()">
                        Explode
                    </button>
                </div>
            </div>

            <div class="control-group">
                <h3>⚙️ Physics Settings</h3>
                <div class="control-row">
                    <button onclick="setGravity(0)">Zero G</button>
                    <button onclick="setGravity(500)">Normal</button>
                </div>
                <div class="control-row">
                    <button onclick="setGravity(1000)">Heavy</button>
                    <button onclick="setGravity(-200)">Reverse</button>
                </div>
                <div class="control-row">
                    <button onclick="setBounciness(0.3)">Low Bounce</button>
                    <button onclick="setBounciness(0.9)">High Bounce</button>
                </div>
            </div>

            <div class="control-group">
                <h3>🎯 Interactions</h3>
                <div class="control-row">
                    <button onclick="applyImpulseUp()">Impulse ↑</button>
                    <button onclick="applyImpulseRandom()">Random</button>
                </div>
                <div class="control-row">
                    <button onclick="createExplosion()">💥 Explode</button>
                    <button onclick="attractToCenter()">Attract</button>
                </div>
            </div>

            <div class="control-group">
                <h3>🎨 Demo Scenes</h3>
                <div class="control-row">
                    <button class="success" onclick="scenePendulum()">
                        Pendulum
                    </button>
                    <button class="success" onclick="sceneFountain()">
                        Fountain
                    </button>
                </div>
                <div class="control-row">
                    <button class="success" onclick="sceneDomino()">
                        Domino
                    </button>
                    <button class="success" onclick="sceneStack()">
                        Stack
                    </button>
                </div>
            </div>

            <div class="control-group">
                <h3>⚡ Controls</h3>
                <div class="control-row">
                    <button onclick="togglePause()">
                        <span id="pauseBtn">Pause</span>
                    </button>
                    <button onclick="resetSimulation()">Reset</button>
                </div>
                <div class="control-row">
                    <button onclick="toggleWalls()">
                        <span id="wallsBtn">Walls: ON</span>
                    </button>
                    <button class="danger" onclick="clearScene()">Clear</button>
                </div>
            </div>
        </div>

        <script type="module">
            import {
                createEngine,
                createRectangle,
                createCircle,
                hexToRgba,
                getTransforms,
            } from "../../cookbook-shared/cookbook-utils.js";

            let bridge = null;
            let canvas = null;

            // Physics state
            const physicsBodies = new Map();
            let gravity = 500;
            let bounciness = 0.7;
            let simulationPaused = false;
            let wallsEnabled = true;
            let collisionCount = 0;

            // Canvas bounds
            const canvasWidth = 1920;
            const canvasHeight = 1080;

            // ═══════════════════════════════════════════════════════════════════════════════
            // EJEMPLO 9: PHYSICS
            // ═══════════════════════════════════════════════════════════════════════════════

            async function init() {
                try {
                    const startTime = performance.now();

                    const { bridge: b, canvas: c } = await createEngine(
                        "canvas",
                        {
                            onFrame: (dt, fps) => {
                                if (!simulationPaused) {
                                    updatePhysics(dt);
                                }
                                const count = bridge.get_entity_count
                                    ? bridge.get_entity_count()
                                    : 0;
                                updateInfo(
                                    `FPS: ${fps} | Entities: ${count} | Physics: ${physicsBodies.size}`,
                                );
                            },
                        },
                    );

                    bridge = b;
                    canvas = c;

                    // Setup input
                    setupPhysicsInput(canvas);

                    // Spawn initial demo
                    await sceneFountain();

                    const endTime = performance.now();
                    console.log(
                        `Initialization time: ${(endTime - startTime).toFixed(2)}ms`,
                    );
                    updateInfo("✓ Ready! Physics simulation active");
                } catch (error) {
                    console.error("Initialization failed:", error);
                    updateInfo("✗ Error: " + error.message, true);
                }
            }

            // ═══════════════════════════════════════════════════════════════════════════════
            // PHYSICS BODY SYSTEM
            // ═══════════════════════════════════════════════════════════════════════════════

            function createPhysicsBody(entityId, options = {}) {
                const {
                    mass = 1.0,
                    restitution = bounciness,
                    isStatic = false,
                    velocity = { x: 0, y: 0 },
                } = options;

                physicsBodies.set(entityId, {
                    mass,
                    restitution,
                    isStatic,
                    velocity: { ...velocity },
                    forces: { x: 0, y: 0 },
                    radius: options.radius || 50,
                    width: options.width || 100,
                    height: options.height || 100,
                });

                return physicsBodies.get(entityId);
            }

            function getPhysicsBody(entityId) {
                return physicsBodies.get(entityId);
            }

            function removePhysicsBody(entityId) {
                physicsBodies.delete(entityId);
            }

            // ═══════════════════════════════════════════════════════════════════════════════
            // PHYSICS UPDATE
            // ═══════════════════════════════════════════════════════════════════════════════

            function updatePhysics(dt) {
                const transforms = getTransforms(bridge);

                physicsBodies.forEach((body, entityId) => {
                    if (body.isStatic) return;

                    // Apply gravity
                    body.velocity.y += gravity * dt;

                    // Apply forces
                    body.velocity.x += (body.forces.x / body.mass) * dt;
                    body.velocity.y += (body.forces.y / body.mass) * dt;

                    // Reset forces
                    body.forces.x = 0;
                    body.forces.y = 0;

                    // Update position
                    let newX =
                        transforms[entityId * 4 + 0] + body.velocity.x * dt;
                    let newY =
                        transforms[entityId * 4 + 1] + body.velocity.y * dt;

                    // Wall collisions
                    if (wallsEnabled) {
                        const halfWidth = body.width / 2;
                        const halfHeight = body.height / 2;

                        // Left wall
                        if (newX - halfWidth < 0) {
                            newX = halfWidth;
                            body.velocity.x *= -body.restitution;
                            collisionCount++;
                        }
                        // Right wall
                        if (newX + halfWidth > canvasWidth) {
                            newX = canvasWidth - halfWidth;
                            body.velocity.x *= -body.restitution;
                            collisionCount++;
                        }
                        // Top wall
                        if (newY - halfHeight < 0) {
                            newY = halfHeight;
                            body.velocity.y *= -body.restitution;
                            collisionCount++;
                        }
                        // Bottom wall
                        if (newY + halfHeight > canvasHeight) {
                            newY = canvasHeight - halfHeight;
                            body.velocity.y *= -body.restitution;
                            collisionCount++;
                        }
                    }

                    // Apply new position
                    bridge.configure_entity(
                        entityId,
                        newX,
                        newY,
                        NaN,
                        NaN,
                        NaN,
                        NaN,
                        NaN,
                        NaN,
                        0,
                        0,
                        0,
                        255,
                        2,
                    );

                    // Apply slight damping
                    body.velocity.x *= 0.999;
                    body.velocity.y *= 0.999;
                });

                updatePhysicsInfo();
            }

            // ═══════════════════════════════════════════════════════════════════════════════
            // SPAWN OBJECTS
            // ═══════════════════════════════════════════════════════════════════════════════

            async function spawnBall(x = null, y = null) {
                const spawnX = x !== null ? x : 400 + Math.random() * 1120;
                const spawnY = y !== null ? y : 200;
                const radius = 20 + Math.random() * 30;
                const id = await createCircle(
                    bridge,
                    spawnX,
                    spawnY,
                    radius,
                    "#ff4466",
                );

                createPhysicsBody(id, {
                    mass: radius / 50,
                    restitution: bounciness,
                    radius: radius * 2,
                    width: radius * 2,
                    height: radius * 2,
                    velocity: { x: (Math.random() - 0.5) * 200, y: 0 },
                });

                return id;
            }

            async function spawnBox(x = null, y = null) {
                const spawnX = x !== null ? x : 400 + Math.random() * 1120;
                const spawnY = y !== null ? y : 200;
                const width = 40 + Math.random() * 40;
                const height = 40 + Math.random() * 40;
                const id = await createRectangle(
                    bridge,
                    spawnX,
                    spawnY,
                    width,
                    height,
                    "#4488ff",
                    "#000",
                    2,
                );

                createPhysicsBody(id, {
                    mass: (width * height) / 2500,
                    restitution: bounciness,
                    width: width,
                    height: height,
                    velocity: { x: (Math.random() - 0.5) * 150, y: 0 },
                });

                return id;
            }

            async function spawnRain() {
                for (let i = 0; i < 20; i++) {
                    setTimeout(() => {
                        spawnBall(300 + Math.random() * 1320, -50);
                    }, i * 50);
                }
                updateInfo("✓ Spawned rain of 20 balls");
            }

            async function spawnExplosion() {
                const centerX = 960;
                const centerY = 540;

                for (let i = 0; i < 15; i++) {
                    const angle = (i / 15) * Math.PI * 2;
                    const speed = 300 + Math.random() * 200;
                    const id = await spawnBall(centerX, centerY);

                    const body = getPhysicsBody(id);
                    body.velocity.x = Math.cos(angle) * speed;
                    body.velocity.y = Math.sin(angle) * speed;
                }

                updateInfo("✓ Spawned explosion! 15 balls");
            }

            // ═══════════════════════════════════════════════════════════════════════════════
            // PHYSICS SETTINGS
            // ═══════════════════════════════════════════════════════════════════════════════

            function setGravity(g) {
                gravity = g;
                updatePhysicsInfo();
                updateInfo(`✓ Gravity set to ${g} px/s²`);
            }

            function setBounciness(b) {
                bounciness = b;
                physicsBodies.forEach((body) => {
                    body.restitution = b;
                });
                updateInfo(`✓ Bounciness set to ${b}`);
            }

            // ═══════════════════════════════════════════════════════════════════════════════
            // INTERACTIONS
            // ═══════════════════════════════════════════════════════════════════════════════

            function applyImpulseUp() {
                physicsBodies.forEach((body, id) => {
                    if (!body.isStatic) {
                        body.velocity.y -= 400;
                    }
                });
                updateInfo("✓ Applied upward impulse to all bodies");
            }

            function applyImpulseRandom() {
                physicsBodies.forEach((body, id) => {
                    if (!body.isStatic) {
                        body.velocity.x += (Math.random() - 0.5) * 400;
                        body.velocity.y += (Math.random() - 0.5) * 400;
                    }
                });
                updateInfo("✓ Applied random impulses");
            }

            function createExplosion() {
                const centerX = 960;
                const centerY = 540;

                physicsBodies.forEach((body, id) => {
                    if (!body.isStatic) {
                        const transforms = getTransforms(bridge);
                        const dx = transforms[id * 4 + 0] - centerX;
                        const dy = transforms[id * 4 + 1] - centerY;
                        const dist = Math.sqrt(dx * dx + dy * dy) || 1;

                        const force = 50000 / (dist * dist);
                        body.velocity.x += (dx / dist) * force;
                        body.velocity.y += (dy / dist) * force;
                    }
                });

                updateInfo("💥 Explosion! All bodies pushed from center");
            }

            function attractToCenter() {
                const centerX = 960;
                const centerY = 540;

                physicsBodies.forEach((body, id) => {
                    if (!body.isStatic) {
                        const transforms = getTransforms(bridge);
                        const dx = centerX - transforms[id * 4 + 0];
                        const dy = centerY - transforms[id * 4 + 1];
                        const dist = Math.sqrt(dx * dx + dy * dy) || 1;

                        body.forces.x += (dx / dist) * 100;
                        body.forces.y += (dy / dist) * 100;
                    }
                });

                updateInfo("✓ Attracting all bodies to center");
            }

            // ═══════════════════════════════════════════════════════════════════════════════
            // DEMO SCENES
            // ═══════════════════════════════════════════════════════════════════════════════

            async function scenePendulum() {
                clearScene();

                // Create pendulum bob
                const bobId = await createCircle(
                    bridge,
                    960,
                    300,
                    40,
                    "#ff4466",
                );
                const body = createPhysicsBody(bobId, {
                    mass: 2,
                    restitution: bounciness,
                    width: 80,
                    height: 80,
                    isStatic: false,
                });

                // Store pendulum properties
                body.pendulumLength = 300;
                body.pendulumAngle = Math.PI / 4;
                body.isPendulum = true;

                // Override physics update for pendulum
                const originalUpdate = updatePhysics;
                // (Note: In a full implementation, you'd add pendulum-specific physics)

                updateInfo("✓ Pendulum scene (simplified physics)");
            }

            async function sceneFountain() {
                clearScene();

                // Create fountain emitter
                for (let i = 0; i < 30; i++) {
                    setTimeout(async () => {
                        const x = 960 + (Math.random() - 0.5) * 100;
                        const y = 900;
                        const id = await spawnBall(x, y);

                        const body = getPhysicsBody(id);
                        body.velocity.x = (Math.random() - 0.5) * 100;
                        body.velocity.y = -400 - Math.random() * 200;
                    }, i * 100);
                }

                updateInfo("✓ Fountain scene - 30 balls");
            }

            async function sceneDomino() {
                clearScene();

                const count = 10;
                const spacing = 80;
                const startX = (1920 - (count - 1) * spacing) / 2;

                for (let i = 0; i < count; i++) {
                    const x = startX + i * spacing;
                    const y = 900;
                    const id = await createRectangle(
                        bridge,
                        x,
                        y,
                        30,
                        100,
                        "#ffff44",
                        "#000",
                        2,
                    );

                    createPhysicsBody(id, {
                        mass: 1,
                        restitution: bounciness,
                        width: 30,
                        height: 100,
                        isStatic: i === 0, // First one is static
                        velocity: { x: 0, y: 0 },
                    });
                }

                // Push the first one
                setTimeout(() => {
                    const bodies = Array.from(physicsBodies.keys());
                    if (bodies.length > 0) {
                        const body = getPhysicsBody(bodies[0]);
                        body.velocity.x = 100;
                    }
                }, 500);

                updateInfo("✓ Domino scene - 10 blocks");
            }

            async function sceneStack() {
                clearScene();

                const rows = 5;
                const cols = 5;
                const boxWidth = 60;
                const boxHeight = 40;
                const startX = (1920 - (cols - 1) * (boxWidth + 10)) / 2;
                const startY = 1000;

                for (let row = 0; row < rows; row++) {
                    for (let col = 0; col < cols; col++) {
                        const x = startX + col * (boxWidth + 10);
                        const y = startY - row * boxHeight;
                        const id = await createRectangle(
                            bridge,
                            x,
                            y,
                            boxWidth,
                            boxHeight,
                            "#44ff88",
                            "#000",
                            2,
                        );

                        createPhysicsBody(id, {
                            mass: 1,
                            restitution: 0.3,
                            width: boxWidth,
                            height: boxHeight,
                            velocity: { x: 0, y: 0 },
                        });
                    }
                }

                updateInfo(`✓ Stack scene - ${rows * cols} boxes`);
            }

            // ═══════════════════════════════════════════════════════════════════════════════
            // CONTROLS
            // ═══════════════════════════════════════════════════════════════════════════════

            function togglePause() {
                simulationPaused = !simulationPaused;
                document.getElementById("pauseBtn").textContent =
                    simulationPaused ? "Resume" : "Pause";
                updateInfo(
                    `✓ Simulation ${simulationPaused ? "paused" : "resumed"}`,
                );
            }

            function toggleWalls() {
                wallsEnabled = !wallsEnabled;
                document.getElementById("wallsBtn").textContent =
                    `Walls: ${wallsEnabled ? "ON" : "OFF"}`;
                updateInfo(`✓ Walls ${wallsEnabled ? "enabled" : "disabled"}`);
            }

            function resetSimulation() {
                physicsBodies.forEach((body, id) => {
                    body.velocity.x = 0;
                    body.velocity.y = 0;
                    body.forces.x = 0;
                    body.forces.y = 0;
                });
                collisionCount = 0;
                updateInfo("✓ Reset simulation");
            }

            async function clearScene() {
                const count = bridge.get_entity_count();
                const ecb = bridge.create_ecb(count);

                for (let i = 0; i < count; i++) {
                    ecb.despawn(i);
                }

                await bridge.execute_ecb(ecb);
                physicsBodies.clear();
                collisionCount = 0;

                updateInfo("✓ Cleared scene");
            }

            // ═══════════════════════════════════════════════════════════════════════════════
            // INPUT HANDLING
            // ═══════════════════════════════════════════════════════════════════════════════

            function setupPhysicsInput(canvas) {
                function getPointerPos(e) {
                    const rect = canvas.getBoundingClientRect();
                    const clientX = e.touches
                        ? e.touches[0].clientX
                        : e.clientX;
                    const clientY = e.touches
                        ? e.touches[0].clientY
                        : e.clientY;
                    return {
                        x: (clientX - rect.left) * (canvas.width / rect.width),
                        y: (clientY - rect.top) * (canvas.height / rect.height),
                    };
                }

                canvas.addEventListener("mousedown", (e) => {
                    const pos = getPointerPos(e);
                    spawnBall(pos.x, pos.y);
                });

                canvas.addEventListener("keydown", (e) => {
                    switch (e.key.toLowerCase()) {
                        case " ":
                            e.preventDefault();
                            togglePause();
                            break;
                        case "g":
                            setGravity(gravity === 0 ? 500 : 0);
                            break;
                        case "r":
                            resetSimulation();
                            break;
                    }
                });

                canvas.tabIndex = 0;
                canvas.focus();
            }

            // ═══════════════════════════════════════════════════════════════════════════════
            // UI UPDATES
            // ═══════════════════════════════════════════════════════════════════════════════

            function updateInfo(message) {
                const info = document.getElementById("info");
                if (info) info.textContent = message;
            }

            function updatePhysicsInfo() {
                document.getElementById("bodyCount").textContent =
                    physicsBodies.size;
                document.getElementById("gravityValue").textContent =
                    `${gravity} px/s²`;
                document.getElementById("simSpeed").textContent =
                    simulationPaused ? "PAUSED" : "1.0x";
                document.getElementById("collisionCount").textContent =
                    collisionCount;
            }

            // ═══════════════════════════════════════════════════════════════════════════════
            // STARTUP
            // ═══════════════════════════════════════════════════════════════════════════════

            console.log(`
════════════════════════════════════════════════════════════════════════════════
📖 COOKBOOK EXAMPLE 9 - Physics
════════════════════════════════════════════════════════════════════════════════

This example demonstrates:
  ✓ Physics body system with mass, velocity, forces
  ✓ Gravity simulation with adjustable strength
  ✓ Wall collisions with bouncing
  ✓ Object spawning (balls, boxes, rain, explosion)
  ✓ Forces and impulses (explosion, attraction)
  ✓ Demo scenes (pendulum, fountain, domino, stack)
  ✓ Interactive physics with mouse click

PHYSICS ENGINE:
  Each physics body has:
  ├─ Mass: Affects force acceleration (F = ma)
  ├─ Velocity: Current speed in each axis
  ├─ Forces: Accumulated forces applied per frame
  ├─ Restitution: Bounciness (0-1)
  └─ Size: Width/height for collision detection

SIMULATION LOOP:
  1. Apply gravity to velocity
  2. Apply accumulated forces
  3. Reset forces for next frame
  4. Update position based on velocity
  5. Check and resolve wall collisions
  6. Apply velocity damping (air resistance)

PHYSICS FORMULAS:
  ├─ Gravity: v.y += g * dt
  ├─ Force: v += (F / m) * dt
  ├─ Position: p += v * dt
  ├─ Bounce: v = -v * restitution
  └─ Damping: v *= 0.999

COLLISION DETECTION:
  ├─ Wall boundaries: canvas edges
  ├─ Simple AABB collision detection
  ├─ Position clamping to prevent tunneling
  └─ Velocity reversal with restitution

INTERACTIONS:
  ├─ Click: Spawn ball at cursor
  ├─ Impulse: Apply instantaneous velocity change
  ├─ Explosion: Radial force from center
  ├─ Attract: Pull toward center point
  └─ Gravity: Toggle between zero and normal

DEMO SCENES:
  ├─ Pendulum: Swinging bob (simplified)
  ├─ Fountain: Continuous upward particle stream
  ├─ Domino: Chain reaction of falling blocks
  └─ Stack: Stacked boxes with physics

PERFORMANCE:
  ├─ Single physics update loop
  ├─ Zero-copy transform access
  ├─ Efficient Map-based body lookup
  └─ Handles 100+ bodies at 60fps

CONTROLS:
