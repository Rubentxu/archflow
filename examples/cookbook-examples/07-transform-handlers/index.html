<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Cookbook Example 7 - Transform Handlers</title>
        <style>
            body {
                margin: 0;
                overflow: hidden;
                background: #0f0f1a;
                font-family: system-ui;
            }
            canvas {
                display: block;
                cursor: default;
            }
            #info {
                position: fixed;
                top: 20px;
                left: 20px;
                background: rgba(0, 0, 0, 0.85);
                color: #00ff88;
                padding: 15px;
                border-radius: 8px;
                font-family: "Monaco", monospace;
                font-size: 13px;
                z-index: 100;
                max-width: 400px;
            }
            .controls {
                position: fixed;
                top: 20px;
                right: 20px;
                display: flex;
                flex-direction: column;
                gap: 10px;
                z-index: 100;
                max-width: 280px;
            }
            .controls h3 {
                color: #4488ff;
                margin: 0 0 8px 0;
                font-size: 12px;
                text-transform: uppercase;
                letter-spacing: 1px;
            }
            .control-group {
                background: rgba(0, 0, 0, 0.5);
                padding: 12px;
                border-radius: 6px;
                margin-bottom: 8px;
            }
            .control-row {
                display: flex;
                gap: 6px;
                margin-bottom: 6px;
                flex-wrap: wrap;
            }
            .control-row:last-child {
                margin-bottom: 0;
            }
            .controls button {
                background: #334455;
                color: white;
                border: none;
                padding: 8px 12px;
                border-radius: 5px;
                font-size: 11px;
                font-weight: 600;
                cursor: pointer;
                transition: all 0.2s;
                flex: 1;
                min-width: 55px;
            }
            .controls button:hover {
                background: #445566;
                transform: scale(1.02);
            }
            .controls button:active {
                transform: scale(0.98);
            }
            .controls button.primary {
                background: #4488ff;
            }
            .controls button.primary:hover {
                background: #5599ff;
            }
            .controls button.success {
                background: #44ff88;
                color: #000;
            }
            .controls button.success:hover {
                background: #55ff99;
            }
            .controls button.danger {
                background: #ff4466;
            }
            .controls button.danger:hover {
                background: #ff5577;
            }
            .handler-info {
                position: fixed;
                bottom: 20px;
                left: 20px;
                background: rgba(0, 0, 0, 0.8);
                color: #4488ff;
                padding: 12px;
                border-radius: 6px;
                font-family: "Monaco", monospace;
                font-size: 11px;
                z-index: 100;
                min-width: 300px;
            }
            .handler-info .label {
                color: #888;
                margin-right: 8px;
            }
            .handler-info .value {
                color: #fff;
                font-weight: bold;
            }
            .handler-info .row {
                margin: 4px 0;
            }
            .mode-indicator {
                position: fixed;
                top: 20px;
                left: 50%;
                transform: translateX(-50%);
                background: rgba(68, 136, 255, 0.2);
                border: 1px solid #4488ff;
                padding: 8px 16px;
                border-radius: 20px;
                font-family: "Monaco", monospace;
                font-size: 12px;
                color: #4488ff;
                z-index: 100;
            }
            .instructions {
                position: fixed;
                bottom: 20px;
                right: 20px;
                background: rgba(0, 0, 0, 0.8);
                color: #888;
                padding: 12px;
                border-radius: 6px;
                font-family: "Monaco", monospace;
                font-size: 11px;
                z-index: 100;
                max-width: 320px;
            }
            .instructions kbd {
                background: #333;
                color: #fff;
                padding: 2px 6px;
                border-radius: 3px;
                margin-right: 4px;
            }
            .instructions strong {
                color: #4488ff;
            }
        </style>
    </head>
    <body>
        <canvas id="canvas"></canvas>
        <div id="info">Initializing...</div>
        <div class="mode-indicator" id="modeIndicator">Mode: Select</div>

        <div class="handler-info" id="handlerInfo">
            <div class="row">
                <span class="label">Selected:</span
                ><span class="value" id="selectedEntity">None</span>
            </div>
            <div class="row">
                <span class="label">Position:</span
                ><span class="value" id="entityPosition">-</span>
            </div>
            <div class="row">
                <span class="label">Size:</span
                ><span class="value" id="entitySize">-</span>
            </div>
            <div class="row">
                <span class="label">Rotation:</span
                ><span class="value" id="entityRotation">-</span>
            </div>
            <div class="row">
                <span class="label">Active Handler:</span
                ><span class="value" id="activeHandler">None</span>
            </div>
        </div>

        <div class="instructions">
            <strong>Click</strong> entity to select<br />
            <strong>Drag handlers</strong> to transform<br />
            <kbd>1</kbd> Select Mode &nbsp; <kbd>2</kbd> Move<br />
            <kbd>3</kbd> Rotate Mode &nbsp; <kbd>4</kbd> Scale<br />
            <kbd>Delete</kbd> Remove entity
        </div>

        <div class="controls">
            <div class="control-group">
                <h3>🎯 Transform Mode</h3>
                <div class="control-row">
                    <button onclick="setMode('select')" class="primary">
                        Select
                    </button>
                    <button onclick="setMode('move')">Move</button>
                </div>
                <div class="control-row">
                    <button onclick="setMode('rotate')">Rotate</button>
                    <button onclick="setMode('scale')">Scale</button>
                </div>
            </div>

            <div class="control-group">
                <h3>📦 Spawn Test Entities</h3>
                <div class="control-row">
                    <button onclick="spawnRectangle()">▭ Rect</button>
                    <button onclick="spawnCircle()">● Circle</button>
                </div>
                <div class="control-row">
                    <button onclick="spawnTriangle()">▲ Tri</button>
                    <button onclick="spawnMultiple()">×5</button>
                </div>
            </div>

            <div class="control-group">
                <h3>⚙️ Handler Options</h3>
                <div class="control-row">
                    <button onclick="toggleHandlers()">
                        <span id="handlersBtn">Handlers: ON</span>
                    </button>
                    <button onclick="toggleSnap()">
                        <span id="snapBtn">Snap: OFF</span>
                    </button>
                </div>
                <div class="control-row">
                    <button onclick="toggleAspectRatio()">
                        <span id="aspectBtn">Aspect: FREE</span>
                    </button>
                    <button onclick="setRotationSnap(15)">15° Snap</button>
                </div>
            </div>

            <div class="control-group">
                <h3>🎨 Actions</h3>
                <div class="control-row">
                    <button onclick="resetTransform()">Reset</button>
                    <button onclick="centerEntity()">Center</button>
                </div>
                <div class="control-row">
                    <button class="success" onclick="cloneEntity()">
                        Clone
                    </button>
                    <button class="danger" onclick="deleteEntity()">
                        Delete
                    </button>
                </div>
                <div class="control-row">
                    <button onclick="duplicateGrid()">Grid 3x3</button>
                    <button class="danger" onclick="clearScene()">Clear</button>
                </div>
            </div>
        </div>

        <script type="module">
            import {
                createEngine,
                createRectangle,
                createCircle,
                createTriangle,
                hexToRgba,
                hexToPacked,
                getTransforms,
            } from "../../cookbook-shared/cookbook-utils.js";

            let bridge = null;
            let canvas = null;

            // Transform state
            let selectedEntity = null;
            let transformMode = "select"; // 'select', 'move', 'rotate', 'scale'
            let handlersVisible = true;
            let snapEnabled = false;
            let snapSize = 25;
            let rotationSnap = 15;
            let lockAspectRatio = false;

            // Handler state
            let activeHandler = null; // 'move', 'rotate', 'scale-tl', 'scale-tr', 'scale-bl', 'scale-br'
            let dragStart = null;
            let initialTransform = null;

            // Handler configuration
            const HANDLE_SIZE = 12;
            const ROTATE_HANDLE_OFFSET = 40;
            const HANDLE_COLOR = "#4488ff";
            const HANDLE_HOVER_COLOR = "#5599ff";

            // ═══════════════════════════════════════════════════════════════════════════════
            // EJEMPLO 7: TRANSFORM HANDLERS
            // ═══════════════════════════════════════════════════════════════════════════════

            async function init() {
                try {
                    const startTime = performance.now();

                    const { bridge: b, canvas: c } = await createEngine(
                        "canvas",
                        {
                            onFrame: (dt, fps) => {
                                const count = bridge.get_entity_count
                                    ? bridge.get_entity_count()
                                    : 0;
                                updateInfo(
                                    `FPS: ${fps} | Entities: ${count} | Mode: ${transformMode}`,
                                );
                                renderHandlers();
                                updateHandlerInfo();
                            },
                        },
                    );

                    bridge = b;
                    canvas = c;

                    // Setup input
                    setupTransformInput(canvas);

                    // Spawn initial entity
                    await spawnRectangle();

                    const endTime = performance.now();
                    console.log(
                        `Initialization time: ${(endTime - startTime).toFixed(2)}ms`,
                    );
                    updateInfo(
                        "✓ Ready! Click entity to select, drag handlers to transform",
                    );
                } catch (error) {
                    console.error("Initialization failed:", error);
                    updateInfo("✗ Error: " + error.message, true);
                }
            }

            // ═══════════════════════════════════════════════════════════════════════════════
            // SPAWN ENTITIES
            // ═══════════════════════════════════════════════════════════════════════════════

            async function spawnRectangle() {
                const x = 960;
                const y = 540;
                const id = await createRectangle(
                    bridge,
                    x,
                    y,
                    150,
                    100,
                    "#4488ff",
                    "#000",
                    2,
                );
                selectEntity(id);
                updateInfo(`✓ Spawned rectangle #${id}`);
            }

            async function spawnCircle() {
                const x = 960;
                const y = 540;
                const id = await createCircle(bridge, x, y, 60, "#44ff88");
                selectEntity(id);
                updateInfo(`✓ Spawned circle #${id}`);
            }

            async function spawnTriangle() {
                const x = 960;
                const y = 540;
                const id = await createTriangle(bridge, x, y, 100, "#ff44ff");
                selectEntity(id);
                updateInfo(`✓ Spawned triangle #${id}`);
            }

            async function spawnMultiple() {
                const colors = [
                    "#ff4466",
                    "#44ff88",
                    "#4488ff",
                    "#ffff44",
                    "#ff44ff",
                ];
                const positions = [
                    { x: 600, y: 350 },
                    { x: 960, y: 350 },
                    { x: 1320, y: 350 },
                    { x: 780, y: 730 },
                    { x: 1140, y: 730 },
                ];

                for (let i = 0; i < 5; i++) {
                    await createRectangle(
                        bridge,
                        positions[i].x,
                        positions[i].y,
                        100,
                        80,
                        colors[i],
                        "#000",
                        2,
                    );
                }

                updateInfo("✓ Spawned 5 entities");
            }

            // ═══════════════════════════════════════════════════════════════════════════════
            // TRANSFORM INPUT
            // ═══════════════════════════════════════════════════════════════════════════════

            function setupTransformInput(canvas) {
                function getPointerPos(e) {
                    const rect = canvas.getBoundingClientRect();
                    const clientX = e.touches
                        ? e.touches[0].clientX
                        : e.clientX;
                    const clientY = e.touches
                        ? e.touches[0].clientY
                        : e.clientY;
                    return {
                        x: (clientX - rect.left) * (canvas.width / rect.width),
                        y: (clientY - rect.top) * (canvas.height / rect.height),
                    };
                }

                function findEntityAt(pos) {
                    const transforms = getTransforms(bridge);
                    const count = bridge.get_entity_count();

                    for (let i = count - 1; i >= 0; i--) {
                        const x = transforms[i * 4 + 0];
                        const y = transforms[i * 4 + 1];
                        const width = transforms[i * 4 + 2];
                        const height = transforms[i * 4 + 3];

                        const halfWidth = width / 2;
                        const halfHeight = height / 2;

                        if (
                            pos.x >= x - halfWidth &&
                            pos.x <= x + halfWidth &&
                            pos.y >= y - halfHeight &&
                            pos.y <= y + halfHeight
                        ) {
                            return i;
                        }
                    }
                    return null;
                }

                function getHandlerAt(pos) {
                    if (selectedEntity === null || !handlersVisible)
                        return null;

                    const transforms = getTransforms(bridge);
                    const x = transforms[selectedEntity * 4 + 0];
                    const y = transforms[selectedEntity * 4 + 1];
                    const width = transforms[selectedEntity * 4 + 2];
                    const height = transforms[selectedEntity * 4 + 3];

                    const halfWidth = width / 2;
                    const halfHeight = height / 2;

                    // Check rotate handler
                    const rotateY = y - halfHeight - ROTATE_HANDLE_OFFSET;
                    if (
                        Math.abs(pos.x - x) < HANDLE_SIZE &&
                        Math.abs(pos.y - rotateY) < HANDLE_SIZE
                    ) {
                        return "rotate";
                    }

                    // Check scale handlers
                    const handlers = [
                        {
                            name: "scale-tl",
                            x: x - halfWidth,
                            y: y - halfHeight,
                        },
                        {
                            name: "scale-tr",
                            x: x + halfWidth,
                            y: y - halfHeight,
                        },
                        {
                            name: "scale-bl",
                            x: x - halfWidth,
                            y: y + halfHeight,
                        },
                        {
                            name: "scale-br",
                            x: x + halfWidth,
                            y: y + halfHeight,
                        },
                    ];

                    for (const handler of handlers) {
                        if (
                            Math.abs(pos.x - handler.x) < HANDLE_SIZE &&
                            Math.abs(pos.y - handler.y) < HANDLE_SIZE
                        ) {
                            return handler.name;
                        }
                    }

                    // Check move handler (center of entity)
                    if (
                        pos.x >= x - halfWidth &&
                        pos.x <= x + halfWidth &&
                        pos.y >= y - halfHeight &&
                        pos.y <= y + halfHeight
                    ) {
                        return "move";
                    }

                    return null;
                }

                // Mouse/Touch handlers
                canvas.addEventListener("mousedown", (e) => {
                    const pos = getPointerPos(e);
                    const handler = getHandlerAt(pos);

                    if (handler) {
                        // Start dragging handler
                        activeHandler = handler;
                        dragStart = pos;

                        const transforms = getTransforms(bridge);
                        initialTransform = {
                            x: transforms[selectedEntity * 4 + 0],
                            y: transforms[selectedEntity * 4 + 1],
                            width: transforms[selectedEntity * 4 + 2],
                            height: transforms[selectedEntity * 4 + 3],
                        };

                        e.preventDefault();
                    } else {
                        // Try to select entity
                        const entity = findEntityAt(pos);
                        if (entity !== null) {
                            selectEntity(entity);
                        }
                    }
                });

                canvas.addEventListener("mousemove", (e) => {
                    if (activeHandler && selectedEntity !== null) {
                        const pos = getPointerPos(e);
                        handleTransform(activeHandler, pos);
                        e.preventDefault();
                    } else {
                        // Update cursor based on hover
                        const handler = getHandlerAt(getPointerPos(e));
                        updateCursor(handler);
                    }
                });

                canvas.addEventListener("mouseup", () => {
                    activeHandler = null;
                    dragStart = null;
                    initialTransform = null;
                });

                canvas.addEventListener("mouseleave", () => {
                    activeHandler = null;
                    dragStart = null;
                    initialTransform = null;
                });

                // Keyboard
                canvas.addEventListener("keydown", (e) => {
                    switch (e.key) {
                        case "1":
                            setMode("select");
                            break;
                        case "2":
                            setMode("move");
                            break;
                        case "3":
                            setMode("rotate");
                            break;
                        case "4":
                            setMode("scale");
                            break;
                        case "Delete":
                        case "Backspace":
                            deleteEntity();
                            break;
                        case "Escape":
                            selectEntity(null);
                            break;
                    }
                });

                canvas.tabIndex = 0;
                canvas.focus();
            }

            function handleTransform(handler, pos) {
                if (!initialTransform) return;

                const dx = pos.x - dragStart.x;
                const dy = pos.y - dragStart.y;

                switch (handler) {
                    case "move":
                        let newX = initialTransform.x + dx;
                        let newY = initialTransform.y + dy;

                        if (snapEnabled) {
                            newX = Math.round(newX / snapSize) * snapSize;
                            newY = Math.round(newY / snapSize) * snapSize;
                        }

                        bridge.configure_entity(
                            selectedEntity,
                            newX,
                            newY,
                            NaN,
                            NaN,
                            NaN,
                            NaN,
                            NaN,
                            NaN,
                            0,
                            0,
                            0,
                            255,
                            2,
                        );
                        break;

                    case "rotate":
                        const transforms = getTransforms(bridge);
                        const centerX = transforms[selectedEntity * 4 + 0];
                        const centerY = transforms[selectedEntity * 4 + 1];

                        const angle =
                            Math.atan2(pos.y - centerY, pos.x - centerX) *
                                (180 / Math.PI) +
                            90;

                        const snappedAngle = snapEnabled
                            ? Math.round(angle / rotationSnap) * rotationSnap
                            : angle;

                        bridge.configure_entity(
                            selectedEntity,
                            NaN,
                            NaN,
                            NaN,
                            NaN,
                            NaN,
                            NaN,
                            NaN,
                            NaN,
                            0,
                            0,
                            snappedAngle,
                            255,
                            2,
                        );
                        break;

                    case "scale-tl":
                    case "scale-tr":
                    case "scale-bl":
                    case "scale-br":
                        handleScale(handler, dx, dy);
                        break;
                }
            }

            function handleScale(handler, dx, dy) {
                let newWidth = initialTransform.width;
                let newHeight = initialTransform.height;

                switch (handler) {
                    case "scale-br":
                        newWidth += dx;
                        newHeight += dy;
                        break;
                    case "scale-bl":
                        newWidth -= dx;
                        newHeight += dy;
                        break;
                    case "scale-tr":
                        newWidth += dx;
                        newHeight -= dy;
                        break;
                    case "scale-tl":
                        newWidth -= dx;
                        newHeight -= dy;
                        break;
                }

                // Minimum size
                newWidth = Math.max(20, newWidth);
                newHeight = Math.max(20, newHeight);

                if (lockAspectRatio) {
                    const aspect =
                        initialTransform.width / initialTransform.height;
                    if (Math.abs(dx) > Math.abs(dy)) {
                        newHeight = newWidth / aspect;
                    } else {
                        newWidth = newHeight * aspect;
                    }
                }

                bridge.configure_entity(
                    selectedEntity,
                    NaN,
                    NaN,
                    newWidth,
                    newHeight,
                    NaN,
                    NaN,
                    NaN,
                    NaN,
                    0,
                    0,
                    0,
                    255,
                    2,
                );
            }

            // ═══════════════════════════════════════════════════════════════════════════════
            // RENDER HANDLERS
            // ═══════════════════════════════════════════════════════════════════════════════

            function renderHandlers() {
                if (selectedEntity === null || !handlersVisible) return;

                const ctx = canvas.getContext("2d");
                const transforms = getTransforms(bridge);

                const x = transforms[selectedEntity * 4 + 0];
                const y = transforms[selectedEntity * 4 + 1];
                const width = transforms[selectedEntity * 4 + 2];
                const height = transforms[selectedEntity * 4 + 3];

                const halfWidth = width / 2;
                const halfHeight = height / 2;

                // Draw selection border
                ctx.strokeStyle = "#4488ff";
                ctx.lineWidth = 2;
                ctx.strokeRect(x - halfWidth, y - halfHeight, width, height);

                // Draw scale handles
                ctx.fillStyle = HANDLE_COLOR;
                const corners = [
                    { x: x - halfWidth, y: y - halfHeight },
                    { x: x + halfWidth, y: y - halfHeight },
                    { x: x - halfWidth, y: y + halfHeight },
                    { x: x + halfWidth, y: y + halfHeight },
                ];

                corners.forEach((corner) => {
                    ctx.beginPath();
                    ctx.arc(
                        corner.x,
                        corner.y,
                        HANDLE_SIZE / 2,
                        0,
                        Math.PI * 2,
                    );
                    ctx.fill();
                });

                // Draw rotate handle
                const rotateY = y - halfHeight - ROTATE_HANDLE_OFFSET;
                ctx.beginPath();
                ctx.arc(x, rotateY, HANDLE_SIZE / 2, 0, Math.PI * 2);
                ctx.fill();

                // Draw line to rotate handle
                ctx.strokeStyle = "#4488ff";
                ctx.lineWidth = 1;
                ctx.setLineDash([5, 5]);
                ctx.beginPath();
                ctx.moveTo(x, y - halfHeight);
                ctx.lineTo(x, rotateY);
                ctx.stroke();
                ctx.setLineDash([]);
            }

            function updateCursor(handler) {
                if (!handler) {
                    canvas.style.cursor = "default";
                    return;
                }

                switch (handler) {
                    case "move":
                        canvas.style.cursor = "move";
                        break;
                    case "rotate":
                        canvas.style.cursor = "grab";
                        break;
                    case "scale-tl":
                    case "scale-br":
                        canvas.style.cursor = "nwse-resize";
                        break;
                    case "scale-tr":
                    case "scale-bl":
                        canvas.style.cursor = "nesw-resize";
                        break;
                    default:
                        canvas.style.cursor = "default";
                }
            }

            // ═══════════════════════════════════════════════════════════════════════════════
            // TRANSFORM MODE
            // ═══════════════════════════════════════════════════════════════════════════════

            function setMode(mode) {
                transformMode = mode;
                document.getElementById("modeIndicator").textContent =
                    `Mode: ${mode.charAt(0).toUpperCase() + mode.slice(1)}`;
                updateInfo(`✓ Transform mode: ${mode}`);
            }

            function selectEntity(id) {
                selectedEntity = id;
                updateHandlerInfo();
            }

            // ═══════════════════════════════════════════════════════════════════════════════
            // OPTIONS
            // ═══════════════════════════════════════════════════════════════════════════════

            function toggleHandlers() {
                handlersVisible = !handlersVisible;
                document.getElementById("handlersBtn").textContent =
                    `Handlers: ${handlersVisible ? "ON" : "OFF"}`;
                updateInfo(
                    `✓ Handlers ${handlersVisible ? "enabled" : "disabled"}`,
                );
            }

            function toggleSnap() {
                snapEnabled = !snapEnabled;
                document.getElementById("snapBtn").textContent =
                    `Snap: ${snapEnabled ? "ON" : "OFF"}`;
                updateInfo(`✓ Snap ${snapEnabled ? "enabled" : "disabled"}`);
            }

            function toggleAspectRatio() {
                lockAspectRatio = !lockAspectRatio;
                document.getElementById("aspectBtn").textContent =
                    `Aspect: ${lockAspectRatio ? "LOCKED" : "FREE"}`;
                updateInfo(
                    `✓ Aspect ratio ${lockAspectRatio ? "locked" : "free"}`,
                );
            }

            function setRotationSnap(angle) {
                rotationSnap = angle;
                snapEnabled = true;
                document.getElementById("snapBtn").textContent =
                    `Snap: ${angle}°`;
                updateInfo(`✓ Rotation snap: ${angle}°`);
            }

            // ═══════════════════════════════════════════════════════════════════════════════
            // ACTIONS
            // ═══════════════════════════════════════════════════════════════════════════════

            function resetTransform() {
                if (selectedEntity === null) return;

                bridge.configure_entity(
                    selectedEntity,
                    960,
                    540,
                    150,
                    100,
                    NaN,
                    NaN,
                    NaN,
                    NaN,
                    0,
                    0,
                    0,
                    255,
                    2,
                );

                updateInfo(`✓ Reset entity #${selectedEntity} transform`);
            }

            function centerEntity() {
                if (selectedEntity === null) return;

                bridge.configure_entity(
                    selectedEntity,
                    960,
                    540,
                    NaN,
                    NaN,
                    NaN,
                    NaN,
                    NaN,
                    NaN,
                    0,
                    0,
                    0,
                    255,
                    2,
                );

                updateInfo(`✓ Centered entity #${selectedEntity}`);
            }

            async function cloneEntity() {
                if (selectedEntity === null) return;

                const transforms = getTransforms(bridge);
                const colorsPtr = bridge.get_colors_ptr();
                const colors = new Uint32Array(
                    wasmMemory.buffer,
                    colorsPtr,
                    bridge.get_transforms_count(),
                );

                const x = transforms[selectedEntity * 4 + 0] + 50;
                const y = transforms[selectedEntity * 4 + 1] + 50;
                const width = transforms[selectedEntity * 4 + 2];
                const height = transforms[selectedEntity * 4 + 3];
                const color = colors[selectedEntity];

                const rgba = {
                    r: color & 0xff,
                    g: (color >> 8) & 0xff,
                    b: (color >> 16) & 0xff,
                    a: (color >> 24) & 0xff,
                };

                bridge.set_active_color(rgba.r, rgba.g, rgba.b, rgba.a);
                const newId = await bridge.spawn_entity(x, y, width, height);
                selectEntity(newId);

                updateInfo(`✓ Cloned entity #${selectedEntity} → #${newId}`);
            }

            function deleteEntity() {
                if (selectedEntity === null) return;

                const ecb = bridge.create_ecb(1);
                ecb.despawn(selectedEntity);
                bridge.execute_ecb(ecb);

                updateInfo(`✓ Deleted entity #${selectedEntity}`);
                selectEntity(null);
            }

            async function duplicateGrid() {
                if (selectedEntity === null) return;

                const transforms = getTransforms(bridge);
                const colorsPtr = bridge.get_colors_ptr();
                const colors = new Uint32Array(
                    wasmMemory.buffer,
                    colorsPtr,
                    bridge.get_transforms_count(),
                );

                const baseX = transforms[selectedEntity * 4 + 0];
                const baseY = transforms[selectedEntity * 4 + 1];
                const width = transforms[selectedEntity * 4 + 2];
                const height = transforms[selectedEntity * 4 + 3];
                const color = colors[selectedEntity];

                const rgba = {
                    r: color & 0xff,
                    g: (color >> 8) & 0xff,
                    b: (color >> 16) & 0xff,
                    a: (color >> 24) & 0xff,
                };

                bridge.set_active_color(rgba.r, rgba.g, rgba.b, rgba.a);

                const spacing = 150;
                const offset = ((3 - 1) * spacing) / 2;
                const startX = baseX - offset;
                const startY = baseY - offset;

                for (let row = 0; row < 3; row++) {
                    for (let col = 0; col < 3; col++) {
                        const x = startX + col * spacing;
                        const y = startY + row * spacing;
                        await bridge.spawn_entity(x, y, width, height);
                    }
                }

                updateInfo("✓ Created 3x3 grid");
            }

            async function clearScene() {
                const count = bridge.get_entity_count();
                const ecb = bridge.create_ecb(count);

                for (let i = 0; i < count; i++) {
                    ecb.despawn(i);
                }

                await bridge.execute_ecb(ecb);
                selectEntity(null);

                updateInfo("✓ Cleared scene");
            }

            // ═══════════════════════════════════════════════════════════════════════════════
            // UI UPDATES
            // ═══════════════════════════════════════════════════════════════════════════════

            function updateInfo(message) {
                const info = document.getElementById("info");
                if (info) info.textContent = message;
            }

            function updateHandlerInfo() {
                document.getElementById("selectedEntity").textContent =
                    selectedEntity !== null ? `#${selectedEntity}` : "None";
                document.getElementById("activeHandler").textContent =
                    activeHandler || "None";

                if (selectedEntity !== null) {
                    const transforms = getTransforms(bridge);
                    const x = transforms[selectedEntity * 4 + 0].toFixed(0);
                    const y = transforms[selectedEntity * 4 + 1].toFixed(0);
                    const w = transforms[selectedEntity * 4 + 2].toFixed(0);
                    const h = transforms[selectedEntity * 4 + 3].toFixed(0);

                    document.getElementById("entityPosition").textContent =
                        `(${x}, ${y})`;
                    document.getElementById("entitySize").textContent =
                        `${w}×${h}`;
                    document.getElementById("entityRotation").textContent =
                        "0°";
                } else {
                    document.getElementById("entityPosition").textContent = "-";
                    document.getElementById("entitySize").textContent = "-";
                    document.getElementById("entityRotation").textContent = "-";
                }
            }

            // ═══════════════════════════════════════════════════════════════════════════════
            // STARTUP
            // ═══════════════════════════════════════════════════════════════════════════════

            console.log(`

  ✓ Visual transform handlers (move, scale, rotate)
  ✓ Interactive drag-to-transform interface
  ✓ Canvas-based handler rendering overlay
  ✓ Hit testing for handler detection
  ✓ Cursor changes based on active handler
  ✓ Snap to grid for precise positioning
  ✓ Aspect ratio locking during scale
  ✓ Rotation snapping (15° increments)

TRANSFORM HANDLERS:
  ├─ Move Handler: Drag entity to new position
  ├─ Scale Handles: 4 corner handles for resizing
  ├─ Rotate Handler: Top handle with connector line
  └─ Visual Feedback: Border, handles, cursor changes

HANDLER RENDERING:
  1. Get entity transform (x, y, width, height)
  2. Draw selection border around entity
  3. Draw 4 corner scale handles
  4. Draw rotate handle with connector line
  5. Update cursor based on hover state

HIT TESTING:
  1. Check rotate handler first (top center)
  2. Check scale handles (4 corners)
  3. Check move handler (entity bounds)
  4. Return null if no handler hit

  ├─ Scale: Update width, height from corner drag

  configure_entity() with NaN for unchanged props:
  → Only modified properties transmitted to WASM

  ├─ Aspect button - Lock aspect ratio

            // Start
            init();

            // Expose functions to window for onclick handlers
            window.spawnRectangle = spawnRectangle;
            window.spawnCircle = spawnCircle;
            window.spawnTriangle = spawnTriangle;
            window.spawnMultiple = spawnMultiple;
            window.setMode = setMode;
            window.selectEntity = selectEntity;
            window.toggleHandlers = toggleHandlers;
            window.toggleSnap = toggleSnap;
            window.toggleAspectRatio = toggleAspectRatio;
            window.setRotationSnap = setRotationSnap;
            window.resetTransform = resetTransform;
            window.centerEntity = centerEntity;
            window.cloneEntity = cloneEntity;
            window.deleteEntity = deleteEntity;
            window.duplicateGrid = duplicateGrid;
            window.clearScene = clearScene;
        </script>
    </body>
