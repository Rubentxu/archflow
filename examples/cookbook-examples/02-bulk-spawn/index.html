<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Cookbook Example 2 - Bulk Spawn</title>
        <style>
            body {
                margin: 0;
                overflow: hidden;
                background: #0f0f1a;
                font-family: system-ui;
            }
            canvas {
                display: block;
            }
            #info {
                position: fixed;
                top: 20px;
                left: 20px;
                background: rgba(0, 0, 0, 0.8);
                color: #00ff88;
                padding: 15px;
                border-radius: 8px;
                font-family: "Monaco", monospace;
                font-size: 13px;
                z-index: 100;
            }
            .controls {
                position: fixed;
                top: 20px;
                right: 20px;
                display: flex;
                flex-direction: column;
                gap: 10px;
                z-index: 100;
            }
            .controls button {
                background: #4488ff;
                color: white;
                border: none;
                padding: 12px 20px;
                border-radius: 6px;
                font-size: 14px;
                font-weight: 600;
                cursor: pointer;
                transition: all 0.2s;
            }
            .controls button:hover {
                background: #5599ff;
                transform: scale(1.05);
            }
            .controls button:active {
                transform: scale(0.95);
            }
            .stats {
                position: fixed;
                bottom: 20px;
                left: 20px;
                background: rgba(0, 0, 0, 0.8);
                color: #0ff;
                padding: 15px;
                border-radius: 8px;
                font-family: "Monaco", monospace;
                font-size: 12px;
                z-index: 100;
            }
        </style>
    </head>
    <body>
        <canvas id="canvas"></canvas>
        <div id="info">Initializing...</div>
        <div class="stats" id="stats"></div>

        <div class="controls">
            <button onclick="spawnGrid()">▦ Grid (10x10)</button>
            <button onclick="spawnParticles()">💥 Particles (500)</button>
            <button onclick="spawnRings()">⭕ Concentric</button>
            <button onclick="clearScene()">🗑️ Clear</button>
        </div>

        <script type="module">
            import {
                createEngine,
                spawnGrid as spawnGridUtil,
                spawnParticles as spawnParticlesUtil,
                hexToRgba,
                getTransforms,
            } from "../../cookbook-shared/cookbook-utils.js";

            let bridge = null;

            // ═══════════════════════════════════════════════════════════════════════════════
            // EJEMPLO 2: BULK SPAWN
            // ═══════════════════════════════════════════════════════════════════════════════

            async function init() {
                try {
                    const startTime = performance.now();

                    const { bridge: b } = await createEngine("canvas", {
                        onFrame: (dt, fps) => {
                            const count = b.get_entity_count
                                ? b.get_entity_count()
                                : 0;
                            updateInfo(`FPS: ${fps} | Entities: ${count}`);
                        },
                    });

                    bridge = b;

                    setupCanvasContext();

                    const endTime = performance.now();
                    console.log(
                        `Initialization time: ${(endTime - startTime).toFixed(2)}ms`,
                    );
                    updateInfo("✓ Ready! Click a button to spawn entities");
                } catch (error) {
                    console.error("Initialization failed:", error);
                    updateInfo("✗ Error: " + error.message, true);
                }
            }

            // ═══════════════════════════════════════════════════════════════════════════════
            // FUNCIONES DEL EJEMPLO
            // ═══════════════════════════════════════════════════════════════════════════════

            async function spawnGrid() {
                const startTime = performance.now();

                // 10x10 grid = 100 entities
                const ids = await spawnGridUtil(
                    bridge,
                    10,
                    10,
                    80,
                    50,
                    "#4488ff",
                );

                const endTime = performance.now();
                const time = (endTime - startTime).toFixed(2);

                console.log(`✓ Spawned ${ids.length} entities in ${time}ms`);
                updateInfo(`✓ Spawned ${ids.length} entities in ${time}ms`);
                updateStats(`Grid: ${ids.length} entities in ${time}ms`);
            }

            async function spawnParticles() {
                const startTime = performance.now();

                // 500 partículas con explosión
                const { ids, velocities } = await spawnParticlesUtil(
                    bridge,
                    500,
                    960,
                    540,
                    300,
                );

                const endTime = performance.now();
                const time = (endTime - startTime).toFixed(2);

                console.log(`✓ Spawned ${ids.length} particles in ${time}ms`);
                updateInfo(`✓ Spawned ${ids.length} particles in ${time}ms`);
                updateStats(`Particles: ${ids.length} entities in ${time}ms`);
            }

            async function spawnRings() {
                const startTime = performance.now();

                // Crear círculos concéntricos
                const count = await spawnConcentricCircles(
                    bridge,
                    960,
                    540,
                    5,
                    8,
                );

                const endTime = performance.now();
                const time = (endTime - startTime).toFixed(2);

                console.log(`✓ Spawned ${count} entities in ${time}ms`);
                updateInfo(`✓ Spawned ${count} circles in ${time}ms`);
                updateStats(`Concentric: ${count} entities in ${time}ms`);
            }

            function clearScene() {
                const startTime = performance.now();

                const count = bridge.get_entity_count();
                const ecb = bridge.create_ecb(count);

                for (let i = 0; i < count; i++) {
                    ecb.despawn(i);
                }

                bridge.execute_ecb(ecb);

                const endTime = performance.now();
                const time = (endTime - startTime).toFixed(2);

                console.log(`✓ Cleared ${count} entities in ${time}ms`);
                updateInfo(`✓ Cleared ${count} entities`);
                updateStats(`Cleared: ${count} entities in ${time}ms`);
            }

            // ═══════════════════════════════════════════════════════════════════════════════
            // FUNCIONES AUXILIARES
            // ═══════════════════════════════════════════════════════════════════════════════

            async function spawnConcentricCircles(
                bridge,
                centerX,
                centerY,
                rings,
                circlesPerRing,
            ) {
                let count = 0;
                for (let ring = 1; ring <= rings; ring++) {
                    count += circlesPerRing * ring;
                }

                const positions = new Float32Array(count * 2);
                const sizes = new Float32Array(count * 2);
                const colors = new Uint8Array(count * 4);

                let index = 0;

                for (let ring = 1; ring <= rings; ring++) {
                    const radius = ring * 60;
                    const countInRing = circlesPerRing * ring;

                    for (let i = 0; i < countInRing; i++) {
                        const angle = (i / countInRing) * Math.PI * 2;
                        const x = centerX + Math.cos(angle) * radius;
                        const y = centerY + Math.sin(angle) * radius;

                        positions[index * 2 + 0] = x;
                        positions[index * 2 + 1] = y;

                        const size = 20 + ring * 5;
                        sizes[index * 2 + 0] = size;
                        sizes[index * 2 + 1] = size;

                        // Color por anillo
                        const hue = (ring * 40) % 360;
                        const color = hslToHex(hue, 70, 50);
                        const rgba = hexToRgba(color);

                        colors[index * 4 + 0] = rgba.r;
                        colors[index * 4 + 1] = rgba.g;
                        colors[index * 4 + 2] = rgba.b;
                        colors[index * 4 + 3] = rgba.a;

                        index++;
                    }
                }

                // Spawn en batch
                const ids = await bridge.bulk_spawn(positions, sizes, colors);

                // Convertir a círculos
                const ecb = bridge.create_ecb(ids.length);
                for (let i = 0; i < ids.length; i++) {
                    ecb.set_shape(ids[i], 1); // 1 = Circle
                }
                await bridge.execute_ecb(ecb);

                return ids.length;
            }

            function setupCanvasContext() {
                console.log(`
════════════════════════════════════════════════════════════════════════════════
📖 COOKBOOK EXAMPLE 2 - Bulk Spawn
════════════════════════════════════════════════════════════════════════════════

This example demonstrates:
  ✓ spawnGrid() - Create 10x10 grid efficiently (100 entities)
  ✓ spawnParticles() - 500 particles with velocities
  ✓ spawnConcentricCircles() - Concentric ring pattern
  ✓ Performance comparison: ~30x faster than individual spawn

PERFORMANCE NOTES:
  ├─ bulk_spawn() → 1 JS→WASM call for 100 entities
  └─ spawn_entity() loop → 100 JS→WASM calls (30x SLOWER!)

CONTROLS:
  ✓ "Grid (10x10)" - 100 entities in grid pattern
  ✓ "Particles (500)" - 500 particles with explosion effect
  ✓ "Concentric" - Concentric circles pattern
  ✓ "Clear" - Remove all entities

════════════════════════════════════════════════════════════════════════════════
            `);

                updateInfo("✓ Ready! Click a button to spawn entities");
            }

            function updateInfo(message) {
                const info = document.getElementById("info");
                if (info) info.textContent = message;
            }

            function updateStats(message) {
                const stats = document.getElementById("stats");
                if (stats) stats.textContent = message;
            }

            function hslToHex(h, s, l) {
                s /= 100;
                l /= 100;
                const a = s * Math.min(l, 1);
                const f = (n, k) => (n + k) % 12;
                const u = l < 0.5 ? 2 * n * l : l + n - 0.5;
                const v = 2 * a * f - f - 1;

                const r = Math.round(255 * (l * (1 - s) * (1 - v)));
                const g = Math.round(255 * (l * (1 - s) * (1 - v) * (v + 1)));
                const b = Math.round(255 * (l * (1 - s) * (1 - v) * (v - 1)));

                return `#${r.toString(16).padStart(2, "0")}${g.toString(16).padStart(2, "0")}${b.toString(16).padStart(2, "0")}`;
            }

            // Inicializar
            init();

            // Expose functions to window for onclick handlers
            window.spawnGrid = spawnGrid;
            window.spawnParticles = spawnParticles;
            window.spawnRings = spawnRings;
            window.clearScene = clearScene;
        </script>
    </body>
</html>
